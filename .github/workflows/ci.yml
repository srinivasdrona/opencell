name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3am UTC

jobs:
  # ── Tier 1: Fast PR checks (lint + unit + property) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint with ruff
        run: ruff check opencell/ tests/
      - name: Check naked biology numbers
        run: python tools/naked_numbers_lint.py opencell/models || true  # advisory for now

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -x -v --tb=short -m "not slow"

  test-property:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run property-based tests
        run: pytest tests/property/ -x -v --tb=short || true  # no property tests yet

  # ── Tier 2: Nightly scientific regression ──
  test-scientific:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run scientific tests
        run: pytest tests/ -x -v --tb=long -m "scientific" || true

  # ── Tier 3: Gate tests (Phase 1→2 analytical validation) ──
  gate-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run gate tests
        run: pytest tests/ -x -v --tb=long -m "gate" || true

  # ── Schema validation ──
  validate-schemas:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate data files against schemas
        run: python -c "from opencell.orchestrator.contracts import validate_parameter_file; print('Schema validation ready')"
