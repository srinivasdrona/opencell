name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'  # Nightly at 3am UTC

jobs:
  # ── Tier 1: Fast PR checks (lint + unit + property) ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint with ruff
        run: ruff check opencell/ tests/
      - name: Lint new provenance/llm_log surface strictly (no debt allowed in new code)
        run: ruff check opencell/provenance/llm_log.py tests/provenance/
      - name: Check naked biology numbers
        run: python tools/naked_numbers_lint.py opencell/models

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ -x -v --tb=short -m "not slow"

  test-property:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run property-based tests
        run: pytest tests/property/ -x -v --tb=short || true  # no property tests yet

  # ── L1b gates (method-completeness + wiring conformance) — BLOCKING ──
  # Both L1b halves are enforced on every PR and push. No `|| true`: a failure
  # here blocks the merge. The wiring gate auto-skips MATLAB-anchor resolution
  # when data/m1_sources/WholeCell (a gitignored external clone) is absent, which
  # it is in CI; those anchors are verified locally / in the nightly full-source
  # job. All other 12 wiring checks run against tracked repo data.
  l1b-gates:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: L1b Half A — method completeness (gap must be 0/115)
        run: python scripts/l1b_method_completeness.py
      - name: L1b Half B — wiring conformance (28/28 rows must PASS)
        run: python scripts/l1b_verify_wiring.py
      - name: L1b wiring gate self-tests
        run: pytest tests/integration/test_l1b_verify_wiring.py -q

  # ── L2.0 observable-schema gate — BLOCKING ──
  # Verifies, for each of the 28 Karr processes, that karr_obs ⊆ oc_obs
  # (every channel the .mat oracle records under states_before/ is emitted by
  # the OC process's ports_schema()). A RED/AMBER/ERROR verdict blocks the merge.
  # The per-process *.mat oracle inputs are gitignored external artifacts absent
  # in CI, so the gate script SKIPs cleanly (exit 0) on the hosted runner and is
  # enforced locally / in the nightly full-source job — mirroring the L1b wiring
  # gate's MATLAB-anchor skip. The pure gate logic (verdict + _gate_result +
  # oracle-absent SKIP path) is covered unconditionally by the self-tests below.
  l2-0-gate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: L2.0 observable-schema gate (karr_obs ⊆ oc_obs; 28/28 GREEN or clean SKIP)
        run: python scripts/probe_l2_0_schema_audit.py
      - name: L2.0 schema gate self-tests
        run: pytest tests/integration/test_l2_0_schema_gate.py -q

  # ── Gate 1 input-spec freeze gate — BLOCKING ──
  # Verifies that the committed frozen Karr input-spec artifact remains locked
  # to the tracked per-process fixtures: the committed MANIFEST must cover the
  # exact 28 processes, the committed spec/fixture bytes must match the
  # MANIFEST hashes, and a clean re-derivation from fixtures must reproduce
  # byte-identical YAMLs plus MANIFEST.json. Fixtures are tracked in-repo, so
  # this gate runs unconditionally in CI.
  gate1-freeze:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Gate 1 — Karr input-spec freeze (spec==fixture + MANIFEST hash-lock)
        run: python scripts/gate1_verify_spec_freeze.py
      - name: Gate 1 freeze self-tests
        run: pytest tests/integration/test_gate1_freeze_gate.py -q

  gate2-oc-vs-spec:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Gate 2 — OC process inputs vs frozen spec (ordered vocab + signed stoich; state-usage/constants are INFO)
        run: python scripts/gate2_verify_oc_vs_spec.py
      - name: Gate 2 self-tests
        run: pytest tests/integration/test_gate2_oc_vs_spec_gate.py -q

  # ── Tier 2: Nightly scientific regression ──
  test-scientific:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run scientific tests
        run: pytest tests/ -x -v --tb=long -m "scientific" || true

  # ── Tier 3: Gate tests (Phase 1→2 analytical validation) ──
  gate-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run gate tests
        run: pytest tests/ -x -v --tb=long -m "gate" || true

  # ── Schema validation ──
  validate-schemas:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Validate data files against schemas
        run: python -c "from opencell.orchestrator.contracts import validate_parameter_file; print('Schema validation ready')"
