# PROPOSED registry row fragment for Cytokinesis -- NOT a live registry
# file and NOT wired into scripts/l2_event/registry.py's loader.
#
# Round 2 (l2-event-cytokinesis case directive, operator-corrected):
# adapter_id changed from the rejected round-1 value
# `cytokinesis.division_complete.v1` to `cytokinesis.pinched_diameter_completion.v1`
# to match the round-2 source-faithful pinchedDiameter onset/completion
# model (see CYTOKINESIS_ADAPTER_REPORT.md §0 for why round 1 was
# rejected). Scope note: this task implements the Cytokinesis adapter +
# its own tests only. It explicitly does NOT edit
# docs/phase_f/l2_event/event_registry.yaml (which stays frozen at
# adapter_status: not_implemented / adapter_id: null for Cytokinesis).
# This file is a proposal a future registry-owning task can diff against
# and fold in -- flipping the two fields below (adapter_id,
# adapter_status) is the ONLY registry change this adapter's existence
# would justify; every other field is unchanged from the authoritative
# row in event_registry.yaml today.
#
# Preconditions for actually landing this flip (NOT satisfied by this
# task, and not claimed to be):
#   1. A real MATLAB event-window extractor for Cytokinesis must exist
#      and produce >=1 seed of per_process_traces_v2_event_s{seed:03d}/
#      Cytokinesis_100ticks.mat, sampling the real `pinchedDiameter`
#      channel (0/50 seeds exist on disk today -- see event_registry.yaml's
#      current Cytokinesis notes and L2_EVENT_FOUNDATION_STATUS.md). Until
#      then `adapter_status` must stay at most `structural_smoke_only`,
#      matching RibosomeAssembly's current precedent (1/50 real seeds,
#      still smoke-only).
#   2. The extractor must expose a `window_anchor` value on real
#      Cytokinesis traces, AND that value must be validated (by whichever
#      component owns real gate promotion -- not this adapter) to equal
#      this adapter's own data-derived contraction-onset tick (the first
#      strict `pinchedDiameter` decrease, per `find_onset_tick`), in the
#      SAME tick-index coordinate system. This adapter deliberately does
#      NOT read `window_anchor` or `WindowGrid.tick_offset` anywhere in
#      its own timing arithmetic (verified via an AST-based regression
#      test) -- timing is derived purely from the pinchedDiameter
#      sequence itself, per the ratified 2026-08-02 operator timing
#      decision. Gate-mode wiring against real data remains BLOCKED on
#      this cross-check existing, not on anything this branch controls.
#   3. 50 real seeds (or the registry's required_n_seeds count) must be
#      available to actually run evaluate_gate in "gate" mode, not just
#      "smoke" mode.

process: Cytokinesis
in_scope_v4: true
adapter_id: cytokinesis.pinched_diameter_completion.v1
adapter_status: structural_smoke_only  # NOT gating_ready -- see preconditions above
event_timing_model: single_firing
magnitude_gateable: false
required_n_seeds: 50
deferred_reason: null
notes: >
  PROPOSAL ONLY (l2-event-cytokinesis case directive; not applied to the
  live registry). scripts/l2_event/adapters/cytokinesis.py implements
  CytokinesisEventAdapter: a stateless, per-tick single-firing completion
  detector over the real `geometry.pinchedDiameter` channel (both Karr-
  and OC-side), replacing round 1's extractor-invented
  `cell.division_complete` channel and its `tick_offset`-anchored timing
  (rejected by the operator -- see CYTOKINESIS_ADAPTER_REPORT.md §0).
  Timing (`t_completion - t_onset`) is derived entirely from adapter-local
  sequence-scanning helpers (`find_onset_tick`/`find_completion_tick`/
  `single_fire_offset_from_sequences`) over a complete per-seed
  pinchedDiameter sequence -- never from `WindowGrid.tick_offset` or any
  `window_anchor` metadata scalar (verified via an AST-based regression
  test asserting no such attribute access exists in the adapter module).
  tests/scripts/test_l2_event_adapters_cytokinesis.py (58 collected test
  cases) exercises this end-to-end through evaluate_gate on synthetic
  50-seed cohorts (PASS, 44/50-refuses, wrong-onset-FAIL,
  spurious-OC-fire-FAIL, quiet-trace-refuses scenarios), the
  re-audited required-input manifest (dynamic `enzymes`/`boundEnzymes`/
  WATER validation against a real KarrCytokinesisProcess, explicitly
  excluding the vestigial `cell.ftsz_ring_complete` and unread GTP paths),
  and a metadata-independence proof that `tick_offset` changes cannot
  alter the derived offset, plus one real-code-path integration test
  against the actual KarrCytokinesisProcess. No MATLAB extraction was
  performed and no real event-window trace exists for this process yet,
  so this row's adapter_status is proposed as structural_smoke_only
  (matching the RibosomeAssembly precedent for "adapter code exists, but
  real gating data does not"), NOT gating_ready -- promoting to
  gating_ready additionally requires the extractor to expose and validate
  `window_anchor` against this adapter's own derived onset (see
  precondition 2 above), a decision for whichever task lands the
  extractor and the 50 real seeds. See
  docs/phase_f/l2_event/CYTOKINESIS_ADAPTER_REPORT.md for the full
  rule-by-rule verification, the round-1-vs-round-2 discrepancy
  accounting, and the exact anchor-formula/extraction requirements a
  future extractor must satisfy.
