# Proposed future row (NOT applied — data prerequisites unmet):

- process: RibosomeAssembly
  in_scope_v4: true
  adapter_id: ribosome_assembly.gate.v1
  adapter_status: gating_ready
  event_timing_model: repeated_firing
  magnitude_gateable: true
  required_n_seeds: 50
  deferred_reason: null
  notes: >
    PROPOSED, NOT YET ELIGIBLE. ribosome_assembly.gate.v1
    (scripts/l2_event/adapters/ribosome_assembly_gate.py) normalizes Karr
    complexs-channel tick incidence and OC
    update.get('complex', {}).get('counts', {}) payload to the fixed WID
    pair {RIBOSOME_30S, RIBOSOME_50S} (index 0 -> 30S, 1 -> 50S, confirmed
