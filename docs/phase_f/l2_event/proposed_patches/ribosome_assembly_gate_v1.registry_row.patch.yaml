    round-trip on the existing seed-000 trace reproduces fire ticks [9, 17]
    and the expected payload keys, and 20 synthetic-cohort tests exercise
    count/timing/payload PASS and FAIL paths end to end via evaluate_gate.
    This row must NOT be merged as gating_ready until: (1) 49 additional
    event-window seeds exist under
    data/m1_sources/karr_native/per_process_traces_v2_event_s{001..049}/
    RibosomeAssembly_100ticks.mat, and (2) all 50 seed files (including a
    re-extracted seed 000) carry the complete M4 stride/tick_start/tick_end
    (or window_anchor) metadata contract -- the current seed-000 file
    predates that contract and triggers INCOMPLETE_WINDOW today. See
    docs/phase_f/l2_event/RIBOSOME_ASSEMBLY_GATE_ADAPTER_REPORT.md for the
    verified refusal evidence. No MATLAB/Octave extraction was performed to
    produce this proposal.
