# L2.event registry (schema_version 1)
#
# This is a NEW, separate file from
# docs/phase_f/l2_2_design_a/PROCESS_CATALOG.yaml. It must never be merged
# into that catalog or edited by process-branch tasks without going through
# scripts/l2_event/registry.py's validate_against_catalog() cross-check --
# see docs/phase_f/l2_event/EVENT_REGISTRY_SCHEMA.md for the full field
# reference and docs/phase_f/l2_event/L2_EVENT_FOUNDATION_STATUS.md for the
# ground-truth data-availability audit this registry was built against.
#
# Fields per process row:
#   process             - canonical Karr process name (must match
#                          PROCESS_CATALOG.yaml processes[].name exactly)
#   in_scope_v4         - true only for the two processes
#                          L2_EVENT_GATE_SPEC_v4.md §8 puts in scope
#                          (Cytokinesis, RibosomeAssembly)
#   adapter_id          - stable adapter identifier (D7). null if no adapter
#                          implementation exists yet.
#   adapter_status      - one of:
#                           not_implemented       - no adapter code exists
#                           structural_smoke_only - a read-only adapter
#                                                    exists for loader/shape
#                                                    smoke tests ONLY; it
#                                                    must never be used to
#                                                    compute a gate verdict
#                           gating_ready           - (not used yet by any
#                                                     process in this task)
#   event_timing_model  - "single_firing" | "repeated_firing" | null
#                          (D2 addendum)
#   magnitude_gateable  - whether a non-redundant payload channel exists to
#                          gate on (D6). false => runner must emit
#                          NOT_GATEABLE_REDUNDANT for the payload channel,
#                          never skip it silently.
#   required_n_seeds    - ensemble size the catalog's universals/N_seeds
#                          field requires for this process; the runner
#                          refuses to compute a gate verdict from fewer
#                          seeds (requirement 4).
#   deferred_reason     - non-null only for out-of-v4-scope processes.
#   notes               - free-text provenance/audit trail.

schema_version: 1
generated_from_catalog: docs/phase_f/l2_2_design_a/PROCESS_CATALOG.yaml
spec_ref: docs/phase_f/L2_EVENT_GATE_SPEC_v4.md

processes:
  - process: Cytokinesis
    in_scope_v4: true
    adapter_id: cytokinesis.pinched_diameter_completion.v1
    adapter_status: structural_smoke_only
    event_timing_model: single_firing
    magnitude_gateable: false
    required_n_seeds: 50
    deferred_reason: null
    notes: >
      In v4 scope (spec §8, D6). Canary D closed 2026-08-05: 1 of 50
      required event-window seeds now exists on disk (seed 000 under
      data/m1_sources/karr_native/per_process_traces_v2_event_s000/
      Cytokinesis_4000ticks.mat), regenerated after the mnrnd shim repair
      (mnrnd_shim_version=1, sha256=819218f9c4db0e9b24606e6bd9d34dd
      31600bfbdc764c8c46e17bf72da391e67) and validated against the full M4
      contract. IMPORTANT finding: the catalog's `M_ticks: 100` default is
      NOT sufficient to capture a real single-firing anchor window -- this
      seed's real onset-to-completion span is 3871 ticks (onset_tick=27556,
      completion/window_anchor=31427), far outside the catalog's assumed
      [-50,0] division-relative range; n_ticks=4000 was required for the
      extractor's fail-closed capture buffer to hold the whole interval.
      Catalog reconciled 2026-08-05 to `M_ticks: 4000` / seed_window
      [-3999,0] (the validated seed-0 LOWER BOUND, not yet a confirmed
      cohort-wide maximum) -- see PROCESS_CATALOG.yaml's
      `event_sweep_blocked_on` note (2026-08-06: renamed from `blocked_on`,
      which collided with derive_l25_pair_matrix.py's generic L2.2
      pass/fail fallback).
      `adapter_id` here is `CytokinesisEventAdapter.adapter_id` (the real,
      registered adapter for this process -- see
      scripts/l2_event/adapters/cytokinesis.py), but `adapter_status` stays
      `structural_smoke_only` because ONLY its read-only, Karr-side-only
      helpers (karr_pinched_diameter_sequence/find_onset_tick/
      find_completion_tick) are exercised by this evidence -- NOT an
      OC-vs-Karr comparison via `CytokinesisEventAdapter.oc_observation`:
      this anchor trace's snapshot only carries boundEnzymes/enzymes/
      substrates plus the 6 flattened diameter-anchor scalars, not the full
      geometry/ftsZRing/chromosome objects an OC replay would need (see
      docs/phase_f/l2_event/CYTOKINESIS_ADAPTER_REPORT.md). Per D6,
      magnitude is NOT_GATEABLE_REDUNDANT until the OC port grows a
      non-redundant payload; count + timing are the two gating channels.
      N=50 sweep remains unauthorized until a 50-seed onset-span survey
      (scripts/l2_event/survey_cytokinesis_onset_span.py) determines the
      real cohort-wide maximum span -- the reconciled M_ticks=4000 is only
      a seed-0-validated lower bound, never assumed sufficient for all 50
      seeds.

  - process: RibosomeAssembly
    in_scope_v4: true
    adapter_id: ribosome_assembly.gate.v1
    adapter_status: gating_ready
    event_timing_model: repeated_firing
    magnitude_gateable: true
    required_n_seeds: 50
    deferred_reason: null
    notes: >
      In v4 scope (spec §8, D2). PROMOTED to gating_ready (2026-08-05):
      all 50/50 required event-window seeds now exist on disk
      (data/m1_sources/karr_native/per_process_traces_v2_event_s{000..049}/
      RibosomeAssembly_100ticks.mat), each individually validated by
      scripts/l2_event/ribosome_assembly_seed_audit.py against the current
      scripts/matlab/mnrnd.m shim hash and the M4 stride/tick_start/
      tick_end contract, and confirmed non-aliased (no two seeds share
      file content -- see the "Critical anti-laundering finding"
      resolved: 3 of 4 stale seed-000 candidates found across sibling
      worktrees failed this validation and were discarded, never reused).
      ribosome_assembly.gate.v1 (scripts/l2_event/adapters/
      ribosome_assembly_gate.py) was applied via
      scripts/l2_event/ribosome_assembly_n50_gate.py, which builds real
      Karr + OC EventTimelines for all 50 seeds (never synthetic) and
      calls scripts.l2_event.runner.evaluate_gate directly. Computed
      verdict: PASS (count/timing/payload channels all SEED_NOISE,
      w1 statistic 0.0 on all three channels -- OC's real per-tick port,
      conditioned on Karr's own states_before, exactly reproduces Karr's
      fire ticks/payloads once the enzyme-gate DIVERGENT_BUG noted in
      PROCESS_CATALOG.yaml was fixed). See
      docs/phase_f/l2_event/evidence_bundle/RibosomeAssembly/ for the full
      result.json/input_manifest.json/provenance.json evidence. The prior
      read-only structural smoke adapter (ribosome_assembly.smoke.v1)
      remains in the repo for its own seed-0-only round-trip tests but is
      no longer this row's registered adapter.

  - process: DNADamage
    in_scope_v4: false
    adapter_id: null
    adapter_status: not_implemented
    event_timing_model: null
    magnitude_gateable: false
    required_n_seeds: 50
    deferred_reason: >
      Out of v4 scope (spec §8 out-of-scope #2): deferred to a future
      L2.stress gate because baseline Karr cycles do not spontaneously
      exercise DNADamage. No event-window trace exists on disk for
      DNADamage under any per_process_traces_v2_event_s* directory.
    notes: >
      PROCESS_CATALOG.yaml currently annotates this process "L2.2 GREEN"
      based on a *standard* quiescent per-tick replay (both OC and Karr
      produce 0 events under no-stimulus conditions). Per this spec's own
      D3 rule (T_karr=0 precedence), that pattern is exactly the vacuous
      zero==zero PASS the L2.event design exists to refuse -- it is not
      evidence of a calibrated event-gate PASS. See
      L2_EVENT_FOUNDATION_STATUS.md for the full correction.

  - process: FtsZPolymerization
    in_scope_v4: false
    adapter_id: null
    adapter_status: not_implemented
    event_timing_model: null
    magnitude_gateable: false
    required_n_seeds: 50
    deferred_reason: >
      Out of v4 scope (spec §8 out-of-scope #1): gradient/continuous
      polymerization process, not a binary firing event; v0.3 already
      deferred it and v4 does not reopen the decision. No event-window
      trace exists on disk for FtsZPolymerization under any
      per_process_traces_v2_event_s* directory.
    notes: >
      M5 (Opus5 review): FtsZPolymerization SHOULD leave the event-class
      profile entirely -- it is a continuous/gradient process, not a
      binary firing event, so "in_scope_v4: false" undersells the
      correction; this is a candidate reclassification pending an
      explicit catalog-owning decision (out of this task's no-catalog-
      edits scope). This row is kept here (rather than deleted) purely so
      registry.validate_against_catalog()'s bidirectional event_class
      coverage check has a place to record the catalog's current
      harness_type="event_class" classification for it. Per M5, any
      future reclassification of THIS row (in either direction) must
      never cause validate_against_catalog() to refuse unrelated in-scope
      rows (Cytokinesis, RibosomeAssembly) -- the harness_type check is
      scoped to `in_scope_v4: true` rows only, precisely to keep FtsZ's
      pending status from bricking RA's structural smoke.
      Catalog carries a seed_window (tick_range_from_division [-200, 0])
      but no event_adapter_id or event-window extraction has ever run for
      this process.
