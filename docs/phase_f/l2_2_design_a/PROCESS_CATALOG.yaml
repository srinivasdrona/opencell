# --- Universals --------------------------------------------------------------

universals:
  N_seeds: 50                            # seeds per process; constant across all in-scope buckets
  default_M_ticks: 100                   # default M for ALGORITHMIC-* unless overridden
  trivial_rng_M_ticks: 20                # smaller M for confirmation-only TRIVIAL-RNG runs
  min_events_for_distribution: 30        # per (seed-cohort), else INSUFFICIENT_SAMPLES verdict
  karr_source_pattern: "data/m1_sources/karr_native/per_process_traces_v2_s{NNN}/{Process}_100ticks.mat"
  karr_source_seed_0_legacy: "data/m1_sources/karr_native/per_process_traces_v2/{Process}_100ticks.mat"
  karr_extractor: "scripts/matlab/extract_per_process_traces_v2.m"
  oc_runner_target: "tests/vivarium/_l2_2_ensemble_runner.py"        # to be rewritten
  oc_common_target: "tests/vivarium/l2_replay_common.py"             # load_fitted_init_from_mat needs per-tick variant

# --- Buckets (test policy per stochastic class) -----------------------------
#
# Schema v3 (2026-06-11): added `harness_type` field per in-scope process.
# L2.2 = distributional fidelity gate. Two harness implementations under L2.2:
#   - design_a_per_tick: per-tick continuous comparison (current Design-A runner)
#   - event_class:       event-firing comparison (L2.event harness — TO BUILD)
# Event-class processes STAY in_scope_L2_2; they just route to a different
# harness implementation. They are NOT out-of-scope.

buckets:
  DETERMINISTIC:
    in_scope_L2_2: false
    test_required: none
    rationale: "L2.1 trace-replay is sufficient; no RNG = no distributional surface."
  TRIVIAL_RNG:
    in_scope_L2_2: true
    harness_type: design_a_per_tick
    test_required: Design-A confirmation run (M=20, N=50)
    rationale: "Closed-form Poisson/Multinomial/Binomial draws written direct to state. L2.1 lambda-integral validates rate parameter; Design-A confirms distribution SHAPE (catches Gaussian-instead-of-Poisson class of bug)."
  ALGORITHMIC_SHALLOW:
    in_scope_L2_2: true
    harness_type: design_a_per_tick
    test_required: Design-A ensemble (M=100, N=50)
    rationale: "Order-dependent allocation or single coin-flip branch; per-WID distributions need empirical check."
  ALGORITHMIC_DEEP:
    in_scope_L2_2: true
    harness_type: design_a_per_tick
    test_required: Design-A ensemble (M=100, N=50) + cross-WID correlation check
    rationale: "State-machine or rejection-loop sampling; joint distribution not closed-form."
  EVENT_CLASS:
    in_scope_L2_2: true
    harness_type: event_class
    test_required: L2.event ensemble (event-aligned, not tick-aligned)
    rationale: "Process fires << 1 event per 100 ticks (singular per-cell-cycle events). Tick-level distribution undefined; events compared in their natural window. L2.event harness must be built; in interim, design_a_per_tick runner MUST refuse these processes (not silently produce zero-W1 fake PASS)."

# --- Processes (28 canonical Karr processes + 1 allocator note) -------------
#
# Per-process schema:
#   name              : CamelCase canonical name (matches MATLAB class name)
#   oc_module         : opencell/vivarium/karr_*.py (or "" if not implemented)
#   bucket            : one of the 5 above
#   in_scope_L2_2     : bool (derived from bucket but overridable per-process)
#   M_ticks           : int (None if out of scope)
#   N_seeds           : int (default 50; only override for special cases)
#   event_density     : qualitative "dense" | "moderate" | "sparse" | "very_sparse" | "singular"
#   input_channels    : channels OC must reset from Karr each tick (state inputs)
#   output_channels   : channels measured for W1/KS comparison
#   primary_channel   : the channel used for density check / first-cut W1 threshold
#   karr_artifact     : "per_process_traces_v2" (Design A correct) | "ensembles" (Design B legacy) | "n/a"
#   rationale_M       : 1-line why M was chosen
#   notes             : free text

processes:

  # ===== ALGORITHMIC_DEEP (4) — the actual L2.2 workload ====================

  - name: Translation
    oc_module: opencell/vivarium/karr_translation.py
    bucket: ALGORITHMIC_DEEP
    in_scope_L2_2: true
    M_ticks: 100
    N_seeds: 50
    event_density: dense                  # ~100-500 elongation events/tick at steady state
    input_channels: [substrates, enzymes, boundEnzymes, monomers, rnas]
    output_channels: [substrates, monomers, boundEnzymes]
    primary_channel: monomers
    karr_artifact: per_process_traces_v2
    rationale_M: "free samples already extracted; dense event surface"
    notes: "First Design-A gate; sets harness template. Synth_rate fix from F5.1 in place (1.92/s)."

  - name: Transcription
    oc_module: opencell/vivarium/karr_transcription.py
    bucket: ALGORITHMIC_DEEP
    in_scope_L2_2: true
    M_ticks: 100
    N_seeds: 50
    event_density: moderate               # ~5-50 RNAP init/elongation events/tick
    input_channels: [substrates, enzymes, boundEnzymes, rnas]
    output_channels: [substrates, rnas, boundEnzymes]
    primary_channel: rnas
    karr_artifact: per_process_traces_v2
    rationale_M: "RNAP state machine; need M=100 to populate all transition types"
    notes: "Three variants exist (v1, v2, v3) in opencell.vivarium; gate target is canonical v1 unless plan says otherwise."

  - name: ReplicationInitiation
    oc_module: opencell/vivarium/karr_replication_initiation.py
    bucket: ALGORITHMIC_DEEP
    harness_type: design_a_per_tick     # the complexs primary IS per-tick gateable (pre-init complex binding dynamics)
    in_scope_L2_2: true
    M_ticks: 200
    N_seeds: 50
    event_density: sparse                 # init events are rare; many ticks see only complex binding/release
    input_channels: [substrates, enzymes, complexs, chromosome]
    output_channels: [substrates, complexs, chromosome]
    event_channels: [chromosome]          # init firing is singular; other channels gate normally
    primary_channel: complexs
    karr_artifact: per_process_traces_v2
    rationale_M: "complex binding dynamics need longer horizon; init event itself out-of-scope here (event-class)"
    notes: "Pre-init complex dynamics ARE tick-level distributional; init firing itself escalates to L2.event."

  - name: DNARepair
    oc_module: opencell/vivarium/karr_dna_repair.py
    bucket: ALGORITHMIC_DEEP
    in_scope_L2_2: true
    M_ticks: 200
    N_seeds: 50
    event_density: sparse                 # repair events depend on damage events; bursty
    input_channels: [substrates, enzymes, chromosome]
    output_channels: [substrates, chromosome]
    primary_channel: chromosome
    primary_projection: [repair_event_present, repair_count_by_pathway.ber_delta, repair_count_by_pathway.ner_delta, repair_count_by_pathway.hr_delta, repair_count_by_pathway.nhej_like_delta]
    primary_distance: hurdle_event_rate_plus_conditional_scaled_distance
    karr_artifact: per_process_traces_v2
    rationale_M: "rand>0.5 modification-vs-restriction branch; need enough events to see both arms"
    notes: "v1.3 (2026-06-08): primary_projection + primary_distance added per chromosome-projection critique. Hurdle structure required because event_density:sparse makes joint W1 saturate at zeros-match-zeros; gate per pathway separately so single pooled statistic cannot hide branch-specific drift. Audit flagged the 0.5 branch (line 897) as the deep-bucket trigger."

