  l1b_wiring_conformance: "PASS 28/28"
  l2_2_distributional_fidelity: "NON_GREEN: 22 PASS / 2 MISSING_EVIDENCE / 24 required"
  l2_4_chassis_conservation: "PASS 4 seeds x 100 ticks"
  qualification: >-
    These authorities retain their existing meanings. This baseline adds the
    no-known-gap eligibility property that none of them independently proves.

