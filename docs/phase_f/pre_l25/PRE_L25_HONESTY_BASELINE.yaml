schema_version: "1.0"
title: "Pre-L2.5 no-known-gap honesty baseline"
audit_base_commit: "3df0f7f"
canonical_process_count: 28
policy: >-
  A lower-gate PASS is necessary but not sufficient for L2.5 eligibility.
  Every unresolved MATLAB-to-OpenCell behavior deviation, validation-versus-
  production configuration mismatch, or stale/missing semantic adjudication
  blocks the affected process.
