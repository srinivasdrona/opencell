        kind: CODE_DEVIATION
        disposition: RESOLVED
        summary: >-
          The authoritative process emits requests before allocation and one
          post-allocation evolution Step consumes the same-tick grant exactly
          once through an explicit request-ready handshake.
        evidence:
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "2055-2118"
          - path: opencell/vivarium/karr_composite.py
            lines: "2329-2338"
          - path: opencell/vivarium/karr_composite.py
            lines: "2590-2597"
