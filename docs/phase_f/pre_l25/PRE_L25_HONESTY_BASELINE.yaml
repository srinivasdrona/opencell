      - id: CC-NONKARR-PATHS
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          The module retains aggregate compatibility state, a non-literal
          fallback, and a trace-hint outcome override outside the literal
          chromosome-binding path.
        evidence:
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "691-861"
      - id: CC-COMPARTMENT-PROJECTION
        kind: REPRESENTATION_DIFFERENCE
        disposition: ACCEPTED_EQUIVALENT
        summary: >-
          MATLAB substrate state is compartment-indexed while OpenCell uses a
          flat shared value per WID; this is behavior-equivalent here because
          every ChromosomeCondensation substrate is cytosolic-only.
        evidence:
          - path: docs/phase_f/audits/ChromosomeCondensation_semantic_audit.md
            lines: "29-29"
      - id: CC-INITIALIZATION
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          Karr initializes with twenty stochastic warm-up calls under infinite
          ATP/H2O; OpenCell seeds fixture/trace-derived state instead.
