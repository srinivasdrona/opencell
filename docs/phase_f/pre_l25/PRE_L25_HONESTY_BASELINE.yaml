schema_version: "1.0"
title: "Pre-L2.5 no-known-gap honesty baseline"
audit_base_commit: "023bda80a6b65b4ebfb72af68022ecb9f2184896"
canonical_process_count: 28
policy: >-
  A lower-gate PASS is necessary but not sufficient for L2.5 eligibility.
  Every unresolved MATLAB-to-OpenCell behavior deviation, validation-versus-
  production configuration mismatch, or stale/missing semantic adjudication
  blocks the affected process.
source_tree:
  sha256: "9dcb2830b3d4b8e75edda88512ebad10b5ef82c01914d398edb38a1896bcab81"
  file_count: 128
authorities:
  l1b_method_completeness: "PASS 115/115"
  l1b_wiring_conformance: "PASS 28/28"
  l2_2_distributional_fidelity: "NON_GREEN: 22 PASS / 2 MISSING_EVIDENCE / 24 required"
  l2_4_chassis_conservation: "PASS 4 seeds x 100 ticks"
  qualification: >-
    These authorities retain their existing meanings. This baseline adds the
    no-known-gap eligibility property that none of them independently proves.

processes:
  - name: ChromosomeCondensation
    behavior_gate: L2.2
    behavior_verdict: MISSING_EVIDENCE
    eligibility: BLOCKED_LOWER_GATE
    findings:
      - id: CC-PRODUCTION-WIRING
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          The chassis does not connect the process's enzyme/bound-enzyme ports,
          and next_update reads the previous allocation before its current
          request is granted by the post-process allocation Step.
        evidence:
          - path: opencell/vivarium/karr_composite.py
            lines: "2153-2158"
          - path: opencell/vivarium/karr_composite.py
            lines: "2377-2399"
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "691-809"
      - id: CC-NONKARR-PATHS
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          The module retains aggregate compatibility state, a non-literal
          fallback, and a trace-hint outcome override outside the literal
          chromosome-binding path.
        evidence:
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "691-861"
      - id: CC-COMPARTMENT-PROJECTION
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          MATLAB substrate state is compartment-indexed while the production
          process writes one flat shared value per WID.
        evidence:
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "650-689"
      - id: CC-INITIALIZATION
        kind: CODE_DEVIATION
        disposition: OPEN
        summary: >-
          Karr initializes with twenty stochastic warm-up calls under infinite
          ATP/H2O; OpenCell seeds fixture/trace-derived state instead.
        evidence:
          - path: opencell/vivarium/karr_chromosome_condensation.py
            lines: "440-473"

