[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencell"
version = "0.1.0"
description = "Open-source whole-cell computational simulation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Srinivas Drona", email = "dronasrinivas@gmail.com" },
]
keywords = ["whole-cell", "simulation", "systems-biology", "JAX"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "jax[cpu]>=0.4.30",
    "diffrax>=0.6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "sympy>=1.13",
    "pint>=0.24",
    "cobra>=0.29",
    "biopython>=1.84",
    "python-libsbml>=5.20",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "h5py>=3.11",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
oracle = [
    "pysces>=1.2",
    "tellurium>=2.2",
    "libroadrunner>=2.7",
]

[project.urls]
Homepage = "https://github.com/sdrona-ms/opencell"
Documentation = "https://sdrona-ms.github.io/opencell"
Repository = "https://github.com/sdrona-ms/opencell"
Issues = "https://github.com/sdrona-ms/opencell/issues"

[project.scripts]
opencell = "opencell.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "scientific: scientific validation tests",
    "gate: Phase 1->2 gate tests (must all pass before Phase 2)",
]

[tool.hatch.build.targets.wheel]
packages = ["opencell"]
