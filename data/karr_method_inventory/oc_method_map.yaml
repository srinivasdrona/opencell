schema: oc_method_map/1.0
purpose: Map each runtime_port_required Karr method to its OpenCell counterpart. Filled by source-confirmation
  fleet; enforced by the L1b method-completeness gate.
status_legend:
  needs_confirmation: "not yet verified at source \u2014 fleet TODO (a `hint` may suggest the OC location\
    \ but is non-authoritative)"
  confirmed: a real OC def implements this method (oc = file:symbol:line)
  inlined: behavior folded into a larger OC method (oc = file:parent:line, note names parent)
  gap: "genuinely absent in OC (oc = null, note explains) \u2014 a real porting gap to fix"
processes:
  ChromosomeCondensation:
    oc_files:
    - opencell/vivarium/karr_chromosome_condensation.py
    - opencell/vivarium/karr_composite.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m:calcResourceRequirements_Current:233
        status: inlined
        oc: opencell/vivarium/karr_chromosome_condensation.py:KarrChromosomeCondensationProcess.next_update:321
        note: No ChromosomeCondensation RequestCalculator exists in karr_request_calculators.py; `next_update`
          computes `request_need = float(max(0, smc_before + smc_delta))` and emits `update["requests"]`
          at lines 435-440.
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m:evolveState:240
        status: confirmed
        oc: opencell/vivarium/karr_chromosome_condensation.py:KarrChromosomeCondensationProcess.next_update:321
        note: Direct OC runtime port of Karr `evolveState`; `next_update` dissociates SMC-ADP, binds SMC,
          updates chromosome/substrates, and returns the update dict.
      calcNewRegions:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m:calcNewRegions:286
        status: inlined
        oc: opencell/vivarium/karr_chromosome_condensation.py:KarrChromosomeCondensationProcess._sample_binding_positions:693
        note: Folded into `_sample_binding_positions`; after each bind OC updates the working regions
          with `exclude_start = int((bind_pos + self._smc_exclusion_offset) % sequence_len)` and `_exclude_interval(...)`
          (lines 747-754). The file docstring says exact region-level binding is deferred to v2.
  ChromosomeSegregation:
    oc_files:
    - opencell/vivarium/karr_chromosome_segregation.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m:calcResourceRequirements_Current:179
        status: inlined
        oc: opencell/vivarium/karr_chromosome_segregation.py:KarrChromosomeSegregationProcess.next_update:364
        note: 'No ChromosomeSegregation RequestCalculator exists in karr_request_calculators.py (class
          list ends at RequestCalculatorMetabolism). Inlined in KarrChromosomeSegregationProcess.next_update:
          `request_gtp = self._request_level(can_progress, current_progress)` at line 364 and `"requests":
          {` at lines 401-405; Karr calcResourceRequirements_Current is lines 179-189.'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m:evolveState:193
        status: confirmed
        oc: opencell/vivarium/karr_chromosome_segregation.py:KarrChromosomeSegregationProcess.next_update:333
        note: Direct OC runtime port of Karr evolveState (ChromosomeSegregation.m:193-212). The same next_update
          method enforces the gate, applies progress/substrate updates, and latches `chromosome_update["segregation_complete"]
          = True` at lines 348-412.
  Cytokinesis:
    oc_files:
    - opencell/vivarium/karr_cytokinesis.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Cytokinesis.m:calcResourceRequirements_Current:166
        status: inlined
        oc: opencell/vivarium/karr_cytokinesis.py:KarrCytokinesisProcess.next_update:330
        note: Karr Cytokinesis.m:166-169; OC karr_cytokinesis.py:330/345/368 computes `water_requested
          = self._water_request(ring, geometry, chromosome_state)` and writes `update["requests"]`; no
          Cytokinesis RequestCalculator* in karr_request_calculators.py.
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Cytokinesis.m:evolveState:173
        status: confirmed
        oc: opencell/vivarium/karr_cytokinesis.py:KarrCytokinesisProcess.next_update:330
        note: Karr Cytokinesis.m:173-259; OC class docstring says "Faithful port of Karr `Process_Cytokinesis.evolveState`."
          next_update gates on segregated, runs the four phase helpers, and updates geometry/ftsZRing/cell.
      calcNextPinchedDiameter:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Cytokinesis.m:calcNextPinchedDiameter:264
        status: confirmed
        oc: opencell/vivarium/karr_cytokinesis.py:KarrCytokinesisProcess.calc_next_pinched_diameter:645
        note: Karr Cytokinesis.m:264-284 and OC karr_cytokinesis.py:645-657 use the same floored/new diameter
          formula and zero-out when result <= filament_m.
  DNADamage:
    oc_files:
    - opencell/vivarium/karr_dna_damage.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m:calcResourceRequirements_Current:469
        status: confirmed
        oc: opencell/vivarium/karr_dna_damage.py:KarrDNADamageProcess.calcResourceRequirements_Current:365
        note: Dedicated method now computes `max(0, -reactionSmallMoleculeStoichiometryMatrix @ calcExpectedReactionRates())` and `next_update` emits it on `requests`.
      calcExpectedReactionRates:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m:calcExpectedReactionRates:474
        status: inlined
        oc: opencell/vivarium/karr_dna_damage.py:KarrDNADamageProcess.next_update:313
        note: Folded into `KarrDNADamageProcess.next_update`; the rate loop does `rate_per_s = max(0.0,
          float(self.kind_rates_per_s.get(kind, 0.0)))`, applies `gate_count` from the radiation substrate,
          then `lam = rate_per_s * dt` before Poisson sampling. OC also has `expected_events_per_tick`
          (`kind_rates_per_s * dt` at 296-298), but no separate vulnerable-site helper; rates come from
          configured/trace `kind_rates_per_s` (138-151), not Karr's `calcNumberVulnerableSites` chain.
      calcNumberVulnerableSites:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m:calcNumberVulnerableSites:490
        status: confirmed
        oc: opencell/vivarium/karr_dna_damage.py:KarrDNADamageProcess.calcNumberVulnerableSites:395
        note: Dedicated helper ports Karr’s motif loop over polymerized DNA + damaged-site motif intersections (including sparse chromosome fields and MunI m6AD exclusion surface).
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m:evolveState:535
        status: confirmed
        oc: opencell/vivarium/karr_dna_damage.py:KarrDNADamageProcess.next_update:287
        note: 'Dedicated process step; `next_update` is the runtime body. It performs stochastic lesion
          creation, fork-hit detection, and returns `{"chromosome": chromosome_update}`.'
  DNARepair:
    oc_files:
    - opencell/vivarium/karr_dna_repair.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:calcResourceRequirements_Current:829
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.next_update:378
        note: 'No DNARepair RequestCalculator* exists in karr_request_calculators.py

          (search returned no matches). next_update computes

          `requests = self._substrate_needs_for_repairs(desired_repairs)` and

          emits `"requests": {self.name: {wid: float(requests[wid]) ...}}`.'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState:894
        status: confirmed
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.next_update:378
        note: 'Direct process runtime method. next_update applies the repair result

          with `if consumed_total > 0:` and writes

          `update["chromosome"] = chromosome_update`.'
      evolveState_BER:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_BER:927
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:1246
        note: 'BER is folded into pathway bucketing:

          `indices_by_pathway[self._pathway_for_damage_type(site.damage_type)].append(idx)`;

          `_pathway_for_damage_type` maps `abasic_site`/`damaged_base` -> "ber",

          and `_load_fixture` wires `"ber"` to `reactionIndexs_BER`.'
      evolveState_NER:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_NER:1096
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:1246
        note: 'NER is folded into the same pathway bucket logic:

          `_pathway_for_damage_type` maps `intrastrand_crosslink` -> "ner",

          and `_load_fixture` wires `"ner"` to `reactionIndexs_NER`.'
      evolveState_HR:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_HR:1222
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:1246
        note: 'HR is folded into pathway bucketing:

          `_pathway_for_damage_type` maps `double_strand_break` -> "hr",

          and `_load_fixture` wires `"hr"` to `reactionIndexs_HR_dsbr`.'
      evolveState_Polymerize:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Polymerize:1365
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._per_event_substrate_cost:1272
        note: 'Polymerization is abstracted as per-pathway patch cost:

          `dntp_total = float(self.pathway_patch_length_nt[pathway])`

          and `out[wid] = float(dntp_total * self.dntp_split[idx])`.

          next_update uses this helper to charge dNTP demand instead of a

          separate polymerase routine.'
      evolveState_Ligate:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Ligate:1454
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._per_event_substrate_cost:1272
        note: 'Ligase is folded into the same aggregate repair cost:

          `out[self.atp_wid] = float(self.pathway_atp_cost[pathway])`,

          and `_load_fixture` comments that

          `# NHEJ-like fallback uses ligation machinery as an aggregate proxy.`'
      evolveState_DisA:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_DisA:1488
        status: confirmed
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.evolveState_DisA:899
        note: Dedicated method builds `damagedSites_excm6AD` from sparse chromosome damage minus `m6ADMethylatedSites` and binds free DisA into `boundEnzymes` via fixture-derived index/footprint limits.
      evolveState_Modification:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Modification:1500
        status: confirmed
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.evolveState_Modification:692
        note: Dedicated method methylates `hemiunmethylatedMunIRMSites` with type-II enzyme/substrate bounds, writes m6AD into `damagedBases`, and applies fixture stoichiometry (AMET->AHCYS+H).
      evolveState_Restriction:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Restriction:1533
        status: confirmed
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.evolveState_Restriction:739
        note: Dedicated method cleaves `restrictableMunIRMSites`, writes strand breaks at selected MunI cleavage coordinates, and applies reaction stoichiometry from the fixture.
  DNASupercoiling:
    oc_files:
    - opencell/vivarium/karr_allocation_step.py
    - opencell/vivarium/karr_composite.py
    - opencell/vivarium/karr_dna_supercoiling.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m:calcResourceRequirements_Current:333
        status: inlined
        oc: opencell/vivarium/karr_dna_supercoiling.py:KarrDNASupercoilingProcess.next_update:406
        note: 'Folded into KarrDNASupercoilingProcess.next_update: request_need = self._atp_request(...)
          and update[''requests''] = {self.name: {ATP, H2O}} (560-577).'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m:evolveState:356
        status: confirmed
        oc: opencell/vivarium/karr_dna_supercoiling.py:KarrDNASupercoilingProcess.next_update:406
        note: 'KarrDNASupercoilingProcess.next_update is the runtime state step: it computes chromosome,
          substrates, boundEnzymes, and enzymes deltas, then returns update (567-644).'
      calcRNAPolymeraseBindingProbFoldChange:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m:calcRNAPolymeraseBindingProbFoldChange:510
        status: confirmed
        oc: opencell/vivarium/karr_dna_supercoiling.py:KarrDNASupercoilingProcess.calc_rna_polymerase_binding_prob_fold_change:703
        note: Dedicated structural port of Karr's sigma-thresholded linear fold-change method; next_update computes and emits tx_rate_fold_change from current linking-number supercoiling state.
  FtsZPolymerization:
    oc_files:
    - opencell/vivarium/karr_composite.py
    - opencell/vivarium/karr_ftsz_polymerization.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:calcResourceRequirements_Current:189
        status: inlined
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.next_update:216
        note: 'Karr requests GTP as `FtsZ + FtsZ_GDP` (FtsZPolymerization.m:189-193). OpenCell has no
          FtsZ-specific `RequestCalculator*` in `opencell/vivarium/karr_request_calculators.py` (the file
          defines only D2/PD/RibAsm/TRNA/RNAPathway/ProteinPathway/Transcription/Translation/ PTransloc/Metabolism
          calculators; search found no FtsZ match). Instead the request is inlined in `KarrFtsZPolymerizationProcess.next_update`,
          which computes `request_gtp = ... next_counts[...] + next_counts[...]` and emits `"requests":
          {self.name: {self.gtp_wid: request_gtp}}` at `opencell/vivarium/karr_ftsz_polymerization.py:274-283`;
          the composite instantiates the process directly and wires its `requests` / `substrates_allocated`
          ports at `opencell/vivarium/karr_composite.py:1059,1402-1406`.'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:evolveState:197
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.next_update:216
        note: 'Dedicated process-step counterpart. Like Karr `evolveState` (FtsZPolymerization.m:197-209),
          `next_update` guards on `if not np.any(current_counts): return {}`, then runs `molecules_to_concentration`
          -> `integrate_odes` -> last nonnegative ODE slice (`_last_nonnegative_solution_idx`) -> `discretize_enzymes`
          -> `apply_substrate_limits` at `opencell/vivarium/karr_ftsz_polymerization.py:225-253,589-593`.'
      integrateODEs:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:integrateODEs:220
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.integrate_odes:295
        note: Dedicated ODE-solver wrapper. Karr packs the eight kinetic parameters plus substrate concentrations
          before integrating over one step (FtsZPolymerization.m:220-236); OpenCell does the same parameter
          packing at `opencell/vivarium/karr_ftsz_polymerization.py:305-318` and solves with `solve_ivp(...,
          jac=self.ode_jacobian, rtol=..., atol=..., max_step = 0.1 * timestep)` at `opencell/vivarium/karr_ftsz_polymerization.py:322-330`.
      discretizeEnzymes:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:discretizeEnzymes:374
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.discretize_enzymes:405
        note: Dedicated discretizer. Both versions start from concentration->molecule stochastic rounding
          and then loop until monomer balance is restored by moving mass between adjacent polymer bins
          (FtsZPolymerization.m:374-390; opencell/vivarium/karr_ftsz_polymerization.py:411-427).
      applySubstrateLimits:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:applySubstrateLimits:403
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.apply_substrate_limits:438
        note: Dedicated substrate-limit clamp. OpenCell reproduces Karr's two while loops on GTP first
          and GDP/water second, then updates GTP/GDP counts and applies the `[1,-1,1,-1,1] * gdp_shortfall`
          correction (FtsZPolymerization.m:403-434; opencell/vivarium/karr_ftsz_polymerization.py:448-477).
      moleculesToConcentration:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:moleculesToConcentration:436
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.molecules_to_concentration:481
        note: 'Direct helper match: both divide molecule counts by Avogadro * cell volume (FtsZPolymerization.m:436-438;
          opencell/vivarium/karr_ftsz_polymerization.py:481-482).'
      concentrationToMolecules:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m:concentrationToMolecules:441
        status: confirmed
        oc: opencell/vivarium/karr_ftsz_polymerization.py:KarrFtsZPolymerizationProcess.concentration_to_molecules:484
        note: 'Direct helper match: both multiply concentration by Avogadro * cell volume (FtsZPolymerization.m:441-443;
          opencell/vivarium/karr_ftsz_polymerization.py:484-485).'
  HostInteraction:
    oc_files:
    - opencell/vivarium/karr_composite.py
    - opencell/vivarium/karr_host_interaction.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/HostInteraction.m:calcResourceRequirements_Current:266
        status: noop
        oc: null
        note: BENIGN (Karr returns zeros(size(this.substrates)); process makes no per-tick request, so
          OC correctly has no request path). rg found no HostInteraction symbol in karr_request_calculators.py;
          karr_host_interaction.py has no requests port, and karr_composite.py only adds the process at
          2449-2453. The zero-result calcResourceRequirements_Current is therefore not implemented explicitly.
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/HostInteraction.m:evolveState:271
        status: confirmed
        oc: opencell/vivarium/karr_host_interaction.py:KarrHostInteractionProcess.next_update:255
        note: HostInteraction.m evolveState (271-300) maps to KarrHostInteractionProcess.next_update;
          the OC docstring says this is Karr-light v1 and defers TLR/NFkB/inflammatory-response signaling.
  MacromolecularComplexation:
    oc_files:
    - opencell/vivarium/karr_allocation_step.py
    - opencell/vivarium/karr_macromolecular_complexation.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/MacromolecularComplexation.m:calcResourceRequirements_Current:285
        status: confirmed
        oc: opencell/vivarium/karr_request_calculators.py:RequestCalculatorD2.next_update:87
        note: Karr MacromolecularComplexation.m:285 returns zeros(size(this.substrates)); OC wires RequestCalculatorD2
          to d2_proc in karr_composite.py:756-784 and RequestCalculatorD2.next_update returns zero requests.
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/MacromolecularComplexation.m:evolveState:290
        status: confirmed
        oc: opencell/vivarium/karr_macromolecular_complexation.py:MacromolecularComplexationProcess.next_update:206
        note: Karr MacromolecularComplexation.m:290 forms complexes and subtracts complexComposition*newComplexs;
          OC MacromolecularComplexationProcess.next_update:206 reads substrates_allocated, builds complexes,
          and returns substrate/complex deltas.
  Metabolism:
    oc_files:
    - opencell/m1/calc_flux_bounds.py
    - opencell/m1/compartmented.py
    - opencell/m1/karr_metabolism_writeback.py
    - opencell/vivarium/karr_allocation_step.py
    - opencell/vivarium/karr_metabolism.py
    - opencell/vivarium/karr_request_calculators.py
    runtime_methods:
      calcResourceRequirements_Current:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m:calcResourceRequirements_Current:1188
        status: confirmed
        oc: opencell/vivarium/karr_request_calculators.py:RequestCalculatorMetabolism.next_update:806
        note: 'Karr has a dedicated current-demand method (`function result = calcResourceRequirements_Current(this)`
          at Metabolism.m:1188). OC has a dedicated request-step counterpart: `RequestCalculatorMetabolism`
          says "Emit allocator requests for dynamic-bounds metabolism substrate demand", then `requests
          = {wid: max(0.0, float(self._m1_proc._last_allocation_demand.get(wid, 0.0))) ...}` and `return
          {"requests": {self._m1_proc.name: requests}}`.'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m:evolveState:1200
        status: confirmed
        oc: opencell/vivarium/karr_metabolism.py:KarrMetabolismProcess.next_update:386
        note: 'Karr''s runtime entry `function evolveState(this)` first does `[this.metabolicReaction.growth,
          this.metabolicReaction.fluxs, fbaReactionFluxs] = this.calcGrowthRate(this.calcFluxBounds(...))`
          and then mutates substrates. OC''s runtime entry is `KarrMetabolismProcess.next_update`, which
          dispatches with `if not self.dynamic_bounds: return self._static_update(timestep, states)` /
          `return self._dynamic_update(timestep, states)`; those branches call `km.solve_fba(...)` and
          apply substrate writeback.'
      calcGrowthRate:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m:calcGrowthRate:1264
        status: confirmed
        oc: opencell/m1/karr_metabolism.py:solve_fba:373
        note: Karr's helper solves the LP via `ComputationUtil.linearProgramming(...)` and sets `growth
