        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.next_update:317
        note: 'No DNARepair RequestCalculator* exists in karr_request_calculators.py

          (search returned no matches). next_update computes

          `requests = self._substrate_needs_for_repairs(desired_repairs)` and

          emits `"requests": {self.name: {wid: float(requests[wid]) ...}}`.'
      evolveState:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState:894
        status: confirmed
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess.next_update:317
        note: 'Direct process runtime method. next_update applies the repair result

          with `if consumed_total > 0:` and writes

          `update["chromosome"] = chromosome_update`.'
      evolveState_BER:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_BER:927
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:678
        note: 'BER is folded into pathway bucketing:

          `indices_by_pathway[self._pathway_for_damage_type(site.damage_type)].append(idx)`;

          `_pathway_for_damage_type` maps `abasic_site`/`damaged_base` -> "ber",

          and `_load_fixture` wires `"ber"` to `reactionIndexs_BER`.'
      evolveState_NER:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_NER:1096
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:678
        note: 'NER is folded into the same pathway bucket logic:

          `_pathway_for_damage_type` maps `intrastrand_crosslink` -> "ner",

          and `_load_fixture` wires `"ner"` to `reactionIndexs_NER`.'
      evolveState_HR:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_HR:1222
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._desired_repairs:678
        note: 'HR is folded into pathway bucketing:

          `_pathway_for_damage_type` maps `double_strand_break` -> "hr",

          and `_load_fixture` wires `"hr"` to `reactionIndexs_HR_dsbr`.'
      evolveState_Polymerize:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Polymerize:1365
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._per_event_substrate_cost:704
        note: 'Polymerization is abstracted as per-pathway patch cost:

          `dntp_total = float(self.pathway_patch_length_nt[pathway])`

          and `out[wid] = float(dntp_total * self.dntp_split[idx])`.

          next_update uses this helper to charge dNTP demand instead of a

          separate polymerase routine.'
      evolveState_Ligate:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Ligate:1454
        status: inlined
        oc: opencell/vivarium/karr_dna_repair.py:KarrDNARepairProcess._per_event_substrate_cost:704
        note: 'Ligase is folded into the same aggregate repair cost:

          `out[self.atp_wid] = float(self.pathway_atp_cost[pathway])`,

          and `_load_fixture` comments that

          `# NHEJ-like fallback uses ligation machinery as an aggregate proxy.`'
      evolveState_DisA:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_DisA:1488
        status: gap
        oc: null
        note: 'Searched karr_dna_repair.py for `DisA`/`damagedSites_excm6AD`; only the

          top docstring says this is deferred to v2. OC has no runtime code that

          binds DisA or writes chromosome damage state, so the Karr scan/binding

          behavior is absent.'
      evolveState_Modification:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Modification:1500
        status: gap
        oc: null
        note: 'Searched karr_dna_repair.py for `hemiunmethylatedMunIRMSites`/`m6AD`/

          `restrict` and found only the lumped `rm_methylation` metabolite tweak in

          next_update (`AMET` -> `AHCYS` + `H`). OC never does Karr''s site-level

          methylation or `c.damagedBases(posStrnds) = ...m6AD` writeback.'
      evolveState_Restriction:
        matlab: data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m:evolveState_Restriction:1533
        status: gap
        oc: null
        note: 'Searched karr_dna_repair.py for `restrictableMunIRMSites` / strand-break

          writeback and found no site-level restriction logic. Karr cleaves

          unmethylated MunI sites; OC has no corresponding chromosome update.'
