schema: oc_method_map/1.0
purpose: Map each runtime_port_required Karr method to its OpenCell counterpart. Filled by source-confirmation
  fleet; enforced by the L1b method-completeness gate.
status_legend:
  needs_confirmation: "not yet verified at source \u2014 fleet TODO (a `hint` may suggest the OC location\
    \ but is non-authoritative)"
  confirmed: a real OC def implements this method (oc = file:symbol:line)
  inlined: behavior folded into a larger OC method (oc = file:parent:line, note names parent)
  gap: "genuinely absent in OC (oc = null, note explains) \u2014 a real porting gap to fix"
