      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m"
        lines: "469-471"
        note: "MATLAB implements calcResourceRequirements_Current as max(0, -reactionSmallMoleculeStoichiometryMatrix * calcExpectedReactionRates())."
