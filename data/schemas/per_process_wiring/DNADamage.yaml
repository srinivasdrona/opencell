schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "DNADamage"
  matlab_class: "DNADamage"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m"
  oc_class: "KarrDNADamageProcess"
  oc_file: "opencell/vivarium/karr_dna_damage.py"
  whole_cell_model_id: "Process_DNADamage"
  functional_area: "dna-replication-and-maintenance"
  state_shape_role: "chromosome-primary stochastic damage writer with flat substrate surface"
  notes: "The canonical MATLAB source file is not present in this checkout; the local verbatim extract doc is the only source-backed proxy available
    here."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/process/04_DNADamage.md"
        lines: "134-178"
        note: "Verbatim extract shows direct substrate/stimulus usage and the reaction matrix split, but no allocator request block is exposed
          in the local extract."
      note: "DNADamage is treated as direct-state damage chemistry rather than an allocator-coupled resource consumer in the available source."
    oc:
      symbol: "not_implemented"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "111-226"
        note: "Current OC port exposes only chromosome damage state plus direct `substrates` reads; there is no request-calculator or `substrates_allocated`
          path."
    status: "not_implemented"
    note: "The current OC port bypasses allocator mediation."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/04_DNADamage.md"
        lines: "168-179"
        note: "Simulation steps: compute vulnerability, select damage, mark chromosome damage state, then adjust free metabolites."
      note: "This is the damage-creation / state-writeback loop described in the extract."
    oc:
      symbol: "KarrDNADamageProcess.next_update"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "228-294"
        note: "Current OC per-tick update: Poisson lesion sampling, chromosome damage writeback, and replication-stall flagging."
      supporting:
        - path: "opencell/vivarium/karr_dna_damage.py"
          lines: "243-253"
          note: "Direct radiation-gated substrate reads from `states[\"substrates\"]`."
        - path: "opencell/vivarium/karr_dna_damage.py"
          lines: "267-292"
          note: "Chromosome update construction and stall flag emission."
      note: "The OC port intentionally stops at lesion creation and advisory stall signaling."
    status: "partial"
    note: "Repair chemistry and full reaction stoichiometry are deferred in the current OC port."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "docs/karr_extracts/process/04_DNADamage.md"
        lines: "146-179"
        note: "The available extract describes reaction matrices and simulation behavior, but does not surface a flux-bound method for DNADamage."
      note: "No LP/flux-bound contract is visible in the local extract."
    oc:
      symbol: "not_implemented"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "111-486"
        note: "Module has no flux-bound helper or LP-bound wiring."
    status: "not_implemented"
    note: "DNADamage does not expose a flux-bound path in the current port."
allocator:
  mode:
    karr: "bypass"
    oc_current: "bypass"
    note: "The available DNADamage extract and OC port both operate directly on state; neither side exposes an allocator request surface."
  request_formula:
    matlab: "N/A; no calcResourceRequirements_Current contract is exposed in the local DNADamage extract."
    oc: "N/A; current OC reads `states[\"substrates\"]` directly and never reads `states[\"substrates_allocated\"][self.name]`."
    note: "No allocator formula is documented for this process in the local source bundle."
  requests: []
  bypasses:
    - wid: "UVB_radiation"
      compartment: "extracellular"
      source: "both"
      note: "Radiation gate read directly from the substrate pool."
    - wid: "gamma_radiation"
      compartment: "extracellular"
      source: "both"
      note: "Gamma-radiation gate read directly from the substrate pool."
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Water participates in several lesion chemistries, but not through allocator mediation."
    - wid: "H"
      compartment: "cytosol"
      source: "both"
      note: "Hydrogen ion changes arise directly in the reaction chemistry."
    - wid: "NH3"
      compartment: "cytosol"
      source: "both"
      note: "Ammonia changes arise directly in the reaction chemistry."
consume_stoichiometry:
  - wid: "UVB_radiation"
    compartment: "extracellular"
    formula_or_constant: "-1 per UV-B lesion event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "107-113"
      note: "UV-B rate table in the extract; UV-B photodimerization uses the radiation stimulus."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "247-253"
      note: "Current OC gates `uv_like` events on `states[\"substrates\"][\"UVB_radiation\"]`."
  - wid: "gamma_radiation"
    compartment: "extracellular"
    formula_or_constant: "-1 per gamma-ray lesion event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "107-113"
      note: "Gamma-ray rate table in the extract; gamma-induced oxidation and strand-break reactions are radiation-gated."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "247-253"
      note: "Current OC gates `oxidative` events on `states[\"substrates\"][\"gamma_radiation\"]`."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-1 per spontaneous base-deamination event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "146-178"
      note: "Free-metabolite stoichiometry matrix described by the extract; water is repeatedly consumed in the listed damage chemistries."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit metabolite stoichiometry writeback."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-2 per thymine-glycol / cytosine-glycol oxidation event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "146-178"
      note: "Several oxidation reactions in the extract consume two waters."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit metabolite stoichiometry writeback."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-1 per abasic-site / strand-break reaction event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "146-178"
      note: "Abasic-site and strand-break chemistries also consume water."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit metabolite stoichiometry writeback."
produce_stoichiometry:
  - wid: "AD"
    compartment: "cytosol"
    formula_or_constant: "+1 per adenine-damage product event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "170-178"
      note: "Adenine is one of the explicit base-damage outcomes in the extract."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit substrate stoichiometry deltas."
  - wid: "CSN"
    compartment: "cytosol"
    formula_or_constant: "+1 per cytosine-damage product event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "170-178"
      note: "Cytosine damage outcomes are part of the reaction table."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit substrate stoichiometry deltas."
  - wid: "GN"
    compartment: "cytosol"
    formula_or_constant: "+1 per guanine-damage product event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "170-178"
      note: "Guanine damage outcomes are part of the reaction table."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit substrate stoichiometry deltas."
  - wid: "THY"
    compartment: "cytosol"
    formula_or_constant: "+1 per thymine-release / thymine-damage product event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "170-178"
      note: "Thymine damage outcomes and base-loss reactions are described in the extract."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit substrate stoichiometry deltas."
  - wid: "DR5P"
    compartment: "cytosol"
    formula_or_constant: "+1 per abasic-site / strand-break product event"
    matlab_anchor:
      path: "docs/karr_extracts/process/04_DNADamage.md"
      lines: "170-178"
      note: "Deoxyribose-5-phosphate is one of the explicit free-metabolite products in the extract."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_damage.py"
      lines: "228-294"
      note: "Current OC does not emit substrate stoichiometry deltas."
compartment_routing:
  - wid: "UVB_radiation"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "Radiation stimulus is read directly from the flat substrate surface."
  - wid: "gamma_radiation"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "Radiation stimulus is read directly from the flat substrate surface."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is a cytosolic free-metabolite reactant."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen ion is a free-metabolite product in the sampled reaction families."
  - wid: "NH3"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Ammonia is a free-metabolite product in the sampled reaction families."
  - wid: "AD"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Adenine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "CSN"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Cytosine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "GN"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Guanine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "THY"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Thymine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "DR5P"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Deoxyribose-5-phosphate is produced by base-loss / strand-break chemistry."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen ion is produced by oxidation and strand-break chemistries."
  - wid: "NH3"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Ammonia is produced by spontaneous deamination reactions."
  - wid: "CO2"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Carbon dioxide is produced by the DHURA oxidation family."
unit_conversion_chain:
  source_units: "events/s"
  target_units: "events/tick"
  steps:
    - from_units: "events/s"
      to_units: "events/tick"
      operation: "× timestep_s"
      constants: ["timestep_s"]
      anchor:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "228-259"
        note: "Current OC computes `lam = rate_per_s * dt` before Poisson sampling."
  note: "The DNADamage rate table is already in per-second units; the OC port converts to per-tick event counts by multiplying with the tick duration
    and sampling Poisson events."
dependencies:
  produces_inputs_for:
    - "DNARepair"
  consumes_outputs_of:
    - "Metabolism"
  note: "The strongest shared-substrate link is the DNADamage→DNARepair lesion handoff; the reverse direction is the shared free-metabolite pool
    that includes water and small-molecule byproducts."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "No DNADamage-specific process-order exception is surfaced in the local extract; the only canonical hard order called out in the wider
    Karr scheduler is `tRNAAminoacylation < Translation`."
