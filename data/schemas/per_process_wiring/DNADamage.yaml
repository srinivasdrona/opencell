      symbol: "KarrDNADamageProcess.calcResourceRequirements_Current"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "365-365"
        note: "Current OC port exposes only chromosome damage state plus direct `substrates` reads; there is no request-calculator or `substrates_allocated` path. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrDNADamageProcess.calcResourceRequirements_Current"
      note: OC does not implement this Karr method.
    status: "implemented"
    note: "MATLAB implements allocator request demand in calcResourceRequirements_Current; current OC bypasses allocator mediation and does not implement this Karr method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/04_DNADamage.md"
        lines: "168-179"
        note: "Simulation steps: compute vulnerability, select damage, mark chromosome damage state, then adjust free metabolites."
        symbol: "evolveState"
      note: "This is the damage-creation / state-writeback loop described in the extract."
    oc:
      symbol: "KarrDNADamageProcess.next_update"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "287-287"
        note: "Current OC per-tick update: Poisson lesion sampling, chromosome damage writeback, and replication-stall flagging."
        symbol: "KarrDNADamageProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_dna_damage.py"
          lines: "243-253"
          note: "Direct radiation-gated substrate reads from `states[\"substrates\"]`."
          symbol: KarrDNADamageProcess.ports_schema
        - path: "opencell/vivarium/karr_dna_damage.py"
          lines: "267-292"
          note: "Chromosome update construction and stall flag emission."
          symbol: KarrDNADamageProcess.ports_schema
      note: "The OC port intentionally stops at lesion creation and advisory stall signaling."
    status: "implemented"
    note: "Repair chemistry and full reaction stoichiometry are deferred in the current OC port."
  calcFluxBounds:
    matlab:
      symbol: "DNADamage"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNADamage.m"
        lines: "146-179"
        note: "The available extract describes reaction matrices and simulation behavior, but does not surface a flux-bound method for DNADamage. Class-level anchor used to record calcFluxBounds absence."
        symbol: "DNADamage"
      note: "No LP/flux-bound contract is visible in the local extract. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrDNADamageProcess"
      source:
        path: "opencell/vivarium/karr_dna_damage.py"
        lines: "111-483"
        note: "Module has no flux-bound helper or LP-bound wiring. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrDNADamageProcess"
      note: OC does not implement this Karr method.
    status: "not_implemented"
    note: "DNADamage does not expose a flux-bound path in the current port. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "bypass"
    note: "MATLAB engages request/grant allocation via calcResourceRequirements_Current and simulation allocation injection; current OC remains allocator-bypassed."
  request_formula:
    matlab: "max(0, -reactionSmallMoleculeStoichiometryMatrix * calcExpectedReactionRates())"
    oc: "N/A; current OC reads `states[\"substrates\"]` directly and never reads `states[\"substrates_allocated\"][self.name]`."
    note: "MATLAB request formula is implemented in DNADamage.calcResourceRequirements_Current; OC has no request surface."
  requests: []
  bypasses:
    - wid: "UVB_radiation"
      compartment: "extracellular"
      source: "both"
      note: "Radiation gate read directly from the substrate pool."
    - wid: "gamma_radiation"
      compartment: "extracellular"
      source: "both"
      note: "Gamma-radiation gate read directly from the substrate pool."
    - wid: "H2O"
      compartment: "cytosol"
      source: "oc"
      note: "OC is lesion-only and allocator-bypassed; MATLAB allocates small-molecule demand before evolveState."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "OC does not emit metabolite-product deltas through an allocation-mediated path."
    - wid: "NH3"
      compartment: "cytosol"
      source: "oc"
      note: "OC does not emit metabolite-product deltas through an allocation-mediated path."
consume_stoichiometry:
