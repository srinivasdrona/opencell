stoichiometry_oracle:
  class: matrix
  record_path: data/karr_method_inventory/karr_stoichiometry/DNADamage.json
  substrate_count: 8
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "UVB_radiation"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "MATLAB uses UVB_radiation as a non-consumptive extracellular gate; current composite topology wires DNADamage only to chromosome, so OC substrate routing is not active there."
  - wid: "gamma_radiation"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "MATLAB uses gamma_radiation as a non-consumptive extracellular gate; current composite topology wires DNADamage only to chromosome, so OC substrate routing is not active there."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is a cytosolic free-metabolite reactant."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen ion is a free-metabolite product in the sampled reaction families."
  - wid: "NH3"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Ammonia is a free-metabolite product in the sampled reaction families."
  - wid: "AD"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Adenine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "CSN"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Cytosine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "GN"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Guanine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "THY"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Thymine is produced as a free-metabolite outcome in the damage matrix."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen ion is produced by oxidation and strand-break chemistries."
  - wid: "NH3"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Ammonia is produced by spontaneous deamination reactions."
  - wid: "CO2"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Carbon dioxide is produced by the DHURA oxidation family."
