deviations:
  lp_bounds_source:
    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
      lines: "183-485"
      note: "RNAProcessing.m has no calcFluxBounds method; the class only defines resource-request and evolve methods."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_processing.py"
      lines: "42-477"
      note: "No OC LP-bound helper exists for this process."
  shared_pool_projection_merges_compartments: false
  known_deviations:
    - "OC RequestCalculatorRNAPathway is shared with RNAModification and requests the current available substrate pool when active; it does not reproduce the MATLAB enzyme/unprocessedRNA cap literally."
    - "OC next_update consumes from substrates_allocated[self.name], while MATLAB evolves from the local substrates state."
    - "OC omits the MATLAB intergenicRNAs state/output entirely; the replay port only updates substrates and rna.counts."
    - "OC prefixes colliding processed RNA IDs with processed:: to keep mature and nascent pools from cancelling in the shared rna.counts store."
    - "OC can source enzyme counts from protein/complex stores when an explicit enzymes store is absent; MATLAB reads this.enzymes directly."
    - This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
  note: >-
    These deviations are replay-port simplifications and wiring choices, not
    claim of biological change. They make the current OC port auditable against
    the MATLAB source without pretending the replay layer is a byte-for-byte
    clone.
