allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: >-
      Both sides are allocation-backed. The OC process consumes
      substrates_allocated[self.name], so the request step and the per-tick
      writeback are wired through allocator mediation rather than bypassing it.
  request_formula:
    matlab: >-
      max(0, -this.reactantByproductMatrix) * min(ceil(min(this.enzymes(:, ones(size(this.catalysisMatrix, 2), 1)) ./ this.catalysisMatrix * this.stepSizeSec,
      [], 1))', this.unprocessedRNAs)
    oc: >-
      RequestCalculatorRNAPathway.next_update: if any unprocessed RNA is
      present, request max(0, substrates[wid]) for the consumed WIDs
      (ATP/GTP/H2O); otherwise request 0. Shared with RNAModification.
    note: >-
      The MATLAB formula computes an enzyme- and substrate-limited request
      vector; the current OC request step is availability-based rather than a
      literal algebraic clone.
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
  bypasses: []
