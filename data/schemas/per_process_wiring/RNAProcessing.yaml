  whole_cell_model_id: "Process_RNAProcessing"
  functional_area: "gene-expression"
  state_shape_role: "wiring row for allocation-backed RNA maturation"
  notes: >-
    The OC replay fixture exposes the canonical 7-substrate, 335-unprocessed-RNA,
    347-processed-RNA, 5-enzyme RNAProcessing matrix; this row captures wiring
    semantics only, not the full stoichiometry table.
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
        lines: "406-409"
        note: "Per-tick request matrix for allocator share input."
        symbol: "calcResourceRequirements_Current"
      note: "Allocator-facing resource requirement block."
    oc:
      symbol: "RequestCalculatorRNAPathway.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "335-335"
        note: "Shared RNA-pathway request step for RNAProcessing and RNAModification."
        symbol: "RequestCalculatorRNAPathway.next_update"
      supporting:
        - path: "opencell/vivarium/karr_request_calculators.py"
          lines: "16-27"
          note: "Availability-based request helper."
          symbol: _consumed_wids_from_stoich
      note: >-
        The OC request step is allocation-backed but simplified: it asks for the
        currently available substrate pool when active, rather than reproducing
        the MATLAB enzyme/unprocessedRNA cap exactly.
    status: "implemented"
    note: "Implemented in the OC replay path, but the request formula is not a literal MATLAB clone."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
        lines: "413-420"
        note: "Random order over RNA classes."
        symbol: "evolveState"
      note: "Simulation entrypoint that delegates to evolveState_Helper."
    oc:
      symbol: "KarrRNAProcessingProcess.next_update"
      source:
        path: "opencell/vivarium/karr_rna_processing.py"
        lines: "236-236"
        note: "Allocated-substrate read plus substrate/RNA writeback."
        symbol: "KarrRNAProcessingProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_rna_processing.py"
          lines: "340-477"
          note: "Reaction-cap calculation, random sampling, and state delta construction."
          symbol: KarrRNAProcessingProcess._compute_processing_events
      note: >-
        The OC port preserves the main count-space substrate/RNA delta kernel,
        but it reads from substrates_allocated[self.name] rather than the
        MATLAB local substrates store, omits the MATLAB intergenicRNAs state,
        and adds replay-specific gating branches
        (suppress_trna_for_rrna_tick and first-maturation activation lag) that
        are not present in MATLAB evolveState_Helper. See known_deviations.
    status: "implemented"
    note: "Implemented, with replay-oriented state-shape and gating simplifications."
  calcFluxBounds:
    matlab:
      symbol: "RNAProcessing"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
        lines: "183-485"
        note: "RNAProcessing class body; no calcFluxBounds method is defined in the MATLAB source. Class-level anchor used to record calcFluxBounds absence."
        symbol: "RNAProcessing"
      note: "Schema-required slot; no direct MATLAB implementation exists. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrRNAProcessingProcess"
      source:
        path: "opencell/vivarium/karr_rna_processing.py"
        lines: "42-474"
        note: "No LP-bound helper or equivalent exists in the OC replay port. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrRNAProcessingProcess"
      note: "RNAProcessing is not modeled through a flux-bound helper in the current OC code. OC does not implement this Karr method."
    status: "not_implemented"
    note: "Retained because the row schema requires a calcFluxBounds binding. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: >-
      Both sides are allocation-backed. The OC process consumes
      substrates_allocated[self.name], so the request step and the per-tick
      writeback are wired through allocator mediation rather than bypassing it.
  request_formula:
    matlab: >-
      max(0, -this.reactantByproductMatrix) * min(ceil(min(this.enzymes(:, ones(size(this.catalysisMatrix, 2), 1)) ./ this.catalysisMatrix * this.stepSizeSec,
      [], 1))', this.unprocessedRNAs)
    oc: >-
      RequestCalculatorRNAPathway.next_update: if any unprocessed RNA is
      present, request max(0, substrates[wid]) for the consumed WIDs
      (ATP/GTP/H2O); otherwise request 0. Shared with RNAModification.
    note: >-
      The MATLAB formula computes an enzyme- and substrate-limited request
      vector; the current OC request step is availability-based rather than a
      literal algebraic clone.
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Consumed reactant in the RNA-processing stoichiometry matrix."
  bypasses: []
