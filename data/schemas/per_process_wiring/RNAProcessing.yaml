unit_conversion_chain:
  source_units: "enzyme-constrained reaction opportunities"
  target_units: "substrate molecule counts/tick"
  steps:
    - from_units: "enzyme-constrained reaction opportunities"
      to_units: "substrate molecule counts/tick"
      operation: "max(0, -reactantByproductMatrix) × min(ceil(min(enzymes(:, ones(size(catalysisMatrix, 2), 1)) ./ catalysisMatrix * stepSizeSec, [], 1))', unprocessedRNAs)"
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
        lines: "406-472"
        note: "Count-space cap and writeback path."
        symbol: calcResourceRequirements_Current
      constants:
        - "stepSizeSec"
  note: >-
    RNAProcessing stays in integer count space; there is no mmol/gDW/hr or
    mass-to-molecule conversion layer in this process.
