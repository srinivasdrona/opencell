          symbol: KarrRNAProcessingProcess._compute_processing_events
      note: >-
        Source random class order, whole-class worst reactant bound, stochastic
        enzyme rounding, randCounts, and all stoichiometric outputs. Intergenic
        products use distinct source global-row leaves in existing rna.counts.
    status: "implemented"
    note: "No seed/tick-specific lag or tRNA suppression; source conservative class bound retained."
  calcFluxBounds:
    matlab:
      symbol: "RNAProcessing"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAProcessing.m"
        lines: "183-485"
        note: "RNAProcessing class body; no calcFluxBounds method is defined in the MATLAB source. Class-level anchor used to record calcFluxBounds absence."
