    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "docs/karr_extracts/process/13_RNADecay.md"
      lines: "75-92"
      note: "The local extract describes stochastic decay and byproduct updates but no flux-bound block."
      symbol: Verbatim docstring extract
