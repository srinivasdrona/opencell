schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "RNADecay"
  matlab_class: "RNADecay"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNADecay.m"
  oc_class: "RnaDecayLightProcess"
  oc_file: "opencell/vivarium/karr_rna_decay.py"
  whole_cell_model_id: "Process_RNADecay"
  functional_area: "rna-synthesis-and-maturation"
  state_shape_role: "stochastic RNA decay with H2O allocation and flat substrate writeback"
  notes: >-
    This row is exemplar-scoped; canonical exemplars are listed and are not an
    exhaustive enumeration. MATLAB anchors use executable RNADecay.m lines plus
    architecture extracts where useful.
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNADecay.m"
        lines: "282-294"
        note: "Current-tick H2O request from decay stoichiometry with aborted-transcript water add."
        symbol: "calcResourceRequirements_Current"
      note: "RNADecay computes request mass directly in calcResourceRequirements_Current."
    oc:
      symbol: "RnaDecayLightProcess.next_update"
      source:
        path: "opencell/vivarium/karr_rna_decay.py"
        lines: "298-298"
        note: "Inline request emission before water gating."
        symbol: "RnaDecayLightProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "2441-2447"
          note: "RNADecay topology wiring includes requests and substrates_allocated."
          symbol: build_karr_chassis_v6
        - path: "opencell/vivarium/karr_allocation_step.py"
          lines: "210-280"
          note: "Allocator grant step that consumes the request vector."
          symbol: KarrAllocationStep.next_update
      note: "OC does not expose a dedicated RequestCalculator; the request is emitted inside next_update."
    status: "partial"
    note: >-
      MATLAB computes result = max(0, -decayReactions' * (min(1, decayRates) .*
      RNAs)) and then adds aborted-transcript water on substrateIndexs_water.
      The OC port computes the request inline from sampled decay counts.
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/13_RNADecay.md"
        lines: "75-92"
        note: "Verbatim extract of the RNADecay algorithm summary."
        symbol: "evolveState"
      note: "The raw MATLAB body is absent here, so the extract is the best local source."
    oc:
      symbol: "RnaDecayLightProcess.next_update"
      source:
        path: "opencell/vivarium/karr_rna_decay.py"
        lines: "298-298"
        note: "Stochastic decay sampling, peptidyl-hydrolase gating, water gate, RNA and substrate writeback."
        symbol: "RnaDecayLightProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_rna_decay.py"
          lines: "443-450"
          note: "Allocator-first H2O read with substrates fallback."
          symbol: RnaDecayLightProcess._available_water
      note: "Core biology is implemented in next_update; OC adds trace-hint replay and fallback paths."
    status: "partial"
    note: >-
      The OC port matches the documented decay loop structure, but it is not a
      literal method-name port and it includes OC-only replay/fallback logic.
  calcFluxBounds:
    matlab:
      symbol: "RNADecay"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNADecay.m"
        lines: "86-86"
        note: "No flux-bounds or LP block is described for RNADecay in the local extract. Class-level anchor used to record calcFluxBounds absence."
        symbol: "RNADecay"
      note: "RNADecay is not an LP/flux process in the available source material. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "RnaDecayLightProcess"
      source:
        path: "opencell/vivarium/karr_rna_decay.py"
        lines: "81-500"
        note: "Process class, fixture loading, and ports schema only; no flux-bound equivalent exists. Representative OC anchor for non-implemented correspondence."
        symbol: "RnaDecayLightProcess"
      note: "OC has no calcFluxBounds analogue for RNADecay. OC does not implement this Karr method."
    status: "not_implemented"
    note: "This slot is retained for schema uniformity only. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides route H2O through the allocator when the allocated store is present."
  request_formula:
    matlab: "result = max(0, -decayReactions' * (min(1, decayRates) .* RNAs)); if abortedTranscripts nonempty: H2O_request += sum(abortedTranscripts(:, 2) - 1)"
    oc: "sampled_decay = Poisson(lambda); raw_h2o_need = water_need_per_decay' * sampled_decay"
    note: >-
      MATLAB request is the executable calcResourceRequirements_Current
      expression plus aborted-transcript water term; the OC side is the inline
      request emitted in next_update.
  requests:
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Only allocator-facing RNADecay substrate; water request is the canonical consumer tuple."
  bypasses:
    - wid: "ALA"
      compartment: "cytosol"
      source: "both"
      note: "Direct substrate writeback from the decay stoichiometry, not allocator-mediated."
    - wid: "AMP"
      compartment: "cytosol"
      source: "both"
      note: "Direct substrate writeback from the decay stoichiometry, not allocator-mediated."
    - wid: "CMP"
      compartment: "cytosol"
      source: "both"
      note: "Direct substrate writeback from the decay stoichiometry, not allocator-mediated."
    - wid: "GMP"
      compartment: "cytosol"
      source: "both"
      note: "Direct substrate writeback from the decay stoichiometry, not allocator-mediated."
    - wid: "UMP"
      compartment: "cytosol"
      source: "both"
      note: "Direct substrate writeback from the decay stoichiometry, not allocator-mediated."
consume_stoichiometry:
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-(decayEvents @ waterNeedPerDecay)"
    matlab_anchor:
      path: "docs/karr_extracts/process/13_RNADecay.md"
      lines: "84-92"
      note: "Algorithm says water is the only reactant and byproducts are updated after the decay loop."
      symbol: Verbatim docstring extract
    oc_anchor:
      path: "opencell/vivarium/karr_rna_decay.py"
      lines: "355-368"
      note: "Water gate during weighted acceptance of decay events."
      symbol: RnaDecayLightProcess.next_update
    note: "RNADecay consumes only water as a reactant."
    kind: expression
produce_stoichiometry:
