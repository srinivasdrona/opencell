  consumes_outputs_of:
    - "Transcription"
    - "RNAProcessing"
    - "RNAModification"
    - "tRNAAminoacylation"
    - "Metabolism"
  note: "Removed Metabolism from produces_inputs_for because the downstream rows do not expose a direct stoichiometric handoff; added Metabolism to consumes_outputs_of because this row directly draws from the shared metabolite pool."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: >-
    MATLAB enforces same-tick allocator coupling via
    calcResourceRequirements_Current -> allocations -> evolveState in
    Simulation.evolveState (`@Simulation/evolveState.m:24-39,58-72`). OC
    RNADecay emits requests inline in next_update
    (`karr_rna_decay.py:327-334`), and the OC composite does not encode a
    corresponding RNADecay-specific hard ordering edge for equivalent same-tick
    request/allocation semantics (CODE_DEVIATES).
