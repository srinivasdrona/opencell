    oc_anchor:
      path: "opencell/vivarium/karr_rna_decay.py"
      lines: "379-387"
      note: "Direct substrate writeback from decay stoichiometry."
      symbol: RnaDecayLightProcess.next_update
    note: "Fixture-dependent amino-acid byproduct from aminoacylated RNA decay."
    kind: per_reaction
