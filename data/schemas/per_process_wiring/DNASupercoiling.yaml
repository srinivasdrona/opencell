      note: "Water subtraction is paired with ATP hydrolysis."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_dna_supercoiling.py"
      lines: "1024-1035"
      note: "Water is decremented 1:1 with ATP usage."
      symbol: KarrDNASupercoilingProcess._limit_events_by_atp
    note: "Co-substrate consumption mirrors ATP hydrolysis."
    kind: expression
