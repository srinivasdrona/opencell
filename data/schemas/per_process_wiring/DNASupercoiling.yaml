      note: "Hydrolysis product emitted by _substrate_delta."
    note: "Direct hydrolysis product."
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "+nATP"
    matlab_anchor:
      path: "E:/opencell-mirrors/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m"
      lines: "494-499"
      note: "Hydrogen product is present when the fixture exposes H."
    oc_anchor:
      path: "opencell/vivarium/karr_dna_supercoiling.py"
      lines: "1027-1035"
      note: "Hydrogen product emitted only when h_wid is available."
    note: "Hydrogen is emitted when present in the fixture."
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment: null
    mismatch: false
