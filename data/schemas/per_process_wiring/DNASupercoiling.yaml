allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Karr requests ATP/H2O for supercoiling and the OC port reads allocated ATP/H2O from substrates_allocated[self.name]."
  request_formula:
    matlab: "nATP = enzProps.atpCost * ceil((enzymes(gyraseIndex) + boundEnzymes(gyraseIndex)) * enzProps.activityRate * max(enzProps.probOfActivityFunc(sigmas, c))); result(ATP) = nATP; result(H2O) = nATP"
    oc: "requestNeed = min(request_max_atp, ceil(request_safety_factor * (expected_gyrase_events * gyrase_atp_cost + expected_topoIV_events * topoiv_atp_cost + replication_extra * gyrase_atp_cost))); ATP and H2O both receive requestNeed"
    note: "The OC controller is a superset of the MATLAB current-request helper because it merges the broader lifecycle terms into the same request path."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "both"
      note: "Requested through the allocator and then consumed directly when ATP hydrolysis executes."
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Co-substrate request; executed hydrolysis is gated by min(allocated ATP, allocated H2O)."
  bypasses:
    - wid: "ATP"
      compartment: "cytosol"
      source: "both"
      note: "Direct post-allocation consumption delta."
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Direct post-allocation consumption delta."
    - wid: "ADP"
      compartment: "cytosol"
      source: "both"
      note: "Direct hydrolysis product."
    - wid: "PI"
      compartment: "cytosol"
      source: "both"
      note: "Direct hydrolysis product."
    - wid: "H"
      compartment: "cytosol"
      source: "both"
      note: "Direct hydrolysis product when the fixture exposes hydrogen."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "nATP = nStrandPassingEvents * atpCost"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m"
      lines: "494-499"
      note: "ATP subtraction after strand-passing events."
