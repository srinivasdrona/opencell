      note: "ATP is decremented in _substrate_delta and emitted via update[\"substrates\"] in next_update."
      symbol: KarrDNASupercoilingProcess._limit_events_by_atp
    note: "Executed ATP hydrolysis is the sum of gyrase and topoIV event counts times their ATP costs."
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "nH2O = nStrandPassingEvents * atpCost"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m"
