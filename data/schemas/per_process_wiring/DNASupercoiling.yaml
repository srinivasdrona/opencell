unit_conversion_chain:
  source_units: "enzyme counts and activity rates (events/s)"
  target_units: "molecules/tick"
  steps:
    - from_units: "enzyme counts and activity rates (events/s)"
      to_units: "expected strand-passing events/tick"
      operation: "count free/bound enzymes, apply sigma gating, multiply by activity rate, then stochastic-round"
      constants: ["activityRate", "probOfActivity", "dt"]
      anchor:
        path: "E:/opencell-mirrors/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m"
        lines: "333-353"
        note: "Current request helper; the current MATLAB fixture uses a 1 s step, so dt is implicit there."
    - from_units: "expected strand-passing events/tick"
      to_units: "ATP molecules/tick"
      operation: "multiply by ATP cost per enzyme class and sum across gyrase/topoIV"
      constants: ["gyraseATPCost", "topoIVATPCost"]
      anchor:
        path: "E:/opencell-mirrors/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNASupercoiling.m"
        lines: "494-499"
        note: "ATP hydrolysis accounting."
    - from_units: "ATP molecules/tick"
      to_units: "executed molecules/tick"
      operation: "min(allocated ATP, allocated H2O)"
      constants: ["allocated ATP", "allocated H2O"]
      anchor:
        path: "opencell/vivarium/karr_dna_supercoiling.py"
        lines: "459-462"
        note: "Allocated budget gate."
    - from_units: "executed molecules/tick"
      to_units: "substrate deltas (molecules/tick)"
      operation: "ATP/H2O:-1; ADP/PI/H:+1"
      constants: ["atp_used"]
      anchor:
        path: "opencell/vivarium/karr_dna_supercoiling.py"
        lines: "1024-1035"
        note: "Direct substrate delta emission."
  note: "This controller is discrete-count based; there is no Metabolism-style mmol/gDW/hr layer."
