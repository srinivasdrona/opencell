    kind: expression
stoichiometry_oracle:
  class: inline
  record_path: data/karr_method_inventory/karr_stoichiometry/FtsZPolymerization.json
  substrate_count: 5
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Allocator-bounded activation/polymerization demand is cytosolic."
  - wid: "GDP"
    consume_compartment: "cytosol"
    produce_compartment: "cytosol"
    mismatch: false
    note: "GDP participates in both the state-transition sink and the compensation branch."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Hydrolysis water cost is cytosolic."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis phosphate byproduct is cytosolic."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis hydrogen byproduct is cytosolic."
