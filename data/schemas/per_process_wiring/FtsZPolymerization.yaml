schema_version: "1.0"
process:
  name: "FtsZPolymerization"
  matlab_class: "FtsZPolymerization"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/FtsZPolymerization.m"
  oc_class: "KarrFtsZPolymerizationProcess"
  oc_file: "opencell/vivarium/karr_ftsz_polymerization.py"
  whole_cell_model_id: "Process_FtsZPolymerization"
  functional_area: "cytokinesis"
  state_shape_role: "event-class / ring-state wiring row"
  notes: "The raw MATLAB source file was not present in this checkout; MATLAB anchors below use the checked-in extract doc as the source proxy."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/architecture/01_simulation_loop.md"
        lines: "148-161"
        note: "Global allocation block that invokes every process request method."
      note: "No FtsZ-specific MATLAB request body was available locally; the process family is allocator-facing through the simulation loop."
    oc:
      symbol: "KarrFtsZPolymerizationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "216-283"
        note: "Emits the GTP request directly into `requests[self.name][gtp_wid]`."
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1723-1783"
          note: "Composite allocation consumer list includes `karr_ftsz_polymerization` with GTP."
      note: "Request handling lives in-process rather than in a separate request-calculator helper."
    status: "partial"
    note: "Allocator-compatible, but no dedicated FtsZ request-calculator module exists in OC."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
        lines: "11-37"
        note: "Extracted Karr algorithm summary: multi-stage FtsZ ODE, discretization, and clamp."
      note: "The raw `.m` body was unavailable locally; this extract is the repository's checked-in summary of the MATLAB process."
    oc:
      symbol: "KarrFtsZPolymerizationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "216-293"
        note: "Per-tick update flow: gate, integrate, discretize, clamp, emit deltas."
      supporting:
        - path: "opencell/vivarium/karr_ftsz_polymerization.py"
          lines: "295-479"
          note: "ODE system and substrate-limit clamps."
      note: "Implemented in OC as a direct `next_update` path."
    status: "partial"
    note: "The OC port follows the Karr flow but is instrumented as an event-class process with allocator-bounded GTP."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
        lines: "29-37"
        note: "No separate flux-bounds method is described in the extract."
      note: "Not a flux-bounds process; the allocator surface is request/allocate GTP rather than LP bounds."
    oc:
      symbol: "not_implemented"
      source:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "1-13"
        note: "FtsZ process does not expose flux-bound logic."
      note: "No FtsZ-specific flux-bounds helper exists in OC."
    status: "not_implemented"
    note: "This process has no LP-style bound construction comparable to Metabolism."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Karr's allocation block calls `calcResourceRequirements_Current`; OC reads `substrates_allocated[self.name]` for GTP and falls back to `substrates` only when allocation is absent."
  request_formula:
    matlab: "GTP request is allocator-facing; the checked-in extract does not preserve a dedicated FtsZ-specific formula body."
    oc: "request_gtp = max(0, int(next_counts[ftsz] + next_counts[ftsz_gdp]))"
    note: "OC emits the request directly from the post-update FtsZ/GDP-bound counts."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Canonical allocator request tuple for this process."
  bypasses:
    - wid: "GDP"
      compartment: "cytosol"
      source: "oc"
      note: "Shared substrate store is read and updated in the clamp / delta path."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Hydrolysis byproduct is touched directly in the substrate-delta path."
    - wid: "H2O"
      compartment: "cytosol"
      source: "oc"
      note: "Hydrolysis cost is checked directly during the clamp path."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Hydrolysis byproduct is touched directly in the substrate-delta path."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "dot(n_gtp, enzymes - current_counts) + gdp_shortfall"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "29-37"
      note: "Extract summary for the ODE/discretize flow; raw MATLAB body unavailable locally."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "448-479"
      note: "GTP is decremented in `apply_substrate_limits` and optionally compensated during GDP shortfall."
  - wid: "GDP"
    compartment: "cytosol"
    formula_or_constant: "dot(n_gdp, enzymes - current_counts)"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "20-37"
      note: "GDP-bound monomer state is part of the extracted multi-state FtsZ model."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "471-479"
      note: "GDP is decremented from the enzyme delta before any shortfall compensation."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "gdp_shortfall"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "29-37"
      note: "Hydrolysis / clamp compensation is described only at the process-summary level in the checked-in extract."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "475-479"
      note: "Water is consumed when the GDP shortfall branch fires."
produce_stoichiometry:
  - wid: "GDP"
    compartment: "cytosol"
    formula_or_constant: "gdp_shortfall"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "29-37"
      note: "Hydrolysis compensation is part of the extracted process summary."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "475-479"
      note: "GDP is replenished during the compensation branch."
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "gdp_shortfall"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "29-37"
      note: "Phosphate byproduct belongs to the hydrolysis compensation branch."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "475-479"
      note: "Phosphate is produced when the GDP shortfall branch fires."
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "gdp_shortfall"
    matlab_anchor:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "29-37"
      note: "Hydrogen byproduct belongs to the hydrolysis compensation branch."
    oc_anchor:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "475-479"
      note: "Hydrogen is produced when the GDP shortfall branch fires."
compartment_routing:
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment: null
    mismatch: false
    note: "Allocator-bounded activation/polymerization demand is cytosolic."
  - wid: "GDP"
    consume_compartment: "cytosol"
    produce_compartment: "cytosol"
    mismatch: false
    note: "GDP participates in both the state-transition sink and the compensation branch."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment: null
    mismatch: false
    note: "Hydrolysis water cost is cytosolic."
  - wid: "PI"
    consume_compartment: null
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis phosphate byproduct is cytosolic."
  - wid: "H"
    consume_compartment: null
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis hydrogen byproduct is cytosolic."
unit_conversion_chain:
  source_units: "molecules / fractional ODE state"
  target_units: "integer molecules/tick"
  steps:
    - from_units: "molecules"
      to_units: "molecules·L^-1"
      operation: "÷(_N_AVOGADRO × geometry_volume)"
      constants: ["_N_AVOGADRO", "geometry_volume"]
      anchor:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "155-167,481-485"
        note: "Geometry volume is loaded from the fixture, then counts are converted to concentration."
    - from_units: "molecules·L^-1"
      to_units: "molecules"
      operation: "×(_N_AVOGADRO × geometry_volume)"
      constants: ["_N_AVOGADRO", "geometry_volume"]
      anchor:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "481-485"
        note: "Concentration is projected back to molecule counts after integration."
    - from_units: "floating molecules"
      to_units: "integer molecules/tick"
      operation: "stochasticRound → clamp to nonnegative int"
      constants: ["rng_seed", "time_step"]
      anchor:
        path: "opencell/vivarium/karr_ftsz_polymerization.py"
        lines: "405-436,548-587"
        note: "Discrete state recovery, substrate-delta rounding, and nonnegative clamping."
dependencies:
  produces_inputs_for:
    - "Cytokinesis"
  consumes_outputs_of:
    - "Translation"
    - "ProteinProcessingI"
    - "ProteinProcessingII"
    - "ProteinFolding"
  note: "The explicit shared-substrate dependency is GTP; the other edges are biological precursor / downstream coupling notes from the phase-C chassis design."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "No FtsZ-specific ordering rule was found; the canonical hard order in `Simulation.evolveState` is tRNAAminoacylation before Translation."
source_anchors:
  matlab_blocks:
    process_summary:
      path: "docs/karr_extracts/process/25_FtsZPolymerization.md"
      lines: "11-37"
      note: "Checked-in Karr process extract summarizing the ODE/discretize FtsZ model."
    allocation_block:
      path: "docs/karr_extracts/architecture/01_simulation_loop.md"
      lines: "148-161"
      note: "Global allocation block that calls every process request method."
    global_order:
      path: "docs/karr_extracts/architecture/01_simulation_loop.md"
      lines: "172-180"
      note: "Canonical hard order: tRNAAminoacylation must occur before Translation."
  oc_blocks:
    process_class:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "64-214"
      note: "Fixture load, state shape, and ports schema."
    next_update:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "216-293"
      note: "Per-tick update flow, request emission, and output writeback."
    solver_and_clamps:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "295-479"
      note: "ODE integration, discretization, and substrate-limit clamps."
    unit_helpers:
      path: "opencell/vivarium/karr_ftsz_polymerization.py"
      lines: "481-587"
      note: "Concentration conversion and substrate-delta extraction helpers."
    composite_allocation:
      path: "opencell/vivarium/karr_composite.py"
      lines: "1723-1783"
      note: "Composite allocation consumer list wires FtsZ to GTP."
provenance:
