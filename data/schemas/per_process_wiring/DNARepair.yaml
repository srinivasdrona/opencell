schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "DNARepair"
  matlab_class: "DNARepair"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m"
  oc_class: "KarrDNARepairProcess"
  oc_file: "opencell/vivarium/karr_dna_repair.py"
  whole_cell_model_id: "Process_DNARepair"
  functional_area: "dna-replication-and-maintenance"
  state_shape_role: "chromosome-primary repair process with substrate/allocation coupling"
  notes: >-
    This row is exemplar-scoped; canonical exemplars are listed and are not an
    exhaustive enumeration. MATLAB anchors include executable DNARepair.m lines
    plus extract/architecture references where useful.
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/architecture/01_simulation_loop.md"
        lines: "149-160"
        note: "Generic per-process allocator request pass in Simulation.evolveState."
        symbol: "calcResourceRequirements_Current"
      note: "DNARepair participates in the shared allocator request pass; no DNARepair-specific source body is available in this checkout."
    oc:
      symbol: "KarrDNARepairProcess.next_update"
      source:
        path: "opencell/vivarium/karr_dna_repair.py"
        lines: "378-378"
        note: "Builds per-tick substrate requests from desired repairs."
        symbol: "KarrDNARepairProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_dna_repair.py"
          lines: "678-763"
          note: "Pathway capacity, per-event cost, and allocator bounding helpers."
          symbol: KarrDNARepairProcess._apply_reaction_substrate_stoich
      note: "Current OC folds request calculation into next_update rather than a dedicated request-calculator class."
    status: "partial"
    note: "The request contract exists, but it is embedded in next_update instead of a standalone MATLAB-style request method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/05_DNARepair.md"
        lines: "275-294"
        note: "Six-subfunction repair algorithm and random-order execution inside evolveState."
        symbol: "evolveState"
      note: "This extract is the only process-local source material available here."
    oc:
      symbol: "KarrDNARepairProcess.next_update"
      source:
        path: "opencell/vivarium/karr_dna_repair.py"
        lines: "378-378"
        note: "Aggregated repair update, substrate writeback, and chromosome repair deltas."
        symbol: "KarrDNARepairProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_dna_repair.py"
          lines: "391-543"
          note: "Damage-site read/write helpers."
          symbol: KarrDNARepairProcess.next_update
        - path: "opencell/vivarium/karr_dna_repair.py"
          lines: "652-789"
          note: "Pathway-capacity and bounded-repair helpers."
          symbol: KarrDNARepairProcess._reaction_substrate_capacity
      note: "OC implements the repair loop in one aggregated update instead of Karr's six randomly ordered subfunctions."
    status: "partial"
    note: "Implemented, but the algorithm is collapsed to pathway-level aggregate repair rather than per-subfunction random order."
  calcFluxBounds:
    matlab:
      symbol: "DNARepair"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/DNARepair.m"
        lines: "257-270"
        note: "Reaction stoichiometry, enzymes, and bounds are described here; no dedicated DNARepair flux-bound body was recovered. Class-level anchor used to record calcFluxBounds absence."
        symbol: "DNARepair"
      note: "Nearest available DNARepair-local material; no standalone calcFluxBounds implementation was found in the checkout. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrDNARepairProcess"
      source:
        path: "opencell/vivarium/karr_dna_repair.py"
        lines: "133-789"
        note: "OC DNARepair has no LP-style flux-bound layer; request logic lives in next_update. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrDNARepairProcess"
      note: "The OC port does not expose a dedicated flux-bound method for DNARepair. OC does not implement this Karr method."
    status: "not_implemented"
    note: "No DNARepair-specific calcFluxBounds analog is present in current OC. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides use allocation gating; the OC process reads `substrates_allocated[karr_dna_repair]` before repair."
  request_formula:
    matlab: "r = max(0, -S) * min(ceil(C * E * dt), rates), where rates are lesion-driven repair reaction capacities in calcResourceRequirements_Current"
    oc: "requests = _substrate_needs_for_repairs(desired_repairs); desired_repairs = min(Poisson(pathway_capacity_per_s * dt * lesion_count), lesion_count); available = substrates_allocated[self.name]"
    note: "MATLAB request demand follows executable stoichiometry/catalysis matrix shape; OC computes a pathway-level Poisson approximation in next_update."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Canonical repair-energy request."
    - wid: "DATP"
      compartment: "cytosol"
      source: "karr"
      note: "DNA patch synthesis request."
    - wid: "DCTP"
      compartment: "cytosol"
      source: "karr"
      note: "DNA patch synthesis request."
    - wid: "DGTP"
      compartment: "cytosol"
      source: "karr"
      note: "DNA patch synthesis request."
    - wid: "DTTP"
      compartment: "cytosol"
      source: "karr"
      note: "DNA patch synthesis request."
  bypasses:
    - wid: "AMET"
      compartment: "cytosol"
      source: "oc"
      note: "Current OC reads the global substrate pool directly for the conditional MunI methylation side effect."
    - wid: "AHCYS"
      compartment: "cytosol"
      source: "oc"
      note: "Current OC writes this methylation product directly in next_update."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Current OC writes this methylation product directly in next_update."
    - wid: "NAD"
      compartment: "cytosol"
      source: "deviation"
      note: "Karr ligation chemistry uses NAD, but the current OC port does not model that metabolite."
    - wid: "NMN"
      compartment: "cytosol"
      source: "deviation"
      note: "Karr ligation chemistry produces NMN; current OC omits the full ligation metabolite product set."
