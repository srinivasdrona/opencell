stoichiometry_oracle:
  class: matrix
  record_path: data/karr_method_inventory/karr_stoichiometry/DNARepair.json
  substrate_count: 26
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Repair-energy demand stays in the cytosolic substrate pool."
  - wid: "DATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "dNTP patch synthesis is cytosolic."
  - wid: "DCTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "dNTP patch synthesis is cytosolic."
  - wid: "DGTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "dNTP patch synthesis is cytosolic."
  - wid: "DTTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "dNTP patch synthesis is cytosolic."
  - wid: "AMP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB emits AMP to cytosol; OC does not emit an AMP tuple in DNARepair update."
  - wid: "PPI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB emits PPI to cytosol; OC does not emit a PPI tuple in DNARepair update."
  - wid: "AHCYS"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Conditional RM product remains cytosolic."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Conditional RM product remains cytosolic."
