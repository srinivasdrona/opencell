    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: true
    note: "MATLAB consume routing is cytosolic, but OC reads a flat shared substrate key (no compartment axis; shared_pool_projection_merges_compartments=true)."
  - wid: "ALA"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: true
    note: "MATLAB consume routing is cytosolic, but OC AA updates use flat shared substrate keys without a compartment axis."
  - wid: "MET"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: true
    note: "MATLAB consume routing is cytosolic, but OC AA updates use flat shared substrate keys without a compartment axis."
  - wid: "LYS"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: true
    note: "MATLAB consume routing is cytosolic, but OC AA updates use flat shared substrate keys without a compartment axis."
  - wid: "GDP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB produces cytosolic GDP; current OC Translation emits no GDP metabolite route."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB produces cytosolic PI; current OC Translation emits no PI metabolite route."
  - wid: "H"
