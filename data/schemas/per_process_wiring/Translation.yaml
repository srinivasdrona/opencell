deviations:
  lp_bounds_source:
    karr: "allocation"
    oc_current: "allocation"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Translation.m"
      lines: "570-596"
      note: "MATLAB declares an allocator-facing resource request vector."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_translation_v3.py"
      lines: "601-617"
      note: "Current OC still applies an allocator-mediated substrate cap for AA demand."
      symbol: KarrTranslationV3Process.next_update
  shared_pool_projection_merges_compartments: true
  known_deviations:
    - "MATLAB requests GTP/H2O, while current OC requests the 20 standard amino-acid pools through RequestCalculatorTranslation."
    - "Current OC still reads GTP/H2O directly from states['substrates'] inside the biology helper, so the runtime is mixed rather than pure allocation."
    - "MATLAB decrements GTP/H2O substrate counts in Translation writeback; current OC uses GTP/H2O as read-side gating only and emits no negative GTP/H2O substrate deltas."
    - "MATLAB's substrate vocabulary includes FMET; current OC exposes only the 20 standard amino acids and uses MET as the initiator-residue surrogate."
    - "MATLAB writes GDP/PI/H as substrate byproducts; current OC writes protein.unprocessed_counts instead and does not emit those metabolites."
    - "MATLAB substrate routing is compartment-indexed, but current OC Translation uses a flat shared substrate surface (per-WID projection with merged compartments)."
    - "MATLAB's full charged-tRNA/polymerize bookkeeping is collapsed in OC into a fixture-backed synthesis-rate surrogate plus stochastic rounding."
    - "MATLAB enforces tRNAAminoacylation before Translation; current OC composite does not encode an explicit hard process-order edge for that pair."
    - This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
  note: "The row intentionally preserves the MATLAB request/update semantics while making the current OC deviations explicit instead of hiding them."
