allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides gate on per-process allocated substrates; OC reads states['substrates_allocated'][self.name] and does not fall back to the global substrate pool."
  request_formula:
    matlab: "if replicated && supercoiled && all(required segregation proteins are present) && ~segregated then request GTP = gtpCost and H2O = gtpCost, else request 0"
    oc: "request_gtp = request_h2o = gtp_cost when can_progress else 0.0"
    note: "Symbolic formula only; the MATLAB source is documented as a boolean gate with gtpCost, while the OC port inlines the same logic."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Primary energy substrate requested through the allocator."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Hydrolysis partner requested through the allocator in the current OC port."
  bypasses:
    - wid: "MG_470_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_221_OCTAMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from complex.counts / protein counts, not from the allocator."
    - wid: "MG_387_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_384_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_203_204_TETRAMER"
      compartment: "cytosol"
      source: "oc"
      note: "OC-only optional topoIV gate; not mandatory in the default Karr documentation."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Zero-grant audit cites the GTP gate/consumption branch."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "369-378"
      note: "Consumes allocated GTP when can_progress and max_events >= 1."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Zero-grant audit cites the water gate/consumption branch."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "369-378"
      note: "Consumes allocated H2O in lockstep with GTP."
produce_stoichiometry:
