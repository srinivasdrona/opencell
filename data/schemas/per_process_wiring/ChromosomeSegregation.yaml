    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Hydrolysis product paired with the GTP gate."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "371-377"
      note: "Produced alongside PI and H when progress advances."
  - wid: "H"
