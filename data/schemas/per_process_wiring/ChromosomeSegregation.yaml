      note: "This process is not LP-bounded in the current port. OC does not implement this Karr method."
    status: "not_implemented"
    note: "ChromosomeSegregation is allocator-gated, not LP-bound. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides gate on per-process allocated substrates; OC reads states['substrates_allocated'][self.name] and does not fall back to the global substrate pool."
  request_formula:
    matlab: "if replicated && all(required segregation proteins are present) && ~segregated then request GTP = gtpCost and H2O = gtpCost, else request 0"
    oc: "request_gtp = request_h2o = gtp_cost when can_progress else 0.0"
    note: "Symbolic formula only; both sides are allocation-gated with gtpCost, but OC default gating also requires supercoiled while MATLAB request gating does not (see known_deviations)."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Primary energy substrate requested through the allocator."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Hydrolysis partner requested through the allocator in the current OC port."
  bypasses:
    - wid: "MG_470_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_221_OCTAMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from complex.counts / protein counts, not from the allocator."
    - wid: "MG_387_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_384_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_203_204_TETRAMER"
      compartment: "cytosol"
      source: "both"
      note: "Gate input read from counts on both sides; MATLAB requires TopoIV in the enzyme gate, while OC treats it as optional by default."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
