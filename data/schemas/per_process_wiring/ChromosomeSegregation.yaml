    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "371-377"
      note: "Produced alongside GDP and H."
compartment_routing:
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Allocator-gated energy substrate is cytosolic."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Allocator-gated hydrolysis partner is cytosolic."
  - wid: "GDP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
