      to_units: "molecules/tick"
      operation: "identity for stoichiometry; dt only scales segregation_progress, not substrate counts"
      anchor:
        path: "docs/design/pc-t5-segregation.md"
        lines: "68-90"
        note: "Per-tick algorithm summary: request, consume GTP/H2O, produce GDP/H/PI."
        symbol: Algorithm (v1)
      constants: ["gtpCost", "dt"]
  note: "There is no mmol/gDW/hr conversion chain here; the process already works in per-tick molecule counts."
