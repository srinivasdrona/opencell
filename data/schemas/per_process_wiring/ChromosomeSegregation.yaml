schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "ChromosomeSegregation"
  matlab_class: "ChromosomeSegregation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
  oc_class: "KarrChromosomeSegregationProcess"
  oc_file: "opencell/vivarium/karr_chromosome_segregation.py"
  whole_cell_model_id: "Process_ChromosomeSegregation"
  functional_area: "DNA-replication-and-maintenance"
  state_shape_role: "allocation-gated chromosome segregation"
  notes: >-
    2026-09-03: promoted from the Karr-LIGHT v1 continuous-progress port to a
    literal structural port of ChromosomeSegregation.m (now physically
    present in this checkout). calcResourceRequirements_Current and
    evolveState are both inlined in next_update; `chromosome.segregated` is
    the literal Karr field. See deviations below for what remains
    intentionally derived (backward-compat fields only).
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
        lines: "179-189"
        note: "~c.segregated && collapse(c.polymerizedRegions)==c.nCompartments*c.sequenceLen && all(this.enzymes) => request gtpCost GTP + H2O."
        symbol: "calcResourceRequirements_Current"
      note: "Literal gate; verified against the actual .m source (now present in this checkout)."
    oc:
      symbol: "KarrChromosomeSegregationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_segregation.py"
        lines: "433-458"
        note: "`can_request = (not already_segregated) and fully_replicated and all_enzymes_present`; requests gtpCost GTP/H2O when true."
        symbol: "KarrChromosomeSegregationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_chromosome_segregation.py"
          lines: "412-415"
          note: "_is_fully_replicated: collapse(polymerizedRegions) == nCompartments*sequenceLen."
          symbol: KarrChromosomeSegregationProcess._is_fully_replicated
        - path: "opencell/vivarium/karr_chromosome_segregation.py"
          lines: "396-410"
          note: "_all_enzymes_present: all 5 fixture enzymes (including topoisomerase IV) nonzero, matching all(this.enzymes) exactly."
          symbol: KarrChromosomeSegregationProcess._all_enzymes_present
      note: "Request logic is inlined in next_update rather than a separate request-calculator class (matches the note that no ChromosomeSegregation RequestCalculator exists in karr_request_calculators.py)."
    status: "implemented"
    note: "Literal port; no known deviations remain in this gate."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
        lines: "193-212"
        note: "Adds collapse(c.supercoiled)==c.nCompartments and substrates(gtp)>=gtpCost && substrates(water)>=gtpCost to the calcResourceRequirements_Current gate; sets c.segregated=true and applies GTP+H2O->GDP+PI+H."
        symbol: "evolveState"
      note: "Literal gate; verified against the actual .m source."
    oc:
      symbol: "KarrChromosomeSegregationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_segregation.py"
        lines: "433-490"
        note: "Gate, supercoiled check, substrate writeback, and request emission are all inlined here."
        symbol: "KarrChromosomeSegregationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_chromosome_segregation.py"
          lines: "417-431"
          note: "_is_fully_supercoiled: literal port of Chromosome.m's calcSupercoiled/calcDoubleStrandedRegions dependent properties, derived from the real polymerizedRegions/linkingNumbers hidden chromosome state."
          symbol: KarrChromosomeSegregationProcess._is_fully_supercoiled
        - path: "opencell/vivarium/karr_chromosome_segregation.py"
          lines: "460-480"
          note: "Allocated-substrate read, exact GTP/H2O consumption and GDP/H/PI production, and segregated=True latch."
          symbol: KarrChromosomeSegregationProcess.next_update
      note: "segregation_progress/segregation_complete/daughter_pole_positions/cell_cycle_event are retained as derived pure 0.0/1.0 projections of segregated, solely for karr_cell_cycle_coordinator.py backward compatibility; they carry no independent state."
    status: "implemented"
    note: "Literal structural port (2026-09-03 fix); see deviations for the intentionally-retained backward-compat surface."
  calcFluxBounds:
    matlab:
      symbol: "ChromosomeSegregation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
        lines: "85-85"
        note: "The process description is gate-based; no LP-flux-bound construction is described in the extract. Class-level anchor used to record calcFluxBounds absence."
        symbol: "ChromosomeSegregation"
      note: "No process-specific flux-bound helper was recovered for ChromosomeSegregation. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrChromosomeSegregationProcess"
      source:
        path: "opencell/vivarium/karr_chromosome_segregation.py"
        lines: "95-412"
        note: "OC port has no dedicated flux-bound helper for this process. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrChromosomeSegregationProcess"
      note: "This process is not LP-bounded in the current port. OC does not implement this Karr method."
    status: "not_implemented"
    note: "ChromosomeSegregation is allocator-gated, not LP-bound. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides gate on per-process allocated substrates; OC reads states['substrates_allocated'][self.name] and does not fall back to the global substrate pool."
  request_formula:
    matlab: "if replicated && all(required segregation proteins are present) && ~segregated then request GTP = gtpCost and H2O = gtpCost, else request 0"
    oc: "request_gtp = request_h2o = gtp_cost when can_request else 0.0"
    note: "Symbolic formula only; both sides are allocation-gated with gtpCost. Resolved 2026-09-03: OC's request gate no longer requires supercoiled (matches MATLAB's calcResourceRequirements_Current, which also does not check supercoiled)."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "Primary energy substrate requested through the allocator."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Hydrolysis partner requested through the allocator in the current OC port."
  bypasses:
    - wid: "MG_470_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_221_OCTAMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from complex.counts / protein counts, not from the allocator."
    - wid: "MG_387_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_384_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct gate input read from protein.counts, not from the allocator."
    - wid: "MG_203_204_TETRAMER"
      compartment: "cytosol"
      source: "both"
      note: "Gate input read from counts on both sides. Resolved 2026-09-03: OC now requires TopoIV in the enzyme gate unconditionally (all_enzymes_present checks all 5 fixture enzymes), matching MATLAB's all(this.enzymes) exactly."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Zero-grant audit cites the GTP gate/consumption branch."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "472-478"
      note: "Consumes allocated GTP when the request/evolveState gate is fully satisfied (can_request, fully_supercoiled, allocated_gtp/h2o >= gtp_cost)."
      symbol: KarrChromosomeSegregationProcess.next_update
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Zero-grant audit cites the water gate/consumption branch."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "472-478"
      note: "Consumes allocated H2O in lockstep with GTP."
      symbol: KarrChromosomeSegregationProcess.next_update
    kind: expression
produce_stoichiometry:
  - wid: "GDP"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Hydrolysis product paired with the GTP gate."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "472-478"
      note: "Produced alongside PI and H when segregation fires."
      symbol: KarrChromosomeSegregationProcess.next_update
    kind: expression
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Hydrolysis proton product."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "472-478"
      note: "Produced alongside GDP and PI."
      symbol: KarrChromosomeSegregationProcess.next_update
    kind: expression
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "gtpCost * 1 if gate_open and not segregated else 0"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeSegregation.m"
      lines: "201-203"
      note: "Hydrolysis phosphate product."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_segregation.py"
      lines: "472-478"
      note: "Produced alongside GDP and H."
      symbol: KarrChromosomeSegregationProcess.next_update
    kind: expression
stoichiometry_oracle:
  class: inline
  record_path: data/karr_method_inventory/karr_stoichiometry/ChromosomeSegregation.json
  substrate_count: 5
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Allocator-gated energy substrate is cytosolic."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Allocator-gated hydrolysis partner is cytosolic."
  - wid: "GDP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product returns to the cytosolic pool."
unit_conversion_chain:
