schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "ChromosomeCondensation"
  matlab_class: "ChromosomeCondensation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
  oc_class: "KarrChromosomeCondensationProcess"
  oc_file: "opencell/vivarium/karr_chromosome_condensation.py"
  whole_cell_model_id: "Process_ChromosomeCondensation"
  functional_area: "chromosome condensation"
  state_shape_role: "aggregate SMC/chromosome wiring row with allocator and substrate semantics"
  notes: >-
    Karr-light v1 aggregate model: keeps allocator-mediated ATP/H2O demand
    and substrate writeback, but not the full per-position chromosome topology.
methods:
  calcResourceRequirements_LifeCycle:
    matlab:
      symbol: "calcResourceRequirements_LifeCycle"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "187-218"
        note: "Cell-cycle resource requirement and minimum enzyme expression block."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "145-442"
        note: "No lifecycle FBA/resource requirement phase in the current OC port."
    status: "not_implemented"
    note: "Karr computes lifecycle ATP and minimum-enzyme requirements here; OC light model omits that phase."
  initializeState:
    matlab:
      symbol: "initializeState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "220-230"
        note: "Seeds a steady SMC-bound state by forcing ATP/H2O to Inf and iterating evolveState 20 times."
    oc:
      symbol: "KarrChromosomeCondensationProcess.__init__"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "165-257"
        note: "Fixture/trace-driven initialization and default state seeding."
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "270-274"
          note: "Default condensation level derived from fixture ATP and trace anchor."
    status: "partial"
    note: "OC replaces the warm-start loop with fixture/trace-derived defaults."
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "232-237"
        note: "Allocator-facing ATP/H2O request vector."
      note: "Returns ATP and H2O demand equal to free SMC count."
    oc:
      symbol: "KarrChromosomeCondensationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "321-442"
        note: "Merged request emission plus per-tick state update; requests are written into the update dict."
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "323-326"
          note: "Reads `substrates_allocated` first, then falls back through the helper."
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "435-441"
          note: "Writes ATP/H2O request values each tick."
    status: "partial"
    note: "No standalone request-calculator class; allocator demand is embedded in next_update."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "240-284"
        note: "Dissociate SMC-ADP, bind SMCs stochastically, and apply ATP/H2O -> ADP/PI/H substrate deltas."
    oc:
      symbol: "KarrChromosomeCondensationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "321-442"
        note: "Per-tick aggregate update for bound SMC count and substrate deltas."
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "444-560"
          note: "No-hints binding sampler and bound-site reconstruction."
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "832-838"
          note: "Allocation fallback helper that returns the allocated value or the global substrate value."
    status: "partial"
    note: "Implemented as Karr-light aggregate semantics, not the full per-position chromosome model."
  calcNewRegions:
    matlab:
      symbol: "calcNewRegions"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "286-292"
        note: "Helper used by stochastic binding to prune candidate intervals and score region lengths."
    oc:
      symbol: "KarrChromosomeCondensationProcess._build_available_intervals / _sample_binding_positions"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "652-755"
        note: "Current OC interval exclusion and random binding position sampling."
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "759-789"
          note: "Appends the sampled bound sites back into the sparse chromosome representation."
    status: "partial"
    note: "Same conceptual helper, but OC reconstructs intervals on sparse aggregate state."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "122-292"
        note: "No calcFluxBounds body exists in this class; included for schema completeness."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "145-442"
        note: "No LP-bound construction path for this process."
    status: "not_implemented"
    note: "ChromosomeCondensation has no dedicated flux-bound phase in either source tree."
allocator:
  mode:
    karr: "allocation"
    oc_current: "mixed"
    note: "Karr declares allocator demand explicitly; OC reads `substrates_allocated` first but falls back to global `substrates` when the allocated
      value is zero."
  request_formula:
    matlab: "result(ATP) = this.enzymes(this.enzymeIndexs_SMC); result(H2O) = this.enzymes(this.enzymeIndexs_SMC)"
    oc: "requests[self.name][ATP] = request_need; requests[self.name][H2O] = request_need; no standalone request-calculator class"
    note: "The OC formula is embedded in next_update rather than a separate RequestCalculator."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator-facing binding energy demand."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator-facing hydrolysis co-substrate demand."
  bypasses:
    - wid: "ATP"
      compartment: "cytosol"
      source: "oc"
      note: "Helper fallback can read the global substrate pool when allocation is zero."
    - wid: "H2O"
      compartment: "cytosol"
      source: "oc"
      note: "Helper fallback can read the global substrate pool when allocation is zero."
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from SMC-ADP dissociation."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from ATP hydrolysis."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from ATP hydrolysis."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "-nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-281"
      note: "ATP is spent during the post-bind update."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "393-399"
      note: "ATP delta is applied after n_bound is computed."
    note: "One ATP is spent for each bound SMC."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-281"
      note: "Water is consumed in the same hydrolysis update."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "397-400"
      note: "Water delta is applied alongside ATP."
    note: "One water molecule is spent for each bound SMC."
produce_stoichiometry:
  - wid: "ADP"
    compartment: "cytosol"
    formula_or_constant: "+this.enzymes(this.enzymeIndexs_SMC_ADP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "241-244"
      note: "SMC-ADP dissociation returns ADP to the substrate pool."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "364-366"
      note: "All free SMC-ADP dissociates at the top of next_update."
    note: "Dissociation returns the ADP bookkeeping to the substrate pool."
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "+nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-283"
      note: "Hydrolysis branch produces phosphate."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "397-400"
      note: "Phosphate delta is applied with the ATP consumption block."
    note: "Hydrolysis releases inorganic phosphate."
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "+nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-283"
      note: "Hydrolysis branch produces hydrogen."
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "400-402"
      note: "Hydrogen delta is applied with the ATP consumption block."
    note: "Hydrolysis releases protons."
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "ATP is consumed from the cytosolic substrate pool."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is consumed from the cytosolic substrate pool."
  - wid: "ADP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "ADP is produced back into the cytosolic substrate pool."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Phosphate is produced back into the cytosolic substrate pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen is produced back into the cytosolic substrate pool."
