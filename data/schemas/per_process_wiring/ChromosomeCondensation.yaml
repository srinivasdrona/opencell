    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "691-813"
      note: "Nearest update block; OC also lacks an LP-bound phase for this process."
      symbol: KarrChromosomeCondensationProcess.next_update
  shared_pool_projection_merges_compartments: true
  known_deviations:
    - "OC's literal-chromosome path is stochastic and position-resolved, but the module also retains aggregate `smc_bound_count` / `condensation_level` compatibility outputs, a non-literal Karr-light fallback, and a `trace_hint.boundEnzymes_next` replay override; those paths are not MATLAB's autonomous state/behavior."
    - "MATLAB enforces same-tick request -> allocation -> evolve ordering. In OC the in-process request does reach allocation in tick 1, but next_update already read substrates_allocated=0 before the allocation Step ran; it observes the tick-1 grant only on tick 2, creating a one-tick request-to-consumption lag."
    - "Karr initializeState performs a 20-step warm-up loop with ATP/H2O set to Inf; OC seeds from fixture and trace defaults instead."
  note: "Stochasticity itself is source-faithful. The flat substrate projection is accepted-equivalent because every ChromosomeCondensation substrate is cytosolic-only. Live free/bound SMC topology and source-derived seeding were resolved in Iteration 1; remaining gaps are compatibility paths, request timing, initialization, and default allocator starvation from unrelated request competition."
