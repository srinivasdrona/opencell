schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "ChromosomeCondensation"
  matlab_class: "ChromosomeCondensation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
  oc_class: "KarrChromosomeCondensationProcess"
  oc_file: "opencell/vivarium/karr_chromosome_condensation.py"
  whole_cell_model_id: "Process_ChromosomeCondensation"
  functional_area: "chromosome condensation"
  state_shape_role: "aggregate SMC/chromosome wiring row with allocator and substrate semantics"
  notes: >-
    Karr-light v1 aggregate model: keeps allocator-mediated ATP/H2O demand
    and substrate writeback, but not the full per-position chromosome topology.
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "232-237"
        note: "Allocator-facing ATP/H2O request vector."
        symbol: "calcResourceRequirements_Current"
      note: "Returns ATP and H2O demand equal to free SMC count."
    oc:
      symbol: "KarrChromosomeCondensationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "321-442"
        note: "Merged request emission plus per-tick state update; requests are written into the update dict."
        symbol: "KarrChromosomeCondensationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "323-326"
          note: "Reads `substrates_allocated` first, then applies `_allocated_or_state` as a non-negative clamp."
          symbol: KarrChromosomeCondensationProcess.next_update
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "435-441"
          note: "Writes ATP/H2O request values each tick."
          symbol: KarrChromosomeCondensationProcess.next_update
    status: "partial"
    note: "No standalone request-calculator class; allocator demand is embedded in next_update."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "240-284"
        note: "Dissociate SMC-ADP, bind SMCs stochastically, and apply ATP/H2O -> ADP/PI/H substrate deltas."
        symbol: "evolveState"
    oc:
      symbol: "KarrChromosomeCondensationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "321-442"
        note: "Per-tick aggregate update for bound SMC count and substrate deltas."
        symbol: "KarrChromosomeCondensationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "444-560"
          note: "No-hints binding sampler and bound-site reconstruction."
          symbol: KarrChromosomeCondensationProcess._sample_smc_binding_no_hints
        - path: "opencell/vivarium/karr_chromosome_condensation.py"
          lines: "832-838"
          note: "Allocated-value helper that clamps `substrates_allocated` grants to non-negative values."
          symbol: KarrChromosomeCondensationProcess._allocated_or_state
    status: "partial"
    note: "Implemented as Karr-light aggregate semantics, not the full per-position chromosome model."
  calcFluxBounds:
    matlab:
      symbol: "ChromosomeCondensation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
        lines: "1-1"
        note: "No calcFluxBounds body exists in this class; included for schema completeness. Class-level anchor used to record calcFluxBounds absence."
        symbol: "ChromosomeCondensation"
      note: This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
    oc:
      symbol: "KarrChromosomeCondensationProcess"
      source:
        path: "opencell/vivarium/karr_chromosome_condensation.py"
        lines: "145-937"
        note: "No LP-bound construction path for this process. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrChromosomeCondensationProcess"
      note: OC does not implement this Karr method.
    status: "not_implemented"
    note: "ChromosomeCondensation has no dedicated flux-bound phase in either source tree. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Karr declares allocator demand explicitly; OC reads ATP/H2O from `substrates_allocated` via `_allocated_or_state` (allocated-only non-negative clamp)."
  request_formula:
    matlab: "result(ATP) = this.enzymes(this.enzymeIndexs_SMC); result(H2O) = this.enzymes(this.enzymeIndexs_SMC)"
    oc: "requests[self.name][ATP] = request_need; requests[self.name][H2O] = request_need; no standalone request-calculator class"
    note: "The OC formula is embedded in next_update rather than a separate RequestCalculator."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator-facing binding energy demand."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator-facing hydrolysis co-substrate demand."
  bypasses:
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from SMC-ADP dissociation."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from ATP hydrolysis."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct substrate output from ATP hydrolysis."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "-nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-281"
      note: "ATP is spent during the post-bind update."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "393-399"
      note: "ATP delta is applied after n_bound is computed."
      symbol: KarrChromosomeCondensationProcess.next_update
    note: "One ATP is spent for each bound SMC."
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-281"
      note: "Water is consumed in the same hydrolysis update."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "397-400"
      note: "Water delta is applied alongside ATP."
      symbol: KarrChromosomeCondensationProcess.next_update
    note: "One water molecule is spent for each bound SMC."
    kind: expression
produce_stoichiometry:
  - wid: "ADP"
    compartment: "cytosol"
    formula_or_constant: "+this.enzymes(this.enzymeIndexs_SMC_ADP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "241-244"
      note: "SMC-ADP dissociation returns ADP to the substrate pool."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "364-366"
      note: "All free SMC-ADP dissociates at the top of next_update."
      symbol: KarrChromosomeCondensationProcess.next_update
    note: "Dissociation returns the ADP bookkeeping to the substrate pool."
    kind: expression
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "+nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-283"
      note: "Hydrolysis branch produces phosphate."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "397-400"
      note: "Phosphate delta is applied with the ATP consumption block."
      symbol: KarrChromosomeCondensationProcess.next_update
    note: "Hydrolysis releases inorganic phosphate."
    kind: expression
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "+nBound"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "273-283"
      note: "Hydrolysis branch produces hydrogen."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_chromosome_condensation.py"
      lines: "400-402"
      note: "Hydrogen delta is applied with the ATP consumption block."
      symbol: KarrChromosomeCondensationProcess.next_update
    note: "Hydrolysis releases protons."
    kind: expression
stoichiometry_oracle:
  class: inline
  record_path: data/karr_method_inventory/karr_stoichiometry/ChromosomeCondensation.json
  substrate_count: 5
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "ATP is consumed from the cytosolic substrate pool."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is consumed from the cytosolic substrate pool."
  - wid: "ADP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "ADP is produced back into the cytosolic substrate pool."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Phosphate is produced back into the cytosolic substrate pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen is produced back into the cytosolic substrate pool."
