    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ChromosomeCondensation.m"
      lines: "187-237"
      note: "Nearest resource-update block; no dedicated flux-bound phase exists in this class."
