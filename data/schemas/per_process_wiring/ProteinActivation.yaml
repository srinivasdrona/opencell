    - "Translation"
  note: "Derived only from same-tick consume_stoichiometry and allocator.requests WIDs mapped through the authoritative producer rules; state_groups were excluded because they do not distinguish inputs from outputs."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "ProteinActivation itself has no process-order exception in the primary source; the only canonical hard order in the surrounding simulation is tRNAAminoacylation < Translation."
