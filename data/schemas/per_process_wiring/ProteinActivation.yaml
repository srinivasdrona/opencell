      to_units: "count transitions per tick"
      operation: "no unit conversion; evaluate the boolean rule per compartment and move whole counts between substrates and inactivatedSubstrates in the same tick"
      anchor:
        path: "docs/karr_extracts/process/20_ProteinActivation.md"
        lines: "49-117"
        note: "Boolean syntax plus per-compartment state update semantics."
      constants: []
  note: "The process works directly on counts; there is no mmol/gDW/hr-style scaling chain."
