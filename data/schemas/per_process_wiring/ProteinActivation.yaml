unit_conversion_chain:
  source_units: "MATLAB: counts -> concentration for non-stimulus signals; OC: raw scalar substrate/stimuli values"
  target_units: "count transitions per tick"
  steps:
    - from_units: "MATLAB: counts -> concentration for non-stimulus signals; OC: raw scalar substrate/stimuli values"
      to_units: "count transitions per tick"
      operation: "MATLAB divides non-stimulus rule signals by (nAvogadro/1000) and geometry.volume before per-compartment rule evaluation; OC evaluates flat raw scalar signals and applies whole-count transfers"
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
        lines: "370-375"
        note: "MATLAB concentration conversion prior to activation-rule evaluation."
        symbol: evaluateActivationRules
      constants:
        - "nAvogadro/1000"
        - "geometry.volume"
  note: "MATLAB and OC diverge here: MATLAB converts non-stimulus rule signals and evaluates per compartment, while OC evaluates raw flat-store values (CODE_DEVIATES)."
