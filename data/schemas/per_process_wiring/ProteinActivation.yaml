    - "ProteinProcessingII"
  note: >-
    Canonical downstream consumers of protein activity are the protein-pathway
    and transcriptional-regulation modules; canonical upstream sources are the
    metabolism/host/stress signals and the protein maturation chain that creates
    the mature protein pools being toggled.
