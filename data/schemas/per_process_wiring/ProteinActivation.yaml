schema_date: '2026-07-07'
process:
  name: "ProteinActivation"
  matlab_class: "ProteinActivation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
  oc_class: "KarrProteinActivationProcess"
  oc_file: "opencell/vivarium/karr_protein_activation.py"
  whole_cell_model_id: "Process_ProteinActivation"
  functional_area: "protein-synthesis-and-maturation"
  state_shape_role: "rule-based active/inactive protein-state flip; no stoichiometric chemistry"
  notes: >-
    Exhaustive source-faithful six-protein x six-compartment active/inactive
    transfer. OC preserves true stimuli, converts all other signals with live
    geometry volume, and stores canonical active/inactive tuples in shared
    protein/complex roots.
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
        lines: "353-356"
        note: "Defines calcResourceRequirements_Current and returns zeros(size(this.substrates))."
        symbol: "calcResourceRequirements_Current"
      note: "MATLAB participates in allocator sequencing with an identically zero request."
    oc:
      symbol: "KarrProteinActivationProcess"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "154-773"
        note: "The OC port has no request calculator or substrates_allocated path; MATLAB's request is identically zero."
        symbol: "KarrProteinActivationProcess"
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1658-2513"
          note: "Production topology maps shared protein/complex active/inactive state, stimuli, and live geometry."
          symbol: build_karr_chassis_v5
      note: "Current OC mirrors the allocator-free shape. OC does not implement this Karr method."
    status: "not_implemented"
    note: "MATLAB defines a zero-return request method; OC has no corresponding request-calculator surface. Resource availability is unchanged because the MATLAB request is identically zero."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
        lines: "359-394"
        note: "Per-compartment signal conversion, rule evaluation, and active/inactive transfer."
        symbol: "evolveState"
      note: "Rules are evaluated independently per compartment and toggle active/inactive pools."
    oc:
      symbol: "KarrProteinActivationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "242-244"
        note: "Per-tick entry delegates to exact compartmented rule evaluation and transfer."
        symbol: "KarrProteinActivationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_protein_activation.py"
          lines: "210-211"
          note: "Class entry delegates to the shared protein/complex active/inactive, stimuli, geometry, and derived-activity schema."
          symbol: KarrProteinActivationProcess.ports_schema
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1658-2513"
          note: "Production seeds and maps canonical shared active/inactive state."
          symbol: build_karr_chassis_v5
      note: "Production and direct execution use the same compartmented state and transfer."
    status: "implemented"
    note: "This is the core per-tick behavior and is implemented directly in the OC port."
  calcFluxBounds:
    matlab:
      symbol: "ProteinActivation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
        lines: "118-118"
        note: "The extracted process description contains no LP / flux-bound semantics. Class-level anchor used to record calcFluxBounds absence."
        symbol: "ProteinActivation"
      note: "No flux-bound analogue is described for this rule-only process. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrProteinActivationProcess"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "154-773"
        note: "There is no flux-bound or LP code path in the current OC shim. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrProteinActivationProcess"
      note: "No calcFluxBounds implementation exists for ProteinActivation. OC does not implement this Karr method."
    status: "not_implemented"
    note: "ProteinActivation does not participate in the Metabolism-style flux-bound surface. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "bypass"
    note: "MATLAB is allocator-sequenced but requests an all-zero vector; OC has no request-calculator path. This is a benign structural difference for resource counts."
  request_formula:
    matlab: "ProteinActivation defines calcResourceRequirements_Current but returns zeros(size(this.substrates)); allocator demand is effectively bypassed."
    oc: "NOT_APPLICABLE: current OC shim has no request calculator and no `substrates_allocated` dependency."
    note: "MATLAB's allocator hook is present but zero-demand; OC omits the hook."
  requests: []
  bypasses:
    - wid: "MG_085_HEXAMER"
      compartment: "cytosol"
      source: "both"
      note: "Active/inactive state is read and transferred directly; MATLAB retains a compartment axis while OC uses a flat WID."
    - wid: "MG_101_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Directly toggled between active and inactive pools via boolean rule evaluation."
    - wid: "MG_127_MONOMER"
