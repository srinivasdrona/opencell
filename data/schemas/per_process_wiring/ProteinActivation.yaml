    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/process/20_ProteinActivation.md"
        lines: "49-117"
        note: "The extract describes boolean rule evaluation and state flips only; no allocator block is present."
      note: "ProteinActivation is allocator-free in the extracted source shape."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "137-271"
        note: "The OC port reads substrates and stimuli directly; it has no request calculator or substrates_allocated path."
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1397-1401"
          note: "Composite wiring maps only substrates, stimuli, and protein for this process."
      note: "Current OC mirrors the allocator-free shape."
    status: "not_implemented"
    note: "No per-process resource-request method is described for ProteinActivation in the available source extract."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/20_ProteinActivation.md"
        lines: "102-117"
        note: "Per-compartment boolean activation/deactivation update."
      note: "Rules are evaluated independently per compartment and toggle active/inactive pools."
    oc:
      symbol: "KarrProteinActivationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "229-271"
        note: "Per-tick boolean evaluation and active/inactive writeback."
      supporting:
        - path: "opencell/vivarium/karr_protein_activation.py"
          lines: "195-227"
          note: "Ports schema for substrates, inactivatedSubstrates, stimuli, and protein activity."
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1397-1401"
          note: "Composite port wiring for the process."
      note: "OC implements the MATLAB evolveState semantics as a pure next_update shim."
    status: "implemented"
    note: "This is the core per-tick behavior and is implemented directly in the OC port."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "docs/karr_extracts/process/20_ProteinActivation.md"
        lines: "49-68"
        note: "The extracted process description contains no LP / flux-bound semantics."
      note: "No flux-bound analogue is described for this rule-only process."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "137-271"
        note: "There is no flux-bound or LP code path in the current OC shim."
      note: "No calcFluxBounds implementation exists for ProteinActivation."
    status: "not_implemented"
    note: "ProteinActivation does not participate in the Metabolism-style flux-bound surface."
