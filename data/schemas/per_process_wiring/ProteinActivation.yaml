        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "137-271"
        note: "The OC port reads substrates and stimuli directly; it has no request calculator or substrates_allocated path. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrProteinActivationProcess"
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1397-1401"
          note: "Composite wiring maps only substrates, stimuli, and protein for this process."
          symbol: build_karr_chassis_v4
      note: "Current OC mirrors the allocator-free shape. OC does not implement this Karr method."
    status: "not_implemented"
    note: "No per-process resource-request method is described for ProteinActivation in the available source extract. OC does not implement this Karr method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/20_ProteinActivation.md"
        lines: "102-117"
        note: "Per-compartment boolean activation/deactivation update."
        symbol: "evolveState"
      note: "Rules are evaluated independently per compartment and toggle active/inactive pools."
    oc:
      symbol: "KarrProteinActivationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "240-240"
        note: "Per-tick boolean evaluation and active/inactive writeback."
        symbol: "KarrProteinActivationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_protein_activation.py"
          lines: "195-227"
          note: "Ports schema for substrates, inactivatedSubstrates, stimuli, and protein activity."
          symbol: KarrProteinActivationProcess.ports_schema
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1397-1401"
          note: "Composite port wiring for the process."
          symbol: build_karr_chassis_v4
      note: "OC implements the MATLAB evolveState semantics as a pure next_update shim."
    status: "implemented"
    note: "This is the core per-tick behavior and is implemented directly in the OC port."
  calcFluxBounds:
    matlab:
      symbol: "ProteinActivation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinActivation.m"
        lines: "118-118"
        note: "The extracted process description contains no LP / flux-bound semantics. Class-level anchor used to record calcFluxBounds absence."
        symbol: "ProteinActivation"
      note: "No flux-bound analogue is described for this rule-only process. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrProteinActivationProcess"
      source:
        path: "opencell/vivarium/karr_protein_activation.py"
        lines: "137-271"
        note: "There is no flux-bound or LP code path in the current OC shim. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrProteinActivationProcess"
      note: "No calcFluxBounds implementation exists for ProteinActivation. OC does not implement this Karr method."
    status: "not_implemented"
    note: "ProteinActivation does not participate in the Metabolism-style flux-bound surface. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
