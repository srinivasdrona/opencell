allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "MATLAB evolves with allocator grants injected by Simulation.evolveState; OC non-hint next_update reads substrates_allocated[self.name] for requested WIDs and does not provide a raw-substrates fallback on that path."
  request_formula:
    matlab: "allocations = max(0, fix(requirements .* tmp(:, ones(nProcesses, 1))))"
    oc: "requests are built inline in KarrReplicationProcess.next_update from _demand_from_advances; zero outside elongating state, then clipped against substrates_allocated[self.name]"
    note: "Karr allocation is simulation-wide fair-share; OC embeds the per-process demand inside the process update."
  requests:
    - wid: "DATP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DCTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DGTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DTTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "ATP"
      compartment: cytosol
      source: karr
      note: "Energy request for fork unwinding and clamp loading."
    - wid: "H2O"
      compartment: cytosol
      source: karr
      note: "MATLAB request surface includes water alongside ATP for initiation/unwinding/clamp loading hydrolysis demand."
    - wid: "NAD"
      compartment: cytosol
      source: karr
      note: "MATLAB request surface includes NAD for ligation demand."
  bypasses:
    - wid: "H2O"
      compartment: cytosol
      source: oc
      note: "OC trace-hint replay consumes H2O directly in ATP hydrolysis bookkeeping; OC non-hint allocator requests do not include H2O."
    - wid: "NAD"
      compartment: cytosol
      source: oc
      note: "OC trace-hint replay consumes NAD for ligation; OC non-hint allocator requests do not include NAD."
    - wid: "NMN"
      compartment: cytosol
      source: oc
      note: "Direct ligation product written by the process."
    - wid: "AMP"
      compartment: cytosol
      source: oc
      note: "Direct ligation product written by the process."
    - wid: "PPI"
      compartment: cytosol
      source: oc
      note: "Direct dNTP hydrolysis product written by the process."
