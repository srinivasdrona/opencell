unit_conversion_chain:
  source_units: "per-second kinetic rates and fork progress"
  target_units: "molecule counts/tick"
  steps:
    - from_units: "bp/s"
      to_units: "bp/tick"
      operation: "×stepSizeSec then floor/round to integer fork advance"
      constants: ["stepSizeSec", "fork_polymerization_rate_bp_per_s"]
      anchor:
        path: "opencell/vivarium/karr_replication.py"
        lines: "628-636"
        note: "Fork progression is converted into integer bp advance per tick."
    - from_units: "bp/tick"
      to_units: "nt/tick"
      operation: "×2 for the two replicated strands"
      constants: ["2"]
      anchor:
        path: "opencell/vivarium/karr_replication.py"
        lines: "628-636"
        note: "The process converts total advanced bp into total polymerized nucleotides."
    - from_units: "nt/tick"
      to_units: "dNTP molecules/tick"
      operation: "partition_counts() by dNTP fractions"
      constants: ["_dntp_fractions"]
      anchor:
        path: "opencell/vivarium/karr_replication.py"
        lines: "628-636"
        note: "Nucleotide partitioning is done by the fixture-derived A/T and G/C fractions."
    - from_units: "s^-1"
      to_units: "ligation events/tick"
      operation: "×stepSizeSec × ligase_rate_per_s then stochastic_round"
      constants: ["stepSizeSec", "ligase_rate_per_s"]
      anchor:
        path: "opencell/vivarium/karr_replication.py"
        lines: "637-644"
        note: "Ligase events are rounded to integer tick counts."
  note: "The MATLAB extract describes the process qualitatively; the OC port computes integer counts with integer rounding, partitioning, and tick-scale event bookkeeping."
