schema_version: "1.0"
process:
  name: "Replication"
  matlab_class: "Replication"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Replication.m"
  oc_class: "KarrReplicationProcess"
  oc_file: "opencell/vivarium/karr_replication.py"
  whole_cell_model_id: "Process_Replication"
  functional_area: "dna-replication-and-maintenance"
  state_shape_role: "process wiring row; state-shape catalog row adds integration semantics"
  notes: "The checked-in extract describes 8 replication subfunctions; the current OC port replays fork progression and substrate bookkeeping, while SSB and RNAP collision mechanics remain deferred."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/architecture/03_variable_allocation.md"
        lines: "13-23"
        note: "Simulation-level allocator loop that invokes the process request method; no raw Replication.m body was recoverable in this worktree."
      note: "Allocator-facing request path."
    oc:
      symbol: "KarrReplicationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_replication.py"
        lines: "937-981"
        note: "Inline request construction and allocator clipping."
      supporting:
        - path: "opencell/vivarium/karr_replication.py"
          lines: "578-583"
          note: "Request and substrates_allocated state schema."
      note: "Requests are built inline rather than via a standalone request-calculator class."
    status: "partial"
    note: "Current OC exposes the allocator behavior inside next_update instead of a dedicated request method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/karr_extracts/process/03_Replication.md"
        lines: "103-173"
        note: "Eight-subfunction replication simulation summary from the extracted source doc."
      note: "Primary per-tick process logic."
    oc:
      symbol: "KarrReplicationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_replication.py"
        lines: "889-1033"
        note: "Current per-tick update path."
      supporting:
        - path: "opencell/vivarium/karr_replication.py"
          lines: "702-744"
          note: "Trace-hint replay branch."
        - path: "opencell/vivarium/karr_replication.py"
          lines: "578-583"
          note: "Request and allocation state schema."
      note: "Light-bulk OC replay of fork progression and substrate bookkeeping."
    status: "partial"
    note: "The current port preserves fork motion and substrate deltas, but not the full Karr 8-stage mechanistic loop."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "docs/karr_extracts/process/03_Replication.md"
        lines: "103-173"
        note: "No dedicated flux-bounds block surfaced in the extracted Replication notes."
      note: "Not observed as a Replication-specific method in the checked-in extract."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_replication.py"
        lines: "227-1033"
        note: "No calcFluxBounds symbol exists in the current OC port."
      note: "Replication has no OC flux-bounds helper in this repository state."
    status: "not_implemented"
    note: "Retained for schema completeness; this process does not expose an LP-bound layer."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "OC reads substrates_allocated[self.name] in the main update path, with a raw substrates fallback only when the allocation surface is absent."
  request_formula:
    matlab: "allocations = max(0, fix(requirements .* tmp(:, ones(nProcesses, 1))))"
    oc: "requests are built inline in KarrReplicationProcess.next_update from _demand_from_advances; zero outside elongating state, then clipped against substrates_allocated[self.name]"
    note: "Karr allocation is simulation-wide fair-share; OC embeds the per-process demand inside the process update."
  requests:
    - wid: "DATP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DCTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DGTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "DTTP"
      compartment: cytosol
      source: karr
      note: "One of the four dNTP allocation slots."
    - wid: "ATP"
      compartment: cytosol
      source: karr
      note: "Energy request for fork unwinding and clamp loading."
  bypasses:
    - wid: "H2O"
      compartment: cytosol
      source: oc
      note: "Directly consumed in the ATP hydrolysis bookkeeping, not requested via the allocator."
    - wid: "NAD"
      compartment: cytosol
      source: oc
      note: "Direct ligation cofactor consumed outside the allocator request surface."
    - wid: "NMN"
      compartment: cytosol
      source: oc
      note: "Direct ligation product written by the process."
    - wid: "AMP"
      compartment: cytosol
      source: oc
      note: "Direct ligation product written by the process."
    - wid: "PPI"
      compartment: cytosol
      source: oc
      note: "Direct dNTP hydrolysis product written by the process."
consume_stoichiometry:
  - wid: "DATP"
    compartment: cytosol
    formula_or_constant: "partition_counts(2 * total_advanced_bp)[0]"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Advance replisomes: available dNTP for polymerization and energy for unwinding."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "628-636"
      note: "_demand_from_advances partitions the total advanced bp into dNTP counts."
  - wid: "DCTP"
    compartment: cytosol
    formula_or_constant: "partition_counts(2 * total_advanced_bp)[1]"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Same advance-replisomes block as DATP."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "628-636"
      note: "_demand_from_advances partitions the total advanced bp into dNTP counts."
  - wid: "DGTP"
    compartment: cytosol
    formula_or_constant: "partition_counts(2 * total_advanced_bp)[2]"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Same advance-replisomes block as DATP."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "628-636"
      note: "_demand_from_advances partitions the total advanced bp into dNTP counts."
  - wid: "DTTP"
    compartment: cytosol
    formula_or_constant: "partition_counts(2 * total_advanced_bp)[3]"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Same advance-replisomes block as DATP."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "628-636"
      note: "_demand_from_advances partitions the total advanced bp into dNTP counts."
  - wid: "ATP"
    compartment: cytosol
    formula_or_constant: "initiation_cost + catalytic_atp_events"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Advance replisomes: energy for unwinding."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "637-644"
      note: "ATP events are split between initiation, helicase, and beta-clamp loading."
produce_stoichiometry:
  - wid: "ADP"
    compartment: cytosol
    formula_or_constant: "atp_events"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Hydrolysis bookkeeping is implied by the unwinding energy demand."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "978-1012"
      note: "ATP consumption writes ADP/PI/H directly into substrate deltas."
  - wid: "PI"
    compartment: cytosol
    formula_or_constant: "atp_events"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Hydrolysis bookkeeping is implied by the unwinding energy demand."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "978-1012"
      note: "ATP consumption writes ADP/PI/H directly into substrate deltas."
  - wid: "H"
    compartment: cytosol
    formula_or_constant: "atp_events"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "Hydrolysis bookkeeping is implied by the unwinding energy demand."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "978-1012"
      note: "ATP consumption writes ADP/PI/H directly into substrate deltas."
  - wid: "PPI"
    compartment: cytosol
    formula_or_constant: "sum(used_dntp)"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "114-131"
      note: "dNTP polymerization implies pyrophosphate release."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "978-1012"
      note: "dNTP consumption writes PPI directly into substrate deltas."
  - wid: "NMN"
    compartment: cytosol
    formula_or_constant: "ligations"
    matlab_anchor:
      path: "docs/karr_extracts/process/03_Replication.md"
      lines: "166-173"
      note: "Ligate DNA: NAD availability."
    oc_anchor:
      path: "opencell/vivarium/karr_replication.py"
      lines: "978-1012"
      note: "Ligase bookkeeping writes NMN/AMP directly into substrate deltas."
