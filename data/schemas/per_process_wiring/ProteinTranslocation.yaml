      lines: "1-131"
      note: "Checked-in extract with the process header and executable-intent summary."
      symbol: Karr Process - ProteinTranslocation
    request_terms:
      path: "docs/karr_extracts/process/22_ProteinTranslocation.md"
      lines: "103-111"
      note: "Per-monomer ATP and SRP/GTP cost terms described in the extract."
      symbol: Verbatim docstring extract
    evolve_state:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "48-72"
      note: "Parity audit anchored to Karr lines 307-368 for the executable loop body."
      symbol: 1. Algorithm summary
  oc_blocks:
    process_class:
      path: "opencell/vivarium/karr_protein_translocation.py"
