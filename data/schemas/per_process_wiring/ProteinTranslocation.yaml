schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "ProteinTranslocation"
  matlab_class: "ProteinTranslocation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinTranslocation.m"
  oc_class: "KarrProteinTranslocationProcess"
  oc_file: "opencell/vivarium/karr_protein_translocation.py"
  whole_cell_model_id: "Process_ProteinTranslocation"
  functional_area: "protein-synthesis-and-maturation"
  state_shape_role: "state-shape catalog row; wiring row adds integration semantics"
  notes: "The raw MATLAB file is absent from this checkout, so the row uses checked-in extract/audit docs plus the current OC port and fixture metadata."
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/karr_extracts/process/22_ProteinTranslocation.md"
        lines: "103-111"
        note: "Process extract describes the ATP/GTP hydrolysis terms and cost scalars that drive allocation demand; raw MATLAB body is absent locally."
        symbol: "calcResourceRequirements_Current"
      note: "Allocator demand is inferred from the process extract and fixture scalars."
    oc:
      symbol: "RequestCalculatorPTransloc.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "658-710"
        note: "Current OC request calculator aggregates ATP/GTP/H2O demand from queued translocating proteins."
        symbol: "RequestCalculatorPTransloc.next_update"
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "758-784"
          note: "Chassis wiring that enrolls the ProteinTranslocation request calculator and consumer process."
          symbol: build_karr_chassis_v3
      note: "The OC path is indirect but allocator-wired; it reads the translocation process's pending queue and emits ATP/GTP/H2O requests."
    status: "partial"
    note: "OC preserves the three-request surface, but it caps requests by current substrate pool and is wired as a separate request-calculator step instead of a process method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
        lines: "48-72"
        note: "Parity audit of the Karr per-copy randperm loop, rate-scaled capacities, and first-insufficient-copy break semantics; raw MATLAB source is absent locally."
        symbol: "evolveState"
      note: "The audit cites Karr lines 307-368 for the executable body."
    oc:
      symbol: "KarrProteinTranslocationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_protein_translocation.py"
        lines: "307-445"
        note: "Current OC per-tick translocation update."
        symbol: "KarrProteinTranslocationProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_request_calculators.py"
          lines: "658-710"
          note: "Allocator input path read by the process."
          symbol: RequestCalculatorPTransloc
      note: "OC mirrors Karr's copy-level randperm traversal, rate-scaled translocase/SRP capacity checks, and break-on-first-insufficient-copy behavior."
    status: "partial"
    note: "Implemented with parity on per-copy ordering and rate-scaled capacities; residual differences are documented in known_deviations."
  calcFluxBounds:
    matlab:
      symbol: "ProteinTranslocation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinTranslocation.m"
        lines: "1-131"
        note: "Process extract does not describe any flux-bounds method for ProteinTranslocation; slot retained because the schema requires it. Class-level anchor used to record calcFluxBounds absence."
        symbol: "ProteinTranslocation"
      note: "No ProteinTranslocation-specific flux-bound method is documented in the checked-in extract. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrProteinTranslocationProcess"
      source:
        path: "opencell/vivarium/karr_protein_translocation.py"
        lines: "95-443"
        note: "OC port has no flux-bounds implementation for this process. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrProteinTranslocationProcess"
      note: "No equivalent OC symbol exists. OC does not implement this Karr method."
    status: "not_implemented"
    note: "ProteinTranslocation is not an LP-bounded process; this schema slot is intentionally empty. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "OC reads only `substrates_allocated[self.name]`; the process itself is allocator-mediated."
  request_formula:
    matlab: "ATP_need = min(translocases, sum(count_i * ceil(monomerLength_i / preproteinTranslocase_aaTranslocatedPerATP))); GTP_need = min(SRPs, SRP_GTPUsedPerMonomer * count_srp); H2O_need = ATP_need + GTP_need; requests = [ATP_need; GTP_need; H2O_need]"
    oc: "requests[ATP/GTP/H2O] = max(need, current_pool) after aggregating queued cytoplasmic proteins by pathway"
    note: "MATLAB request terms include translocase/SRP capacity clipping before hydrolysis summation; OC over-requests by flooring at the current substrate pool."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Translocase hydrolysis budget for per-copy step-wise movement."
    - wid: "GTP"
      compartment: "cytosol"
      source: "karr"
      note: "SRP-mediated pathway budget."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Hydrolysis budget shared by ATP/GTP consumption."
  bypasses:
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct product writeback in the OC substrate update."
    - wid: "GDP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct product writeback for the SRP pathway."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Direct hydrolysis product writeback."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct hydrolysis product writeback."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "sum(translocated_count_i * ceil(monomerLength_i / preproteinTranslocase_aaTranslocatedPerATP))"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "70-72"
      note: "Karr consumes ATP as part of the per-copy translocation loop; exact line span is cited in the parity audit."
      symbol: 4. Substrate-availability handling
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "381-445"
      note: "OC computes and subtracts ATP per translocated copy, then emits the aggregate delta."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: per_reaction
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "SRP_GTPUsedPerMonomer * count_srp_path_monomers"
    matlab_anchor:
      path: "docs/karr_extracts/process/22_ProteinTranslocation.md"
      lines: "107-110"
      note: "Process extract names the SRP GTP cost term."
      symbol: Verbatim docstring extract
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "381-445"
      note: "OC applies the SRP GTP cost to SRP-path proteins only."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "ATP_spent + GTP_spent"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "70-72"
      note: "Hydrolysis water is part of the same per-copy loop in Karr."
      symbol: 4. Substrate-availability handling
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "434-456"
      note: "OC decrements H2O by the aggregate hydrolysis spent."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
produce_stoichiometry:
  - wid: "ADP"
    compartment: "cytosol"
    formula_or_constant: "ATP_spent"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "63-72"
      note: "Karr produces ADP alongside ATP consumption."
      symbol: 2. Step-by-step mapping
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "434-456"
      note: "OC emits ADP in the aggregate substrate delta."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
  - wid: "GDP"
    compartment: "cytosol"
    formula_or_constant: "GTP_spent"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "63-72"
      note: "Karr produces GDP on SRP-path translocations."
      symbol: 2. Step-by-step mapping
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "434-456"
      note: "OC emits GDP when GTP is spent."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "ATP_spent + GTP_spent"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "63-72"
      note: "Karr produces Pi as part of the hydrolysis ledger."
      symbol: 2. Step-by-step mapping
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "434-456"
      note: "OC emits Pi as the aggregate hydrolysis total."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "ATP_spent + GTP_spent"
    matlab_anchor:
      path: "docs/phase_f/sut_audits/ptransloc_oc_vs_karr.md"
      lines: "63-72"
      note: "Karr produces H+ with hydrolysis."
      symbol: 2. Step-by-step mapping
    oc_anchor:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "434-456"
      note: "OC emits H as the aggregate hydrolysis total."
      symbol: KarrProteinTranslocationProcess.next_update
    kind: expression
stoichiometry_oracle:
  class: inline
  record_path: data/karr_method_inventory/karr_stoichiometry/ProteinTranslocation.json
  substrate_count: 7
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "ATP is read and spent in the cytosolic substrate pool."
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "GTP is only spent on SRP-path proteins."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is consumed with hydrolysis."
  - wid: "ADP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "ADP is produced in the same cytosolic pool."
  - wid: "GDP"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "GDP is produced in the same cytosolic pool."
  - wid: "PI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Pi is produced in the same cytosolic pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "H+ is produced in the same cytosolic pool."
unit_conversion_chain:
  source_units: "molecules/tick"
  target_units: "molecules/tick"
  steps:
    - from_units: molecules/tick
      to_units: molecules/tick
      operation: identity
      constants: []
      anchor:
        path: "opencell/vivarium/karr_protein_translocation.py"
        lines: "307-445"
        note: Process works directly in per-tick integer counts; no unit conversion needed.
        symbol: KarrProteinTranslocationProcess.next_update
      note: Process works directly in per-tick integer counts; no unit conversion needed.
  note: "This process does not require unit conversion (per-tick integer counts throughout)."
dependencies:
  produces_inputs_for:
    - "ProteinProcessingII"
  consumes_outputs_of:
    - "Translation"
    - "Metabolism"
  note: "Removed ProteinFolding, ProteinModification, ProteinDecay, MacromolecularComplexation from produces_inputs_for because the downstream rows do not expose a direct stoichiometric handoff; added Metabolism to consumes_outputs_of because this row directly draws from the shared metabolite pool."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "ProteinTranslocation has no process-specific scheduler exception in `Simulation.evolveState`; the only documented hard order is tRNAAminoacylation before Translation."
