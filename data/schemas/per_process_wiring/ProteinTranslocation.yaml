      note: "Process class definition, fixture loading, and port schema."
      symbol: KarrProteinTranslocationProcess
    next_update:
      path: "opencell/vivarium/karr_protein_translocation.py"
      lines: "307-445"
      note: "Current OC per-tick translocation update."
      symbol: KarrProteinTranslocationProcess.next_update
    request_calculator:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "658-710"
      note: "Allocator request path for ATP/GTP/H2O."
