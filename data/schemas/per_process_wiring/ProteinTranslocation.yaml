deviations:
  lp_bounds_source:
    karr: "allocation"
    oc_current: "allocation"
    matlab_anchor:
      path: "docs/karr_extracts/process/22_ProteinTranslocation.md"
      lines: "103-111"
      note: "The process demand is allocator-facing and does not use an LP bound layer."
      symbol: Verbatim docstring extract
    oc_anchor:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "658-710"
      note: "OC request calculator emits allocator-facing ATP/GTP/H2O demand."
      symbol: RequestCalculatorPTransloc
  shared_pool_projection_merges_compartments: true
  known_deviations:
    - "OC request magnitude uses a current-pool floor (`max(need, current_pool)`), which can over-request relative to pure need."
    - "OC represents moved proteins with `protein.location` plus `protein.unprocessed_counts` deltas instead of Karr's compartment-resolved monomer matrix."
