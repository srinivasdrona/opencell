      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "804-846"
        note: "Current OC request calculator applies the MATLAB capacity mins to authoritative processed-I cytosolic counts."
        symbol: "RequestCalculatorPTransloc.next_update"
