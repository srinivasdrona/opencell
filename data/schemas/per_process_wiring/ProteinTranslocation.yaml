          symbol: build_karr_chassis_v3
      note: "The OC path is a separate allocator Step but implements the same ATP/GTP/H2O request algebra over authoritative compartment state."
    status: "implemented"
    note: "OC preserves the MATLAB request formula and three-request surface in a separately wired allocator Step."
