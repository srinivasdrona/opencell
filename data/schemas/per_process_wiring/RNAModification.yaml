schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "RNAModification"
  matlab_class: "RNAModification"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
  oc_class: "KarrRNAModificationProcess"
  oc_file: "opencell/vivarium/karr_rna_modification.py"
  whole_cell_model_id: "Process_RNAModification"
  functional_area: "RNA maturation"
  state_shape_role: "reaction process with allocator-mediated substrate share and local RNA completion counts"
  notes: >-
    MATLAB defines 91 RNA-modification reactions over 29 substrate WIDs, 347
    RNA targets in the flat fixture, and 13 enzymes; the current OC port trims
    to the 38 active RNA targets and splits enzyme inputs across protein.counts
    and complex.counts.
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
        lines: "289-294"
        note: "Per-tick request formula: enzyme capacity capped by available unmodified RNAs."
      note: "This is the Karr allocator-facing request surface for RNAModification."
    oc:
      symbol: "RequestCalculatorRNAPathway.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "286-359"
        note: "Shared RNAProcessing + RNAModification request step."
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "1052-1138"
          note: "Current chassis wiring that instantiates the shared RNA-pathway request calculator."
      note: >-
        Current OC request logic is shared across the RNA pathway and requests
        the currently available consumed substrates when RNAs are active; it is
        not a process-local LP or request calculator.
    status: "partial"
    note: >-
      The OC request path is implemented, but the surface is shared and
      simplified relative to the MATLAB expression.
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
        lines: "297-362"
        note: "Stochastic reaction loop, substrate updates, and RNA writeback."
      note: "This is the per-tick maturation loop for modified and unmodified RNAs."
    oc:
      symbol: "KarrRNAModificationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_rna_modification.py"
        lines: "173-303"
        note: "Per-tick update path that reads allocated substrates and writes substrate/RNA deltas."
      supporting:
        - path: "opencell/vivarium/karr_rna_modification.py"
          lines: "305-322"
          note: "Declared-enzyme input guard."
        - path: "opencell/vivarium/karr_rna_modification.py"
          lines: "324-380"
          note: "Deterministic plus stochastic residual reaction sampler."
      note: >-
        OC reproduces the reaction-stoichiometry update through
        substrates_allocated, split enzyme stores, and an explicit stochastic
        residual loop.
    status: "partial"
    note: >-
      Behavior is implemented, but the OC port is not line-for-line identical
      to the MATLAB loop.
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
        lines: "81-381"
        note: "RNAModification does not define a local flux-bounds override; the class body ends without one."
      note: "Included as a schema-required placeholder for a process that is not LP-bound."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_rna_modification.py"
        lines: "56-380"
        note: "No OC flux-bound routine exists for RNAModification."
      note: "No current OC analogue."
    status: "not_implemented"
    note: "RNAModification is allocator-fed and reaction-driven rather than LP-bound."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: >-
      Karr requests resource share via calcResourceRequirements_Current, and
      current OC consumes the allocated surface at states["substrates_allocated"][self.name].
  request_formula:
    matlab: "max(0, -this.reactionStoichiometryMatrix) * min(ceil(this.reactionCatalysisMatrix * this.enzymes * this.stepSizeSec), (this.reactionModificationMatrix * this.unmodifiedRNAs))"
    oc: "if any(unmodified RNA > 0), rm_request[wid] = max(0, substrate_state[wid]) for each consumed wid; else zero requests (shared RNA-pathway calculator)"
    note: "Formula is symbolic and grep-friendly, not executable."
  requests:
    - wid: "AMET"
      compartment: "cytosol"
      source: "karr"
      note: "Representative methyl-donor demand; one of the core allocator-fed substrate families."
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Representative ATP-coupled demand for sulfur-transfer and lysidine families."
    - wid: "CYS"
      compartment: "cytosol"
      source: "karr"
      note: "Representative sulfur-transfer demand."
    - wid: "FTHF5"
      compartment: "cytosol"
      source: "karr"
      note: "Representative one-carbon transfer demand."
    - wid: "LYS"
      compartment: "cytosol"
      source: "karr"
      note: "Representative lysidine-family demand."
  bypasses:
    - wid: "MG_463_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct enzyme read in MATLAB this.enzymes and OC protein.counts / complex.counts split."
    - wid: "MG_380_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct enzyme read in MATLAB this.enzymes and OC protein.counts / complex.counts split."
    - wid: "MG_252_DIMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct enzyme read in MATLAB this.enzymes and OC protein.counts / complex.counts split."
    - wid: "MG_346_DIMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct enzyme read in MATLAB this.enzymes and OC protein.counts / complex.counts split."
    - wid: "MG_084_TETRAMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct enzyme read in MATLAB this.enzymes and OC protein.counts / complex.counts split."
consume_stoichiometry:
  - wid: "AMET"
    compartment: "cytosol"
    formula_or_constant: "-1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
      lines: "297-362"
      note: "Representative methyl-donor consumption family."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_modification.py"
      lines: "244-281"
      note: "Net substrate delta is assembled from reaction stoichiometry and completed reaction events."
    note: "Representative per-reaction coefficient; the total delta is the stoichiometric row dot product."
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "-1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
      lines: "297-362"
      note: "Representative ATP-coupled family."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_modification.py"
      lines: "244-281"
      note: "Same substrate-delta writeback path."
    note: "Representative coefficient; several reaction families consume ATP."
  - wid: "CYS"
    compartment: "cytosol"
    formula_or_constant: "-1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
      lines: "297-362"
      note: "Representative sulfur-transfer family."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_modification.py"
      lines: "244-281"
      note: "Same substrate-delta writeback path."
    note: "Representative coefficient; sulfur-transfer reactions consume cysteine."
  - wid: "FTHF5"
    compartment: "cytosol"
    formula_or_constant: "-1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
      lines: "297-362"
      note: "Representative one-carbon transfer family."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_modification.py"
      lines: "244-281"
      note: "Same substrate-delta writeback path."
    note: "Representative coefficient; one-carbon reactions consume FTHF5 with glycine."
  - wid: "LYS"
    compartment: "cytosol"
    formula_or_constant: "-1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
      lines: "297-362"
      note: "Representative lysidine family."
    oc_anchor:
      path: "opencell/vivarium/karr_rna_modification.py"
      lines: "244-281"
      note: "Same substrate-delta writeback path."
    note: "Representative coefficient; lysidine synthesis consumes lysine."
produce_stoichiometry:
  - wid: "AHCYS"
    compartment: "cytosol"
    formula_or_constant: "+1"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
