    note: "Cytosolic product of one-carbon transfer reactions."
unit_conversion_chain:
  source_units: "enzyme activity / RNA counts / reaction events"
  target_units: "molecules/tick"
  steps:
    - from_units: "enzyme activity (1/s)"
      to_units: "reaction opportunities/tick"
      operation: "×stepSizeSec and ceil(reactionCatalysisMatrix * enzymes * stepSizeSec)"
      constants: ["stepSizeSec"]
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
        lines: "221-235"
        note: "Builds the per-step species matrices with step-size-scaled enzyme bounds."
    - from_units: "reaction opportunities/tick"
      to_units: "substrate molecules/tick"
      operation: "reactionStoichiometryMatrix * reactionModificationMatrix(:, rnaMask_modified) * reactionFluxes"
      constants: []
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RNAModification.m"
        lines: "355-361"
        note: "MATLAB substrate writeback from completed reaction counts."
    - from_units: "reaction opportunities/tick"
      to_units: "RNA completion counts/tick"
      operation: "transition_events from min(reactionFluxes(required_rxn)); update unmodifiedRNAs and modifiedRNAs by ±transition_events"
      constants: []
      anchor:
        path: "opencell/vivarium/karr_rna_modification.py"
        lines: "253-299"
        note: "OC completion counting and RNA writeback."
  note: "No biomass/Avogadro conversion is needed here; both sides operate on integer molecule counts per tick."
dependencies:
  produces_inputs_for:
    - "RibosomeAssembly"
  consumes_outputs_of:
    - "RNAProcessing"
    - "Metabolism"
  note: "Removed tRNAAminoacylation from produces_inputs_for because the downstream rows do not expose a direct stoichiometric handoff; added Metabolism to consumes_outputs_of because this row directly draws from the shared metabolite pool."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: >-
    No RNAModification-specific process-order exception is documented. The
    canonical hard order in Karr's tick scheduler is
    tRNAAminoacylation < Translation.
