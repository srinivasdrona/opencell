    note: "Cytosolic substrate consumed by sulfur-transfer reactions."
  - wid: "AHCYS"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Cytosolic product of methyl-transfer reactions."
  - wid: "PPI"
    consume_compartment:
    produce_compartment: "cytosol"
