    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Cytosolic substrate consumed by methyl-transfer reactions."
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Cytosolic substrate consumed by ATP-coupled modification reactions."
  - wid: "CYS"
    consume_compartment: "cytosol"
    produce_compartment:
