schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "RibosomeAssembly"
  matlab_class: "RibosomeAssembly"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
  oc_class: "KarrRibosomeAssemblyProcess"
  oc_file: "opencell/vivarium/karr_ribosome_assembly.py"
  whole_cell_model_id: "Process_RibosomeAssembly"
  functional_area: "protein-synthesis-and-maturation"
  state_shape_role: "cytosolic two-particle ribosome assembly row"
  notes: "Assembles the 30S and 50S ribosomal particles from rRNA and ribosomal protein subunits, with GTP/H2O request and GDP/PI/H byproducts."
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "277-298"
        note: "Allocator-facing request block for GTP and water."
        symbol: "calcResourceRequirements_Current"
      note: "The MATLAB request block is explicit in the process class and feeds the global allocator pass."
    oc:
      symbol: "RequestCalculatorRibAsm.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "163-226"
        note: "Dedicated request step that computes GTP/H2O demand from the current subunit state."
        symbol: "RequestCalculatorRibAsm.next_update"
      supporting:
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "273-287"
          note: "Formable-particle estimator used by the request step."
          symbol: KarrRibosomeAssemblyProcess.estimate_formable_without_substrates
      note: "OC keeps the same allocator-facing request semantics but routes them through a separate request-calculator step; the estimator reads current RNA, monomer, and enzyme state, then multiplies formable particles by per-particle GTPase counts."
    status: "implemented"
    note: "The request path is allocation-backed on both sides; OC splits the calculation out of the process class and uses per-particle hydrolysis counts in the request calculator."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "301-340"
        note: "Randomized two-particle greedy assembly loop with immediate state writeback."
        symbol: "evolveState"
      note: "Helper `getGtpPerComplex` is part of the same behavior."
    oc:
      symbol: "KarrRibosomeAssemblyProcess.next_update"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "334-383"
        note: "Current per-tick update path."
        symbol: "KarrRibosomeAssemblyProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "239-271"
          note: "Binary enzyme gate and per-particle resource limits."
          symbol: KarrRibosomeAssemblyProcess._particle_resource_limits
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "289-332"
          note: "Delta builder for substrates, RNA, protein, and complexes."
          symbol: KarrRibosomeAssemblyProcess._build_update
      note: "OC preserves the randomized order and sequential depletion behavior, and its catalytic-enzyme gate matches the MATLAB presence check."
    status: "implemented"
    note: "The current OC process reads `substrates_allocated` and matches the MATLAB per-particle update shape except for the early-return divergence captured below."
  calcFluxBounds:
    matlab:
      symbol: "RibosomeAssembly"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "73-370"
        note: "No process-local flux-bounds method appears in the class body. Class-level anchor used to record calcFluxBounds absence."
        symbol: "RibosomeAssembly"
      note: "RibosomeAssembly does not define a flux-bounds method in the source we read. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrRibosomeAssemblyProcess"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "75-383"
        note: "No OC flux-bounds analogue exists for this process. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrRibosomeAssemblyProcess"
      note: "There is no current OC flux-bounds implementation to bind. OC does not implement this Karr method."
    status: "not_implemented"
    note: "This slot is present because the schema requires it, not because RibosomeAssembly is a flux-bounds process. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both source trees use allocator-gated GTP/H2O request semantics."
  request_formula:
    matlab: "result(GTP) = result(H2O) = getGtpPerComplex(2) * all(enzymes_30S) * (1 + min(RNAs_30S, monomers_30S)) + getGtpPerComplex(2) * all(enzymes_50S) * (1 + min(RNAs_50S, monomers_50S))"
    oc: "request(GTP) = request(H2O) = sum_{particle in {30S,50S}} formable_particle_count[particle] * n_gtpases_per_particle[particle]"
    note: "Symbolic and grep-friendly; the OC request step preserves the same demand shape but routes through RequestCalculatorRibAsm and per-particle hydrolysis counts."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical allocator request substrate."
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Canonical allocator request substrate."
  bypasses:
    - wid: "MG_329_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MG_387_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MG_143_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MGrrnA16S"
      compartment: "cytosol"
      source: "both"
      note: "Direct RNA pool read/subtraction in the update path."
    - wid: "RIBOSOME_30S"
      compartment: "cytosol"
      source: "both"
      note: "Direct complex count increment in the update path."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "-n_form * n_gtpases_per_particle[particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-338"
      note: "GTP is consumed together with the other hydrolysis substrates."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "363-372"
      note: "Local allocation is decremented in-step before the next particle is considered."
      symbol: KarrRibosomeAssemblyProcess.next_update
    kind: expression
