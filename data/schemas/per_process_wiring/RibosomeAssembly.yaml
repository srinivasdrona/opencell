  known_deviations:
    - "OC splits request generation into RequestCalculatorRibAsm while MATLAB keeps the allocator request on the process class."
    - "MATLAB calcResourceRequirements_Current hardcodes getGtpPerComplex(2) in both particle terms; OC RequestCalculatorRibAsm computes hydrolysis
