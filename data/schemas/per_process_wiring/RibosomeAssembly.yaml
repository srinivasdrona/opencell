schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "RibosomeAssembly"
  matlab_class: "RibosomeAssembly"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
  oc_class: "KarrRibosomeAssemblyProcess"
  oc_file: "opencell/vivarium/karr_ribosome_assembly.py"
  whole_cell_model_id: "Process_RibosomeAssembly"
  functional_area: "protein-synthesis-and-maturation"
  state_shape_role: "cytosolic two-particle ribosome assembly row"
  notes: "Assembles the 30S and 50S ribosomal particles from rRNA and ribosomal protein subunits, with GTP/H2O request and GDP/PI/H byproducts."
methods:
  initializeConstants:
    matlab:
      symbol: "initializeConstants"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "155-194"
        note: "Loads cytosolic RNA/monomer composition and catalytic GTPase assignments."
      note: "MATLAB keeps constant loading in a dedicated initialization callback."
    oc:
      symbol: "KarrRibosomeAssemblyProcess._load_fixture"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "115-147"
        note: "Loads the flattened RibosomeAssembly fixture and extracts WIDs plus stoichiometry."
      supporting:
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "85-88"
          note: "Constructor wires fixture loading into object construction."
      note: "OC folds constant loading into fixture ingestion instead of a MATLAB-style callback."
    status: "implemented"
    note: "The constant-loading semantics are present in OC, but construction-time rather than callback-based."
  initializeState:
    matlab:
      symbol: "initializeState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "264-274"
        note: "Seeds maximal formed particles from the initialized RNA and monomer pools."
      note: "MATLAB performs a runtime initialization push into formed ribosomal complexes."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "75-147"
        note: "OC has no separate runtime initializeState method; fixture loading happens during construction."
      note: "Initialization is collapsed into construction-time fixture loading in OC."
    status: "not_implemented"
    note: "The OC port relies on fixture contents for initialized state, so there is no dedicated runtime initializeState method."
  calcResourceRequirements_LifeCycle:
    matlab:
      symbol: "calcResourceRequirements_LifeCycle"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "231-255"
        note: "Lifecycle biomass-production and enzyme-expression demand block."
      note: "MATLAB-only lifecycle demand helper; not part of the per-tick assembly loop."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "75-383"
        note: "No dedicated OC lifecycle resource-requirements method exists for this process."
      supporting:
        - path: "opencell/vivarium/karr_request_calculators.py"
          lines: "163-226"
          note: "Current OC demand is split into RequestCalculatorRibAsm.next_update."
      note: "OC has no direct lifecycle analogue for the allocator-facing biomass/expression request block."
    status: "not_implemented"
    note: "Lifecycle resource demand is present in MATLAB but not exposed as a separate OC method."
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "277-298"
        note: "Allocator-facing request block for GTP and water."
      note: "The MATLAB request block is explicit in the process class and feeds the global allocator pass."
    oc:
      symbol: "RequestCalculatorRibAsm.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "163-226"
        note: "Dedicated request step that computes GTP/H2O demand from the current subunit state."
      supporting:
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "273-287"
          note: "Formable-particle estimator used by the request step."
      note: "OC keeps the same allocator-facing request semantics but routes them through a separate request-calculator step; the estimator reads
        current RNA, monomer, and enzyme state, then multiplies formable particles by per-particle GTPase counts."
    status: "implemented"
    note: "The request path is allocation-backed on both sides; OC splits the calculation out of the process class and uses per-particle hydrolysis
      counts in the request calculator."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "301-340"
        note: "Randomized two-particle greedy assembly loop with immediate state writeback."
      note: "Helper `getGtpPerComplex` is part of the same behavior."
    oc:
      symbol: "KarrRibosomeAssemblyProcess.next_update"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "334-383"
        note: "Current per-tick update path."
      supporting:
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "239-271"
          note: "Binary enzyme gate and per-particle resource limits."
        - path: "opencell/vivarium/karr_ribosome_assembly.py"
          lines: "289-332"
          note: "Delta builder for substrates, RNA, protein, and complexes."
      note: "OC preserves the randomized order and sequential depletion behavior, and its catalytic-enzyme gate matches the MATLAB presence check."
    status: "implemented"
    note: "The current OC process reads `substrates_allocated` and matches the MATLAB per-particle update shape except for the early-return divergence
      captured below."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
        lines: "73-370"
        note: "No process-local flux-bounds method appears in the class body."
      note: "RibosomeAssembly does not define a flux-bounds method in the source we read."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_ribosome_assembly.py"
        lines: "75-383"
        note: "No OC flux-bounds analogue exists for this process."
      note: "There is no current OC flux-bounds implementation to bind."
    status: "not_implemented"
    note: "This slot is present because the schema requires it, not because RibosomeAssembly is a flux-bounds process."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both source trees use allocator-gated GTP/H2O request semantics."
  request_formula:
    matlab: "result(GTP) = result(H2O) = getGtpPerComplex(2) * all(enzymes_30S) * (1 + min(RNAs_30S, monomers_30S)) + getGtpPerComplex(2) * all(enzymes_50S)
      * (1 + min(RNAs_50S, monomers_50S))"
    oc: "request(GTP) = request(H2O) = sum_{particle in {30S,50S}} formable_particle_count[particle] * n_gtpases_per_particle[particle]"
    note: "Symbolic and grep-friendly; the OC request step preserves the same demand shape but routes through RequestCalculatorRibAsm and per-particle
      hydrolysis counts."
  requests:
    - wid: "GTP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical allocator request substrate."
    - wid: "H2O"
      compartment: "cytosol"
      source: "both"
      note: "Canonical allocator request substrate."
  bypasses:
    - wid: "MG_329_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MG_387_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MG_143_MONOMER"
      compartment: "cytosol"
      source: "both"
      note: "Direct catalytic-enzyme presence check; not allocator-mediated."
    - wid: "MGrrnA16S"
      compartment: "cytosol"
      source: "both"
      note: "Direct RNA pool read/subtraction in the update path."
    - wid: "RIBOSOME_30S"
      compartment: "cytosol"
      source: "both"
      note: "Direct complex count increment in the update path."
consume_stoichiometry:
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "-n_form * n_gtpases_per_particle[particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-338"
      note: "GTP is consumed together with the other hydrolysis substrates."
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "363-372"
      note: "Local allocation is decremented in-step before the next particle is considered."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-n_form * n_gtpases_per_particle[particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-338"
      note: "Water is consumed in lockstep with GTP."
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "363-372"
      note: "Water allocation is decremented in the same local loop."
  - wid: "MGrrnA16S"
    compartment: "cytosol"
    formula_or_constant: "-n_form * proteinComplexRNAComposition[ridx, particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-336"
      note: "RNA subunit subtraction for the 30S path."
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "374-381"
      note: "RNA pool is decremented in-place after a successful particle formation."
  - wid: "MGrrnA23S"
    compartment: "cytosol"
    formula_or_constant: "-n_form * proteinComplexRNAComposition[ridx, particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-336"
      note: "RNA subunit subtraction for the 50S path."
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "374-381"
      note: "RNA pool is decremented in-place after a successful particle formation."
  - wid: "MG_417_MONOMER"
    compartment: "cytosol"
    formula_or_constant: "-n_form * proteinComplexMonomerComposition[midx, particle]"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/RibosomeAssembly.m"
      lines: "323-336"
      note: "Ribosomal protein subtraction from the monomer pool."
    oc_anchor:
      path: "opencell/vivarium/karr_ribosome_assembly.py"
      lines: "378-381"
      note: "Protein pool is decremented in-place after a successful particle formation."
produce_stoichiometry:
