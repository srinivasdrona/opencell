      lines: "908-914"
      note: "Monomer hydrolysis releases amino acids."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_protein_decay_light.py"
      lines: "209-305"
      note: "Amino-acid release is on a latent helper path gated by `_latent_enabled`; constructor shape checks disable this path by default (CODE_DEVIATES)."
      symbol: ProteinDecayLightProcess.__init__
    note: "MATLAB emits this amino-acid product; OC default runtime does not actively fabricate it."
    kind: per_reaction
  - wid: "MET"
