deviations:
  lp_bounds_source:
    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinDecay.m"
      lines: "1-938"
      note: "ProteinDecay has no calcFluxBounds symbol in the MATLAB file."
    oc_anchor:
      path: "opencell/vivarium/karr_protein_decay_light.py"
      lines: "97-591"
      note: "The light port has no flux-bound method either."
  shared_pool_projection_merges_compartments: true
  known_deviations:
    - "OC is ProteinDecayLightProcess, a complex-decay-only subset of MATLAB ProteinDecay; misfold/refold, aborted-polypeptide decay, and full monomer decay are not implemented."
    - "The OC process never reads `substrates_allocated`; it reads `states['substrates']` directly and emits direct substrate deltas in `next_update`."
    - "The OC allocator alias maps `protein_decay_light` to `karr_protein_decay_light`, so the request key differs from the process slug."
