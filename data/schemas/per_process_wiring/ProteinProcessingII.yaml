allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both the MATLAB process and the OC port treat ProteinProcessingII as allocator-backed."
  request_formula:
    matlab: >-
      result(H2O) = min(ceil(enzymes(signalPeptidase) * lipoproteinSignalPeptidaseSpecificRate * stepSizeSec),
      sum(unprocessedMonomers([lipoproteinMonomerIndexs; secretedMonomerIndexs])));
      result(PG160) = min(ceil(enzymes(diacylglycerylTransferase) * lipoproteinDiacylglycerylTransferaseSpecificRate * stepSizeSec),
      sum(unprocessedMonomers(lipoproteinMonomerIndexs)));
      other substrate entries remain zero.
    oc: >-
      pp2_req = {wid: 0.0 for wid in substrate_wids};
      pp2_req.update(_request_from_available(substrate_state, _pp2_consumed, active=pp2_active));
      _pp2_consumed is derived from reaction_stoich and currently resolves to H2O and PG160.
    note: "MATLAB caps demand by enzyme rate and monomer availability; OC currently requests the available consumed substrates from the shared substrate pool."
  requests:
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Water budget for the signal-peptidase cleavage branch."
    - wid: "PG160"
      compartment: "membrane"
      source: "karr"
      note: "Membrane PG160 budget for the diacylglyceryl transferase branch."
  bypasses:
    - wid: "SNGLYP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct byproduct writeback from the transferase branch."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct byproduct writeback from the transferase branch."
    - wid: "diacylglycerolCys"
      compartment: "cytosol"
      source: "deviation"
      note: "Named in the source chemistry comment, but not emitted by either implementation."
