allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Karr declares resource requirements via calcResourceRequirements_Current; OC current reads substrates_allocated in next_update, while the separate request step writes the allocation demand."
  request_formula:
    matlab: "max(0, -this.reactionStoichiometryMatrix) * min(this.reactionModificationMatrix * (this.freeRNAs + this.aminoacylatedRNAs + 1), this.reactionCatalysisMatrix * this.enzymes(1:numel(this.speciesIndexs_enzymes)) * this.stepSizeSec)"
    oc: "if free_total > 0: request each consumed substrate from states['substrates']; ATP request = avail * 25.0; otherwise zero vector"
    note: "MATLAB computes a per-reaction demand cap, then projects it to substrate counts; OC uses an availability-based request shim."
  requests:
    - wid: "ATP"
      compartment: cytosol
      source: both
      note: "Shared request surface; ATP is always part of the allocation demand set."
    - wid: "ALA"
      compartment: cytosol
      source: both
      note: "Amino-acid donor request from the allocator-facing pool."
    - wid: "GLN"
      compartment: cytosol
      source: both
      note: "Transfer-reaction donor request from the allocator-facing pool."
    - wid: "H2O"
      compartment: cytosol
      source: both
      note: "Water is requested because the greedy solver consumes it in the transfer branch."
    - wid: "FTHF10"
      compartment: cytosol
      source: both
      note: "Formyltransfer branch request."
  bypasses: []
consume_stoichiometry:
  - wid: "ATP"
    compartment: cytosol
    formula_or_constant: "this.reactionStoichiometryMatrix(this.substrateIndexs_atp, :) * this.reactionModificationMatrix * reactionFluxes"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
      lines: "457-459"
      note: "Net substrate update row; ATP row is negative for the charging reactions and can be -2 on the transfer branch."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_trna_aminoacylation.py"
      lines: "267-282"
      note: "Reaction events are projected back to substrate deltas in next_update."
      symbol: KarrTRNAAminoacylationProcess.next_update
    kind: per_flux
  - wid: "ALA"
    compartment: cytosol
    formula_or_constant: "this.reactionStoichiometryMatrix(this.substrateIndexs_aminoAcids, :) * this.reactionModificationMatrix * reactionFluxes"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
      lines: "457-459"
      note: "Ala is one row inside the amino-acid donor block."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_trna_aminoacylation.py"
      lines: "267-282"
      note: "Same row-level projection from reaction events to substrate deltas."
      symbol: KarrTRNAAminoacylationProcess.next_update
    kind: per_flux
  - wid: "GLN"
    compartment: cytosol
    formula_or_constant: "this.reactionStoichiometryMatrix(this.substrateIndexs_glutamine, :) * this.reactionModificationMatrix * reactionFluxes"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
      lines: "266-270"
      note: "Transfer-reaction special case remaps the glutamine donor row."
      symbol: tRNAAminoacylation
    oc_anchor:
      path: "opencell/vivarium/karr_trna_aminoacylation.py"
      lines: "267-282"
      note: "Net substrate delta is still computed from the same event projection."
      symbol: KarrTRNAAminoacylationProcess.next_update
    kind: per_flux
  - wid: "H2O"
    compartment: cytosol
    formula_or_constant: "this.reactionStoichiometryMatrix(this.substrateIndexs_water, :) * this.reactionModificationMatrix * reactionFluxes"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
      lines: "403-417"
      note: "Water is excluded from the limiting search and then consumed on the transfer branch."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_trna_aminoacylation.py"
      lines: "371-391"
      note: "Water is masked from limit calculations before the event projection."
      symbol: KarrTRNAAminoacylationProcess._compute_rna_fluxes
    kind: per_flux
  - wid: "FTHF10"
