    oc_anchor:
      path: "opencell/vivarium/karr_trna_aminoacylation.py"
      lines: "267-282"
      note: "Same byproduct projection."
compartment_routing:
  - wid: "ATP"
    consume_compartment: cytosol
    produce_compartment: null
    mismatch: false
    note: "Allocator demand and consume-side update are both cytosolic."
  - wid: "ALA"
    consume_compartment: cytosol
    produce_compartment: null
    mismatch: false
    note: "Amino-acid donor pool lives in the cytosol."
  - wid: "GLN"
    consume_compartment: cytosol
    produce_compartment: null
    mismatch: false
    note: "Transfer donor pool lives in the cytosol."
  - wid: "H2O"
    consume_compartment: cytosol
    produce_compartment: null
    mismatch: false
    note: "Water is consumed from the cytosolic substrate pool."
  - wid: "FTHF10"
    consume_compartment: cytosol
    produce_compartment: null
    mismatch: false
    note: "Formyl donor is cytosolic."
  - wid: "ADP"
    consume_compartment: null
    produce_compartment: cytosol
    mismatch: false
    note: "Byproduct is released back into the cytosolic pool."
  - wid: "AMP"
    consume_compartment: null
    produce_compartment: cytosol
    mismatch: false
    note: "Byproduct is released back into the cytosolic pool."
  - wid: "PPI"
    consume_compartment: null
    produce_compartment: cytosol
    mismatch: false
    note: "Pyrophosphate is released back into the cytosolic pool."
  - wid: "PI"
    consume_compartment: null
    produce_compartment: cytosol
    mismatch: false
    note: "Phosphate byproduct stays cytosolic."
  - wid: "THF"
    consume_compartment: null
    produce_compartment: cytosol
    mismatch: false
    note: "THF byproduct stays cytosolic."
unit_conversion_chain:
  source_units: "count-based substrate availability and enzyme capacity"
  target_units: "per-tick substrate request and delta counts"
  steps:
    - from_units: "substrate and RNA availability counts"
      to_units: "per-tick request counts"
      operation: "max(0, -S) * min(reactionModificationMatrix * (freeRNAs + aminoacylatedRNAs + 1), reactionCatalysisMatrix * enzymes * stepSizeSec)"
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
        lines: "380-384"
        note: "Allocator request formula; no molar or mass conversion is involved."
      constants:
        - "stepSizeSec"
    - from_units: "per-tick request counts"
      to_units: "per-tick substrate delta counts"
      operation: "substrates += reactionStoichiometryMatrix * reactionModificationMatrix * reactionFluxes"
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/tRNAAminoacylation.m"
        lines: "457-459"
        note: "Net substrate update after reaction events are chosen."
      constants: []
  note: "This process is already discrete-count based; unlike Metabolism, there is no mmol/gDW/hr or other mass-based unit ladder."
