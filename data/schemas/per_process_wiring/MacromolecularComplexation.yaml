schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "MacromolecularComplexation"
  matlab_class: "MacromolecularComplexation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/MacromolecularComplexation.m"
  oc_class: "MacromolecularComplexationProcess"
  oc_file: "opencell/vivarium/karr_macromolecular_complexation.py"
  whole_cell_model_id: "Process_MacromolecularComplexation"
  functional_area: "protein-synthesis-and-maturation"
  state_shape_role: "state-shape catalog row; wiring row adds integration semantics"
  notes: "Raw MATLAB source is absent in this checkout; anchors use verbatim design excerpts and the OC port."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "docs/design/a33_turn3_d2_real.md"
        lines: "85-87"
        note: "Design note cites MacromolecularComplexation.m:285-287; D.2 requests zero metabolites."
      note: "Zero-demand allocator hook."
    oc:
      symbol: "RequestCalculatorD2.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "53-89"
        note: "Writes zero requests for karr_macromolecular_complexation."
      supporting:
        - path: "opencell/vivarium/karr_allocation_step.py"
          lines: "153-280"
          note: "Reads requests and writes substrates_allocated."
      note: "Separate Step rather than a direct method port."
    status: "implemented"
    note: "Behavior matches the Karr zero-request path; OC wires it through a request-calculator Step."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "docs/design/a3_step3_joint_design_v1.md"
        lines: "89-117"
        note: "Verbatim excerpt of the main complexation tick update."
    oc:
      symbol: "MacromolecularComplexationProcess.next_update"
      source:
        path: "opencell/vivarium/karr_macromolecular_complexation.py"
        lines: "206-258"
        note: "Reads substrates_allocated, clusters by disconnected network, and emits substrate + complex deltas."
      supporting:
        - path: "opencell/vivarium/karr_macromolecular_complexation.py"
          lines: "80-140"
          note: "Closed-form bounds and competitive MC helper."
        - path: "opencell/vivarium/karr_allocation_step.py"
          lines: "153-280"
          note: "Allocated pool comes from the shared allocator step."
    status: "partial"
    note: "Core control flow is ported, but the competitive helper adds Poisson multiplicity and a cluster-1 fallback."
  buildProteinComplexs_bounds:
    matlab:
      symbol: "buildProteinComplexs_bounds"
      source:
        path: "docs/design/a3_step3_joint_design_v1.md"
        lines: "121-129"
        note: "Closed-form per-complex upper bound for the no-competition cluster."
    oc:
      symbol: "_closed_form_bounds"
      source:
        path: "opencell/vivarium/karr_macromolecular_complexation.py"
        lines: "80-90"
        note: "Vectorized closed-form upper bound."
    status: "implemented"
    note: "Equivalent deterministic cluster-1 bound."
  buildProteinComplexs_montecarlokinetic:
    matlab:
      symbol: "buildProteinComplexs_montecarlokinetic"
      source:
        path: "docs/design/a3_step3_joint_design_v1.md"
        lines: "133-171"
        note: "Competitive cluster helper plus collision-theory rate formula."
    oc:
      symbol: "_per_cluster_mc"
      source:
        path: "opencell/vivarium/karr_macromolecular_complexation.py"
        lines: "93-140"
        note: "Competitive helper with extra Poisson multiplicity."
    status: "partial"
    note: "Network partitioning matches, but OC is not one-copy-per-iteration."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "docs/design/a3_step3_joint_design_v1.md"
        lines: "232-239"
        note: "No process-local flux-bound method; allocator sequencing happens in Simulation.evolveState."
    oc:
      symbol: "NOT_IMPLEMENTED"
      source:
        path: "opencell/vivarium/karr_macromolecular_complexation.py"
        lines: "143-258"
        note: "OC process exposes next_update only."
    status: "not_implemented"
    note: "Not applicable to this process."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Karr allocates before evolveState; OC reads from substrates_allocated. The request values are still zero."
  request_formula:
    matlab: "zeros(size(this.substrates))"
    oc: "dict(self._zero_requests)"
    note: "Zero-demand request surface; allocator wiring remains active."
  requests:
    - wid: "MG_003_MONOMER"
      compartment: "cytosol"
      source: "karr"
      note: "Representative substrate-universe leaf routed through substrates_allocated."
    - wid: "MG_005_MONOMER"
      compartment: "cytosol"
      source: "karr"
      note: "Representative substrate-universe leaf routed through substrates_allocated."
    - wid: "MG_014_MONOMER"
      compartment: "cytosol"
      source: "karr"
      note: "Representative substrate-universe leaf routed through substrates_allocated."
    - wid: "MG_029_MONOMER"
      compartment: "cytosol"
      source: "karr"
      note: "Representative substrate-universe leaf routed through substrates_allocated."
  bypasses:
    - wid: "DNA_GYRASE"
      compartment: "cytosol"
      source: "oc"
      note: "Direct complex.counts write; not allocator-mediated."
    - wid: "DNA_POLYMERASE_CORE"
      compartment: "cytosol"
      source: "oc"
      note: "Direct complex.counts write; not allocator-mediated."
    - wid: "MG_005_DIMER"
      compartment: "cytosol"
      source: "oc"
      note: "Direct complex.counts write; not allocator-mediated."
    - wid: "RNA_POLYMERASE"
      compartment: "cytosol"
      source: "oc"
      note: "Direct complex.counts write; not allocator-mediated."
consume_stoichiometry:
  - wid: "MG_003_MONOMER"
    compartment: "cytosol"
    formula_or_constant: "-sum_c complexComposition[MG_003_MONOMER, c] * newComplexs[c]"
    matlab_anchor:
      path: "docs/design/a3_step3_joint_design_v1.md"
      lines: "114-115"
      note: "Mass-balance substrate subtraction."
    oc_anchor:
      path: "opencell/vivarium/karr_macromolecular_complexation.py"
      lines: "244-249"
      note: "Delta substrate emission from matrix multiply."
    note: "Representative cytosolic monomer consumption."
