unit_conversion_chain:
  source_units: "allocated substrate counts (molecules)"
  target_units: "molecules/tick"
  steps:
    - from_units: "molecules"
      to_units: "integer molecules"
      operation: "floor then clip to nonnegative integers"
      anchor:
        path: "opencell/vivarium/karr_macromolecular_complexation.py"
        lines: "210-214"
        note: "Allocated pool is normalized to integer counts before assembly."
    - from_units: "integer subunit counts"
      to_units: "per-tick complex/substrate deltas"
      operation: "matrix multiply with complexComposition; no time scaling"
      anchor:
        path: "docs/design/a3_step3_joint_design_v1.md"
        lines: "114-115"
        note: "Mass balance uses one matrix multiply."
dependencies:
  produces_inputs_for:
    - "ProteinDecay"
  consumes_outputs_of:
    - "Transcription"
    - "Translation"
    - "tRNAAminoacylation"
    - "RNAProcessing"
    - "RNAModification"
    - "Metabolism"
  note: "Removed RibosomeAssembly, Translation, Transcription, ProteinTranslocation from produces_inputs_for because the downstream rows do not expose a direct stoichiometric handoff; added Metabolism to consumes_outputs_of because this row directly draws from the shared metabolite pool."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "No D.2-specific ordering exception was found. The canonical hard order in the chassis is tRNAAminoacylation before Translation."
