    karr: "allocation"
    oc_current: "allocation"
    matlab_anchor:
      path: "docs/design/a33_turn3_d2_real.md"
      lines: "85-87"
      note: "Zero-request allocator wiring note."
    oc_anchor:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "53-89"
      note: "Current OC zero-request step."
  shared_pool_projection_merges_compartments: false
  known_deviations:
    - "OC's _per_cluster_mc samples a Poisson multiplicity and can form multiple complexes per iteration; Karr forms exactly one copy per Monte Carlo iteration."
