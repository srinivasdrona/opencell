stoichiometry_oracle:
  class: "matrix"
  record_path: "data/karr_method_inventory/karr_stoichiometry/Metabolism.json"
  substrate_count: 792
  note: "Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries."
compartment_routing:
  - wid: "GLC"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "External nutrient uptake stays extracellular in the consume surface."
  - wid: "O2"
    consume_compartment: "extracellular"
    produce_compartment:
    mismatch: false
    note: "External nutrient uptake stays extracellular in the consume surface."
  - wid: "ATP"
