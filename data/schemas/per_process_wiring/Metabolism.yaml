integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        symbol: "calcResourceRequirements_Current"
        lines: "1188-1196"
        note: "Per-tick request matrix for allocator share input."
      note: "Uses allocator-facing requirements block."
    oc:
      symbol: "RequestCalculatorMetabolism.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        symbol: "RequestCalculatorMetabolism.next_update"
        lines: "806-806"
        note: "Current OC request calculator."
      supporting:
        - path: "opencell/vivarium/karr_allocation_step.py"
          lines: "210-280"
          symbol: "KarrAllocationStep.next_update"
          note: "Allocator grant step that consumes requests."
    status: "implemented"
    note: "The OC request calculator exists even when runtime allocator use is configurable."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        symbol: "evolveState"
        lines: "1200-1258"
        note: "Five writeback steps plus clip."
    oc:
      symbol: "KarrMetabolismProcess.next_update"
      source:
        path: "opencell/vivarium/karr_metabolism.py"
        symbol: "KarrMetabolismProcess.next_update"
        lines: "386-386"
        note: "Runtime entry dispatches Metabolism updates."
      supporting:
        - path: "opencell/vivarium/karr_metabolism.py"
          lines: "465-606"
          symbol: "KarrMetabolismProcess._dynamic_update"
          note: "Current OC per-tick dynamic metabolism update."
        - path: "opencell/m1/karr_metabolism_writeback.py"
          lines: "90-159"
          symbol: "apply_karr_substrate_writeback"
          note: "Five-step substrate writeback + clip."
        - path: "opencell/m1/karr_metabolism_writeback.py"
          lines: "164-179"
          symbol: "project_to_flat_per_wid"
          note: "Flat per-WID projection that merges compartments."
    status: "implemented"
    note: "Implemented with the shared-pool projection deviation surfaced below."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        symbol: "calcFluxBounds"
        lines: "1318-1380"
        note: "Karr LP bound construction."
    oc:
      symbol: "compute_bounds"
      source:
        path: "opencell/m1/calc_flux_bounds.py"
        symbol: "compute_bounds"
        lines: "108-108"
        note: "Current OC bound construction."
      supporting:
        - path: "opencell/m1/compartmented.py"
          lines: "42-95"
          symbol: "mmol_per_gdwh_to_molecules_per_s"
          note: "Unit conversion helper used by the compartmented model."
    status: "implemented"
allocator:
  mode:
    karr: "allocation"
    oc_current: "bypass"
    note: "Karr's row requests allocator share input; current OC runtime can bypass allocator mediation."
  request_formula:
    matlab: "allocations = max(0, fix(requirements .* tmp(:, ones(nProcesses, 1))))"
    oc: "if use_allocator_budget then max(0, _last_allocation_demand[sid]) else zero request; ATP floor only when karr_parity_mode=false"
    note: "Formula text is symbolic and grep-friendly, not executable."
  requests:
    - wid: "GLC"
      compartment: "extracellular"
      source: "karr"
      note: "Canonical nutrient-share request example from the external-exchange surface."
    - wid: "O2"
      compartment: "extracellular"
      source: "karr"
      note: "Canonical respiration-share request example from the external-exchange surface."
  bypasses:
    - wid: "ATP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / maintenance demand, not allocator-mediated."
    - wid: "H2O"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis side effect."
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
