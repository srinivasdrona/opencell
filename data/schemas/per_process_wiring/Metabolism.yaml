schema_version: "1.0"
process:
  name: "Metabolism"
  matlab_class: "Metabolism"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
  oc_class: "KarrMetabolismProcess"
  oc_file: "opencell/vivarium/karr_metabolism.py"
  whole_cell_model_id: "Process_Metabolism"
  functional_area: "transport-and-metabolism"
  state_shape_role: "state-shape catalog row; wiring row adds integration semantics"
  notes: "This row is an example shape, not a full 585-substrate enumeration."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        lines: "1188-1196"
        note: "Per-tick request matrix for allocator share input."
      note: "Uses allocator-facing requirements block."
    oc:
      symbol: "RequestCalculatorMetabolism.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "758-820"
        note: "Current OC request calculator; emits zero unless allocator budget mode is enabled."
      supporting:
        - path: "opencell/vivarium/karr_allocation_step.py"
          lines: "210-280"
          note: "Allocator grant step that consumes requests."
      note: "The request calculator is the grep target for A1 comparison."
    status: "partial"
    note: "The row exposes the OC request path even though current Metabolism runtime can bypass it."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        lines: "1200-1258"
        note: "Five writeback steps plus clip."
    oc:
      symbol: "KarrMetabolismProcess._dynamic_update"
      source:
        path: "opencell/vivarium/karr_metabolism.py"
        lines: "465-606"
        note: "Current OC per-tick metabolism update."
      supporting:
        - path: "opencell/m1/karr_metabolism_writeback.py"
          lines: "90-159"
          note: "Five-step substrate writeback + clip."
        - path: "opencell/m1/karr_metabolism_writeback.py"
          lines: "164-179"
          note: "Flat per-WID projection that merges compartments."
      note: "This is the row's A3b and A4 grep anchor."
    status: "partial"
    note: "Implemented, but the shared-pool projection is a known deviation from Karr's compartment-preserving semantics."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        lines: "1318-1380"
        note: "Karr LP bound construction."
    oc:
      symbol: "compute_bounds"
      source:
        path: "opencell/m1/calc_flux_bounds.py"
        lines: "108-170"
        note: "Current OC bound construction."
      supporting:
        - path: "opencell/m1/compartmented.py"
          lines: "42-95"
          note: "Unit conversion helper used by the compartmented model."
      note: "A3 compares whether the bounds come from allocation or the internal pool."
    status: "implemented"
allocator:
  mode:
    karr: "allocation"
    oc_current: "bypass"
    note: "Karr's row requests allocator share input; current OC runtime can bypass allocator mediation."
  request_formula:
    matlab: "allocations = max(0, fix(requirements .* tmp(:, ones(nProcesses, 1))))"
    oc: "if use_allocator_budget then max(0, _last_allocation_demand[sid]) else zero request; ATP floor only when karr_parity_mode=false"
    note: "Formula text is symbolic and grep-friendly, not executable."
  requests:
    - wid: "GLC"
      compartment: "extracellular"
      source: "karr"
      note: "Canonical nutrient-share request example from the external-exchange surface."
    - wid: "O2"
      compartment: "extracellular"
      source: "karr"
      note: "Canonical respiration-share request example from the external-exchange surface."
  bypasses:
    - wid: "ATP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / maintenance demand, not allocator-mediated."
    - wid: "H2O"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis side effect."
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Direct post-LP writeback / hydrolysis product."
consume_stoichiometry:
  - wid: "GLC"
    compartment: "extracellular"
    formula_or_constant: "stochasticRound(v[external_exchange_GLC] * stepSizeSec)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1213-1215"
      note: "Step 1 nutrient uptake."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "98-109"
      note: "apply_karr_substrate_writeback step 1."
  - wid: "O2"
    compartment: "extracellular"
    formula_or_constant: "stochasticRound(v[external_exchange_O2] * stepSizeSec)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1213-1215"
      note: "Same external-exchange step as GLC."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "98-109"
      note: "apply_karr_substrate_writeback step 1."
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "unaccountedEnergyConsumption * growth_per_s * stepSizeSec"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1228-1231"
      note: "Step 4 ATP hydrolysis branch."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "124-144"
      note: "ATP hydrolysis sign vector and rounding."
produce_stoichiometry:
  - wid: "ADP"
    compartment: "cytosol"
    formula_or_constant: "unaccountedEnergyConsumption * growth_per_s * stepSizeSec"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1228-1231"
      note: "Step 4 hydrolysis product."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "124-144"
      note: "ATP hydrolysis sign vector and rounding."
  - wid: "PI"
    compartment: "cytosol"
    formula_or_constant: "unaccountedEnergyConsumption * growth_per_s * stepSizeSec"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1228-1231"
      note: "Step 4 hydrolysis product."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "124-144"
      note: "ATP hydrolysis sign vector and rounding."
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "unaccountedEnergyConsumption * growth_per_s * stepSizeSec"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1228-1231"
      note: "Step 4 hydrolysis product."
    oc_anchor:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "124-144"
      note: "ATP hydrolysis sign vector and rounding."
compartment_routing:
  - wid: "GLC"
    consume_compartment: "extracellular"
    produce_compartment: null
    mismatch: false
    note: "External nutrient uptake stays extracellular in the consume surface."
  - wid: "O2"
    consume_compartment: "extracellular"
    produce_compartment: null
    mismatch: false
    note: "External nutrient uptake stays extracellular in the consume surface."
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment: null
    mismatch: false
    note: "Maintenance/hydrolysis consumption is cytosolic."
  - wid: "ADP"
    consume_compartment: null
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product is cytosolic."
  - wid: "PI"
    consume_compartment: null
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product is cytosolic."
  - wid: "H"
    consume_compartment: null
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrolysis product is cytosolic."
unit_conversion_chain:
  source_units: "mmol·gDW^-1·hr^-1"
  target_units: "molecules/tick"
  steps:
    - from_units: "mmol·gDW^-1·hr^-1"
      to_units: "molecules·gDW^-1·s^-1"
      operation: "÷secondsPerHour × nAvogadro/1000"
      constants: ["secondsPerHour", "nAvogadro"]
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        lines: "380-410"
        note: "MATLAB unit conversion block."
    - from_units: "molecules·gDW^-1·s^-1"
      to_units: "molecules·s^-1"
      operation: "×cellDry"
      constants: ["cellDry"]
      anchor:
        path: "opencell/m1/compartmented.py"
        lines: "94-95"
        note: "OC conversion helper."
    - from_units: "molecules·s^-1"
      to_units: "molecules/tick"
      operation: "×stepSizeSec"
      constants: ["stepSizeSec"]
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
        lines: "380-410"
        note: "MATLAB applies the step-size factor in the same conversion chain."
dependencies:
  produces_inputs_for:
    - "Transcription"
    - "Translation"
    - "tRNAAminoacylation"
    - "RNAProcessing"
    - "RNAModification"
    - "ProteinProcessingI"
    - "ProteinProcessingII"
    - "ProteinTranslocation"
    - "Replication"
    - "ReplicationInitiation"
    - "RibosomeAssembly"
    - "MacromolecularComplexation"
  consumes_outputs_of:
    - "Transcription"
    - "Translation"
    - "tRNAAminoacylation"
    - "RNAProcessing"
    - "RNAModification"
    - "ProteinProcessingI"
    - "ProteinProcessingII"
    - "ProteinTranslocation"
    - "Replication"
    - "ReplicationInitiation"
    - "RibosomeAssembly"
    - "ChromosomeCondensation"
    - "ChromosomeSegregation"
    - "Cytokinesis"
  note: "These are canonical downstreams and upstream demanders; later rows may expand the list."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "Metabolism has no documented process-order exception of its own; the canonical hard order in `Simulation.evolveState` is tRNAAminoacylation before Translation."
source_anchors:
  matlab_blocks:
    compartment_indexing:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "298-300"
      note: "Karr compartment indices: cytosol=1, extracellular=2, membrane=3."
    resource_req:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1188-1196"
      note: "calcResourceRequirements_Current block."
    evolve_state_step_1:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1213-1215"
      note: "Nutrient uptake."
    evolve_state_step_2:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1218-1220"
      note: "Recycled metabolites."
    evolve_state_step_3:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1223-1225"
      note: "New biomass."
    evolve_state_step_4:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1228-1231"
      note: "Unaccounted energy."
    evolve_state_clip:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1235-1253"
      note: "Metabolite-row clip."
    calc_flux_bounds:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1318-1380"
      note: "LP bound construction."
  oc_blocks:
    process_class:
      path: "opencell/vivarium/karr_metabolism.py"
      lines: "118-179"
      note: "KarrMetabolismProcess definition and init."
    dynamic_update:
      path: "opencell/vivarium/karr_metabolism.py"
      lines: "465-606"
      note: "Current per-tick update path."
    request_calculator:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "758-820"
      note: "Allocator request emission for Metabolism."
    allocator_step:
      path: "opencell/vivarium/karr_allocation_step.py"
      lines: "210-280"
      note: "Allocator grant computation."
    writeback_steps:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "90-159"
      note: "Five-step substrate writeback and clip."
    flat_projection:
      path: "opencell/m1/karr_metabolism_writeback.py"
      lines: "164-179"
      note: "Compartment merge into flat per-WID deltas."
    compute_bounds:
      path: "opencell/m1/calc_flux_bounds.py"
      lines: "108-170"
      note: "Current LP bound construction."
    unit_conversion:
      path: "opencell/m1/compartmented.py"
      lines: "42-95"
      note: "Conversion helper and constants."
provenance:
  fixture_files:
    - "data/karr_fixtures/per_process/Metabolism_flat.mat"
    - "data/karr_fixtures/karr_native_m1.json"
    - "data/karr_fixtures/karr_native_m1.npz"
  kb_version: "karr_native_m1__v2"
  extraction_date_utc: null
  notes: "Example row uses the fixture and OC anchors named in the task prompt; no new re-audit was run."
deviations:
  lp_bounds_source:
    karr: "allocation"
    oc_current: "internal_pool"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Metabolism.m"
      lines: "1318-1380"
      note: "Karr derives LP bounds from allocator-facing resource requirements."
    oc_anchor:
      path: "opencell/m1/calc_flux_bounds.py"
      lines: "108-170"
      note: "Current OC derives LP bounds from the internal pool / dynamic state."
  shared_pool_projection_merges_compartments: true
  known_deviations:
    - "A1: compare the request formula here against `Simulation.evolveState` allocation and `karr_allocation_step.py:232-280`."
    - "A2: compare ordering constraints against `Simulation.evolveState`'s randperm constraint set."
    - "A3: the current OC LP bounds source is `internal_pool`, not Karr's allocation-derived source."
    - "A3b: consumption clipping is grep-able in `opencell/m1/karr_metabolism_writeback.py`."
    - "A4: shared-pool projection merges compartments in `project_to_flat_per_wid`."
  note: "This section exists so the DB row can make known deviations mechanically visible instead of hiding them in prose."
