      lines: "552-602"
      note: "Current OC allocator analogue; Transcription has no flux-bound method."
      symbol: RequestCalculatorTranscription
  shared_pool_projection_merges_compartments: false
  known_deviations:
    - "Current OC allocator requests only ATP/CTP/GTP/UTP; MATLAB calcResourceRequirements_Current also requests water."
    - "Current OC evolveState is a mechanism-based transcription wrapper, not the MATLAB RNAP state-machine implementation."
    - "MATLAB Transcription substrate writeback includes H2O consumption and PPI/H production at termination/polymerization, while current OC transcription wrappers update only NTP substrate deltas."
    - "Legacy KarrTranscriptionProcess bypasses allocator mediation and writes direct substrate deltas when used without the allocator-budget path."
    - "OC bootstrap is split across constructor fixture loads, ports_schema defaults, and composite wiring rather than a single initializeState method."
    - This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
  note: "The deviations list is intentionally explicit so reviewers can grep the current OC surfaces without assuming a 1:1 port."
