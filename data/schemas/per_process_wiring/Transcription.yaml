schema_version: "1.0"
schema_date: '2026-06-29'
process:
  name: "Transcription"
  matlab_class: "Transcription"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
  oc_class: "KarrTranscriptionV3Process"
  oc_file: "opencell/vivarium/karr_transcription_v3.py"
  whole_cell_model_id: "Process_Transcription"
  functional_area: "transcription"
  state_shape_role: "process wiring row; RNAP state machine, allocator requests, and RNA output wiring"
  notes: "MATLAB Transcription is the Karr M1 process. Current OC wiring is split across the allocator-aware v3 wrapper, the legacy analytical wrapper, and the transcription request calculator."
methods:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "609-615"
        note: "Allocator-facing per-tick substrate demand; includes NTPs and water."
      note: "This is the canonical MATLAB allocator request block."
    oc:
      symbol: "RequestCalculatorTranscription.next_update"
      source:
        path: "opencell/vivarium/karr_request_calculators.py"
        lines: "552-602"
        note: "Current OC allocator request calculator for mechanism-driven transcription."
      supporting:
        - path: "opencell/vivarium/karr_composite.py"
          lines: "778-789"
          note: "Composite wiring that instantiates the transcription request calculator."
      note: "Current OC requests only ATP/CTP/GTP/UTP; water is not part of the request calculator today."
    status: "partial"
    note: "Implemented in OC, but the request surface is narrower than MATLAB because water is omitted from the current allocator path."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "618-973"
        note: "Full RNA-polymerase state machine, elongation, termination, and substrate writeback."
      note: "This is the canonical per-tick process update."
    oc:
      symbol: "KarrTranscriptionV3Process.next_update"
      source:
        path: "opencell/vivarium/karr_transcription_v3.py"
        lines: "170-223"
        note: "Current OC mechanism-based per-tick transcription update."
      supporting:
        - path: "opencell/vivarium/karr_transcription.py"
          lines: "628-674"
          note: "Legacy analytical transcription wrapper; direct substrate-delta path."
        - path: "opencell/m2/transcription_v2.py"
          lines: "1-95"
          note: "Mechanism-rate derivation used by the v3 wrapper."
      note: "OC preserves the transcription contract qualitatively, but not the MATLAB state-machine details."
    status: "partial"
    note: "Implemented via a mechanism-based approximation in OC, not a bit-identical port of the MATLAB RNAP state machine."
  initializeState:
    matlab:
      symbol: "initializeState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "433-605"
        note: "RNAP state initialization, binding, and mature-RNA seeding."
      note: "Major bootstrap method for the MATLAB process."
    oc:
      symbol: "build_karr_composite / ports_schema bootstrap"
      source:
        path: "opencell/vivarium/karr_composite.py"
        lines: "778-834"
        note: "Composite wiring and initial state seeding for the transcription process."
      supporting:
        - path: "opencell/vivarium/karr_transcription_v3.py"
          lines: "91-132"
          note: "Ports schema defaults for RNA counts, RNAP complex counts, and optional allocator budget inputs."
        - path: "opencell/vivarium/karr_transcription.py"
          lines: "538-574"
          note: "Legacy wrapper ports schema for RNA and substrate defaults."
      note: "OC has no dedicated initializeState method; bootstrap is split across process schemas and the composite builder."
    status: "partial"
    note: "Bootstrap is distributed across OC wiring code rather than concentrated in one method."
  computeRNAPolymeraseTUBindingProbabilities:
    matlab:
      symbol: "computeRNAPolymeraseTUBindingProbabilities"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "978-1002"
        note: "Transcription-unit binding probability construction with DnaA-box protection."
      note: "Major helper for transcription-unit selection."
    oc:
      symbol: "predict_tu_synthesis_per_s"
      source:
        path: "opencell/m2/transcription_v2.py"
        lines: "76-95"
        note: "Mechanism-rate helper that replaces the MATLAB TU binding-probability machinery."
      supporting:
        - path: "opencell/vivarium/karr_transcription_v3.py"
          lines: "179-205"
          note: "Uses the mechanism-rate helper and then applies the current transcription scaling."
      note: "OC does not reproduce the MATLAB TU-binding helper directly; it replaces it with a mechanism-rate oracle."
    status: "partial"
    note: "The OC implementation uses a different derivation path rather than a direct helper port."
  calcFluxBounds:
    matlab:
      symbol: "calcFluxBounds"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "1-35"
        note: "Transcription.m does not define a flux-bounds method; this anchor marks the class header / absence of a bound-construction block."
      note: "No calcFluxBounds method exists on the MATLAB process."
    oc:
      symbol: "n/a"
      source:
        path: "opencell/vivarium/karr_transcription_v3.py"
        lines: "170-223"
        note: "No flux-bounds method in the current OC transcription ports; allocator and per-tick update are separate."
      supporting:
        - path: "opencell/vivarium/karr_request_calculators.py"
          lines: "552-602"
          note: "Allocator request analogue, not a flux-bounds method."
      note: "Transcription does not have a flux-bounds surface in either implementation."
    status: "not_implemented"
    note: "This row records the absence explicitly rather than inventing a flux-bounds analog."
allocator:
  mode:
    karr: "allocation"
    oc_current: "mixed"
    note: "MATLAB uses allocator requests. OC has an allocation-aware v3 path plus a legacy direct-substrate wrapper, so the current surface is mixed rather than purely one mode."
  request_formula:
    matlab: "result(ATP, CTP, GTP, UTP) = 2 * sum(this.metabolite.nmpComposition, 2) * this.rnaPolymerases.nActive * this.rnaPolymeraseElongationRate; result(H2O) = this.rnaPolymerases.nActive"
    oc: "if use_allocator_budget: per_ntp_need = total_nt / 4 * dt; requests[self.name][ATP/CTP/GTP/UTP] = per_ntp_need; else zero requests; water is not requested in the current OC calculator"
    note: "MATLAB requests both NTPs and water; current OC allocator requests only the NTP quartet."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical nucleotide request; requested through the allocator in the current OC path."
    - wid: "CTP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical nucleotide request; requested through the allocator in the current OC path."
    - wid: "GTP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical nucleotide request; requested through the allocator in the current OC path."
    - wid: "UTP"
      compartment: "cytosol"
      source: "both"
      note: "Canonical nucleotide request; requested through the allocator in the current OC path."
  bypasses:
    - wid: "ATP"
      compartment: "cytosol"
      source: "oc"
      note: "Legacy analytical wrapper writes direct substrate deltas instead of allocator-mediated budgets."
    - wid: "CTP"
      compartment: "cytosol"
      source: "oc"
      note: "Legacy analytical wrapper writes direct substrate deltas instead of allocator-mediated budgets."
    - wid: "GTP"
      compartment: "cytosol"
      source: "oc"
      note: "Legacy analytical wrapper writes direct substrate deltas instead of allocator-mediated budgets."
    - wid: "UTP"
      compartment: "cytosol"
      source: "oc"
      note: "Legacy analytical wrapper writes direct substrate deltas instead of allocator-mediated budgets."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(ATP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes ATP as one of the four NTPs."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
  - wid: "CTP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(CTP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes CTP as one of the four NTPs."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(GTP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes GTP as one of the four NTPs."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
  - wid: "UTP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(UTP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes UTP as one of the four NTPs."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-nTrmPols"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "922-951"
      note: "Termination consumes water one-for-one with terminated polymerases."
    oc_anchor:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "552-602"
      note: "Current OC request calculator does not request water; this is the main request-surface divergence."
produce_stoichiometry:
  - wid: "PPI"
    compartment: "cytosol"
    formula_or_constant: "+sum(usedNTPs)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "961-965"
      note: "Diphosphate released by polymerization."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "658-673"
      note: "Legacy wrapper emits the NTP substrate delta that corresponds to polymerization consumption."
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "+nTrmPols"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "922-951"
      note: "Termination produces hydrogen one-for-one with terminated polymerases."
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "658-673"
      note: "Legacy wrapper does not model water/hydrogen explicitly; this is a MATLAB-only product in the current port."
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "CTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "UTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "Water is consumed only during termination and stays cytosolic."
  - wid: "PPI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Diphosphate is produced in the cytosolic substrate pool."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: false
    note: "Hydrogen is produced in the cytosolic substrate pool."
unit_conversion_chain:
  source_units: "active RNAP-weighted nucleotide incorporations per second"
  target_units: "substrate molecules/tick"
  steps:
    - from_units: "active RNAP-weighted nucleotide incorporations per second"
      to_units: "substrate molecules per simulation tick"
      operation: "×stepSizeSec, with stepSizeSec=1 in the Transcription fixture and simulation loop"
      constants: ["stepSizeSec"]
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/@Simulation/evolveState.m"
        lines: "19-37"
        note: "Global tick step and allocator allocation happen before process evolution."
    - from_units: "substrate molecules per simulation tick"
      to_units: "per-substrate deltas"
      operation: "polymerize(...) -> usedNTPs, then write substrate deltas and release products"
      constants: ["usedNTPs"]
      anchor:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
        lines: "895-965"
        note: "MATLAB polymerization and product writeback."
  note: "Transcription is already in counts-per-tick space once the 1 s simulation tick is applied; there is no mmol/gDW/hr conversion chain here."
dependencies:
  produces_inputs_for:
    - "RNAProcessing"
    - "Translation"
  consumes_outputs_of:
    - "Metabolism"
  note: "Removed RNAModification, tRNAAminoacylation from produces_inputs_for because the consumer rows do not expose a direct stoichiometric handoff; the coupling is state-only or shared-pool mediated."
ordering_constraints:
  hard_before: []
  hard_after: []
  soft_before: []
  soft_after: []
  note: "Simulation.evolveState has the canonical hard order constraint tRNAAminoacylation < Translation; Transcription itself has no documented special ordering rule."
