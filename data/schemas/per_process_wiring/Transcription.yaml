      symbol: KarrTranscriptionProcess.next_update
    kind: expression
  - wid: "GTP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(GTP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes GTP as one of the four NTPs."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
      symbol: KarrTranscriptionProcess.next_update
    kind: expression
  - wid: "UTP"
    compartment: "cytosol"
    formula_or_constant: "-usedNTPs(UTP)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "895-897"
      note: "polymerize(...) consumes UTP as one of the four NTPs."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "659-673"
      note: "Legacy wrapper emits direct NTP substrate deltas."
      symbol: KarrTranscriptionProcess.next_update
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "-nTrmPols"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "922-951"
      note: "Termination consumes water one-for-one with terminated polymerases."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "552-602"
      note: "Current OC request calculator does not request water; this is the main request-surface divergence."
      symbol: RequestCalculatorTranscription
    kind: expression
produce_stoichiometry:
  - wid: "PPI"
    compartment: "cytosol"
    formula_or_constant: "+sum(usedNTPs)"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "961-965"
      note: "Diphosphate released by polymerization."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "658-673"
      note: "Legacy wrapper emits only NTP substrate deltas and does not emit PPI."
      symbol: KarrTranscriptionProcess.next_update
    note: "MATLAB emits PPI from polymerization; current OC transcription wrappers do not emit PPI. See known_deviations."
    kind: expression
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "+nTrmPols"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "922-951"
      note: "Termination produces hydrogen one-for-one with terminated polymerases."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_transcription.py"
      lines: "658-673"
      note: "Legacy wrapper does not model water/hydrogen explicitly; this is a MATLAB-only product in the current port."
      symbol: KarrTranscriptionProcess.next_update
    kind: expression
stoichiometry_oracle:
  class: inline
  record_path: data/karr_method_inventory/karr_stoichiometry/Transcription.json
  substrate_count: 7
  note: Exhaustive per-tick substrate set lives in the HB1 oracle; this row's consume/produce arrays carry integration-relevant hand-curated entries.
compartment_routing:
  - wid: "ATP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "CTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "GTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "UTP"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: false
    note: "NTP consumption is cytosolic in both MATLAB and the current OC substrate port."
  - wid: "H2O"
    consume_compartment: "cytosol"
    produce_compartment:
    mismatch: true
    note: "MATLAB consumes cytosolic H2O during termination; current OC transcription wrappers do not consume H2O. See known_deviations."
  - wid: "PPI"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB produces cytosolic PPI; current OC transcription wrappers do not emit PPI. See known_deviations."
  - wid: "H"
    consume_compartment:
    produce_compartment: "cytosol"
    mismatch: true
    note: "MATLAB produces cytosolic H during termination; current OC transcription wrappers do not emit H. See known_deviations."
