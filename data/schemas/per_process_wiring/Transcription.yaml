deviations:
  lp_bounds_source:
    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/Transcription.m"
      lines: "609-615"
      note: "Allocator request surface, not an LP-bound surface."
