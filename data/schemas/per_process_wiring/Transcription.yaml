        lines: "170-223"
        note: Process works directly in per-tick integer counts; no unit conversion needed.
        symbol: KarrTranscriptionV3Process.next_update
      note: Process works directly in per-tick integer counts; no unit conversion needed.
  note: "This process does not require unit conversion (per-tick integer counts throughout)."
