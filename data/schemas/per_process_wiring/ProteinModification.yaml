  matlab_blocks:
    class_and_scope:
      path: "docs/design/pb_turn8_protein_modification.md"
      lines: "1-24"
      note: "Process identity, enzyme count, and fixture scope."
    request_formula:
      path: "plan.md"
      lines: "1209-1222"
      note: "Audit note pointing at ProteinModification.m lines 354-365 as the feasibility oracle."
    stochastic_update:
      path: "plan.md"
      lines: "1198-1209"
      note: "Audit note pointing at ProteinModification.m lines 361-375 and the stochasticRound+randsample path."
    lifecycle_context:
      path: "docs/design/pb_final_chassis_v4_integration.md"
      lines: "65-65"
      note: "Translation -> ProteinProcessingI -> ProteinFolding -> ProteinModification -> ProteinActivation pipeline."
  oc_blocks:
    class_and_fixture_load:
      path: "opencell/vivarium/karr_protein_modification.py"
      lines: "61-133"
      note: "Class definition, fixture load, and state-shape setup."
    allocator_and_next_update:
      path: "opencell/vivarium/karr_protein_modification.py"
      lines: "196-354"
      note: "Strict-zero substrate read path, stochastic tick update, and substrate writeback."
    biology_sampler:
      path: "opencell/vivarium/karr_protein_modification.py"
      lines: "356-481"
      note: "Feasibility helpers, weighted sampling, and stoichiometric projection."
    request_calculator:
      path: "opencell/vivarium/karr_request_calculators.py"
      lines: "362-545"
      note: "Shared protein-pathway request step."
    allocation_step:
      path: "opencell/vivarium/karr_allocation_step.py"
      lines: "210-280"
      note: "Fair-share allocator that writes substrates_allocated."
