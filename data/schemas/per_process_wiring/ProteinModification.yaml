deviations:
  lp_bounds_source:
    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "docs/design/pb_turn8_protein_modification.md"
      lines: "14-21"
      note: "Design summary shows a count-based stochastic process, not an LP process."
    oc_anchor:
      path: "opencell/vivarium/karr_protein_modification.py"
      lines: "61-133"
      note: "OC class load path; no LP bounds method exists."
  shared_pool_projection_merges_compartments: false
  known_deviations:
    - "OC has a replay-only trace_hint.unmodifiedMonomers_next short-circuit that bypasses the biology sampler when present."
    - "OC reads substrates from substrates_allocated[self.name] rather than the global substrates store; this is equivalent under scheduler control but different plumbing."
    - "OC retains a legacy _n_completed scratch vector and a max_stochastic_iterations cap for replay/test compatibility; MATLAB does not expose those implementation details."
  note: "The known differences are plumbing and replay controls rather than the chemistry itself."
