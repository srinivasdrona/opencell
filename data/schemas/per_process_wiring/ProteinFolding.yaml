      note: "No per-process flux-bounds block is present for ProteinFolding. This process does not have Karr's calcFluxBounds method; it does not participate in FBA."
    oc:
      symbol: "KarrProteinFoldingProcess"
      source:
        path: "opencell/vivarium/karr_protein_folding.py"
        lines: "98-477"
        note: "Current port has no calcFluxBounds routine. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrProteinFoldingProcess"
      note: "There is no ProteinFolding-specific flux-bounds implementation in OC. OC does not implement this Karr method."
    status: "not_implemented"
    note: "This process uses allocation and per-tick folding updates, not a flux-bounds solver. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both Karr and current OC route ProteinFolding through per-process substrate allocation; OC reads from substrates_allocated[self.name]."
  request_formula:
    matlab: "calcResourceRequirements_Current = proteinProstheticGroupMatrix' * ([unfoldedMonomers; unfoldedComplexs] when all enzymes are available, else ((min(enzymes(:, ones(size(proteinChaperoneMatrix, 1), 1))' ./ proteinChaperoneMatrix, [], 2) > 0) .* [unfoldedMonomers; unfoldedComplexs]))"
    oc: "RequestCalculatorProteinPathway.next_update sets ProteinFolding requests to max(0, substrate_state[wid]) for ATP, FE2, MG, and ZN when any unfolded monomer is present."
    note: "MATLAB request demand is prosthetic-matrix-only (enzyme-gated) with no ATP additive term; OC request path is shared with other protein-maturation processes and records the current ProteinFolding slice."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "oc"
      note: "OC-only chaperone-cycle allocator request; MATLAB request demand is prosthetic-matrix-only."
    - wid: "FE2"
      compartment: "cytosol"
      source: "both"
      note: "Prosthetic-group allocator request."
    - wid: "MG"
      compartment: "cytosol"
      source: "both"
      note: "Prosthetic-group allocator request."
    - wid: "ZN"
      compartment: "cytosol"
      source: "both"
      note: "Prosthetic-group allocator request."
    - wid: "K"
      compartment: "cytosol"
      source: "karr"
      note: "Karr prosthetic-group request surface; current OC helper does not emit this ion."
  bypasses: []
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "OC-only ATP handling: phase-2 uses feasibility gate atp_remaining < 0 and per-event ATP decrement min(atp_remaining, 4); MATLAB evolveState has no ATP substrate decrement or ATP-gating term"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinFolding.m"
      lines: "533-570"
      note: "MATLAB evolveState computes stochastic fold fluxes and writes back only prosthetic-matrix substrate deltas (no ATP-specific decrement)."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_protein_folding.py"
      lines: "427-479"
      note: "Phase-2 chaperone folding applies ATP feasibility via atp_remaining < 0 and decrements ATP by min(atp_remaining, 4) per accepted chaperone-dependent fold."
      symbol: KarrProteinFoldingProcess._phase2_chaperone_folding
    note: "MATLAB decrements prosthetic-group substrates; OC decrements ATP in phase 2. See known_deviations."
    kind: expression
  - wid: "FE2"
    compartment: "cytosol"
    formula_or_constant: "proteinProstheticGroupMatrix[i, FE2] * fold_events_i"
    matlab_anchor:
      path: "docs/karr_extracts/process/19_ProteinFolding.md"
      lines: "1-175"
      note: "Ion-binding prosthetic-group requirements."
      symbol: Karr Process - ProteinFolding
