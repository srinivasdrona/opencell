    matlab:
      symbol: "ProteinFolding"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ProteinFolding.m"
        lines: "1-175"
        note: "Not a flux-bounds process; ProteinFolding is not an FBA module. Class-level anchor used to record calcFluxBounds absence."
