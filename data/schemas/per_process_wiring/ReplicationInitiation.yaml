allocator:
  mode:
    karr: "allocation"
    oc_current: "allocation"
    note: "Both sides treat ATP and H2O as allocator-mediated inputs; the OC port reads from substrates_allocated[self.name]."
  request_formula:
    matlab: "result(ATP) = free DnaA + DnaA-ADP + bound DnaA-ADP; result(H2O) = (2:7) * DnaA_polymer_ATP"
    oc: "update['requests'][self.name][ATP] = max(0, free_dnaa_adp); update['requests'][self.name][H2O] = max(0, free_dnaa_atp)"
    note: "The OC request is emitted inside next_update; there is no separate request-calculator file."
  requests:
    - wid: "ATP"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator request for free-DnaA activation and maintenance demand."
    - wid: "H2O"
      compartment: "cytosol"
      source: "karr"
      note: "Allocator request for polymer hydrolysis."
  bypasses:
    - wid: "ADP"
      compartment: "cytosol"
      source: "oc"
      note: "Written directly to substrates as a hydrolysis product."
    - wid: "PI"
      compartment: "cytosol"
      source: "oc"
      note: "Written directly to substrates as a hydrolysis product."
    - wid: "H"
      compartment: "cytosol"
      source: "oc"
      note: "Written directly to substrates as a hydrolysis product."
consume_stoichiometry:
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "nActivations = min(this.substrates(this.substrateIndexs_atp), this.enzymes(this.enzymeIndexs_DnaA)); ATP consumed = nActivations"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ReplicationInitiation.m"
      lines: "536-550"
      note: "activateFreeDnaA consumes ATP one-for-one with DnaA activation."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_replication_initiation.py"
      lines: "740-747"
      note: "Activation helper subtracts allocated ATP."
      symbol: KarrReplicationInitiationProcess._activate_free_dnaa
    kind: expression
  - wid: "ATP"
    compartment: "cytosol"
    formula_or_constant: "nReactivations = stochasticRound(min(this.substrates(this.substrateIndexs_atp), this.enzymes(this.enzymeIndexs_DnaAADP)) * this.reactivationRate); ATP consumed = nReactivations"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ReplicationInitiation.m"
      lines: "865-883"
      note: "reactivateFreeDnaAADP consumes ATP while regenerating free DnaA-ATP."
      symbol: releaseDnaAAxP
    oc_anchor:
      path: "opencell/vivarium/karr_replication_initiation.py"
      lines: "923-938"
      note: "Reactivation helper updates protein pools only and does not emit ATP substrate decrement."
      symbol: KarrReplicationInitiationProcess._reactivate_free_dnaa_adp
    note: "MATLAB decrements ATP in reactivation; OC does not. See known_deviations."
    kind: expression
  - wid: "H2O"
    compartment: "cytosol"
    formula_or_constant: "MATLAB: nDissociatingMonomers = (2:7) * nDissociatingPolymers with water clipping; OC: hydrolysis events are sampled from free DnaA-ATP and then clipped to available H2O (non-equivalent formula family)."
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ReplicationInitiation.m"
      lines: "560-581"
      note: "inactivateFreeDnaAATP hydrolyzes DnaA polymers and consumes water."
      symbol: calcResourceRequirements_Current
    oc_anchor:
      path: "opencell/vivarium/karr_replication_initiation.py"
      lines: "749-777"
      note: "Hydrolysis helper uses free-DnaA-ATP binomial dissociation with H2O clipping; this is not MATLAB's polymer-indexed formula."
      symbol: KarrReplicationInitiationProcess._inactivate_free_dnaa_atp
    note: "MATLAB enforces polymer-indexed hydrolysis demand; OC uses free-pool event sampling instead (CODE_DEVIATES)."
    kind: expression
produce_stoichiometry:
  - wid: "ADP"
    compartment: "cytosol"
    formula_or_constant: "MATLAB: ADP produced = nReactivations in reactivateFreeDnaAADP (ATP -> ADP); OC: ADP produced = nDissociatingMonomers in hydrolysis helper."
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ReplicationInitiation.m"
      lines: "865-883"
      note: "reactivateFreeDnaAADP produces substrate ADP while consuming ATP."
