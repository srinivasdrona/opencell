    oc_anchor:
      path: "opencell/vivarium/karr_replication_initiation.py"
      lines: "774-777"
      note: "Hydrolysis product written directly to substrates."
      symbol: KarrReplicationInitiationProcess._inactivate_free_dnaa_atp
    kind: expression
  - wid: "H"
    compartment: "cytosol"
    formula_or_constant: "nDissociatingMonomers"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/ReplicationInitiation.m"
      lines: "576-581"
      note: "Hydrolysis product from inactivateFreeDnaAATP."
      symbol: calcResourceRequirements_Current
    oc_anchor:
