deviations:
  lp_bounds_source:
    karr: "unknown"
    oc_current: "unknown"
    matlab_anchor:
      path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TranscriptionalRegulation.m"
      lines: "310-400"
      note: "Primary model methods contain no calcFluxBounds implementation."
      symbol: TranscriptionalRegulation
    oc_anchor:
      path: "opencell/vivarium/karr_transcriptional_regulation.py"
      lines: "782-857"
      note: "No flux-bound helper exists in the OC port. Line range re-fixed 2026-09-08 (twice: once after the accessibility completion, again after extracting candidate_sites_for_tf) -- see l1b_verify_wiring.py check_oc_anchors_resolve. Computed via direct ast.parse (tmp/compute_anchor_lines.py) rather than manual line-counting, to avoid a third drift."
      symbol: KarrTranscriptionalRegulationProcess.ports_schema
  shared_pool_projection_merges_compartments: false
  known_deviations:
    - "Production topology (Stage A+B, dec-007) now maps protein/complex/tf_binding/tx_rate_fold_change AND chromosome (the state-owned `_shared_rand_stream_state` RNG leaf, DC-2). It still omits authoritative tf_bound_promoters/bound_tfs state and enzymes/boundEnzymes chromosome writeback -- the production chassis does not yet persist those surfaces to the shared ChromosomeStore; this is deferred to Stage C (store-centralized accessibility + private-surface removal)."
    - "MATLAB's random binding draws come from the shared chromosome randStream, interleaved with other chromosome-binding processes. OC production now draws from the state-owned, serialized `ChromosomeStateRandStream` (Stage A+B, dec-007) reconstructed fresh each tick from the chromosome leaf -- a single-consumer migration that preserves the prior draw sequence bit-for-bit (dec-006 L2.1 replay unchanged); autonomous chassis execution still does not reproduce Karr's real inter-process draw interleaving (deferred to the Stage E multi-consumer commit owner)."
    - "MATLAB stores tx_rate_fold_change with a strand axis (nTU x 2), while OC emits a single scalar fold-change per TU."
    - "MATLAB bindProteinToChromosome writes newly bound TF footprints into shared chromosome monomerBoundSites/complexBoundSites; OC records its own tf_bound_promoters but does not write those TF footprints back to the shared chromosome occupancy arrays."
    - "OC initializes tf_binding from the first tick rather than performing Karr's documented t=0 pre-binding sweep."
  note: "Stochastic affinity-weighted binding and accessibility/occlusion logic exist in the process class. MATLAB's zero request hook versus OC's missing hook is resource-equivalent. Stage A+B (dec-007) closed the production topology/RNG-provenance gaps for the chromosome RNG stream; open fidelity reductions are the authoritative chromosome bound-site writeback (Stage C), t=0 initialization timing (Stage D), and projection of MATLAB's two fold-change columns to one downstream value (deferred joint stage)."
