    matlab:
      symbol: "TranscriptionalRegulation"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TranscriptionalRegulation.m"
        lines: "110-110"
        note: "No flux-bound or LP-bound logic is described for this process. Class-level anchor used to record calcFluxBounds absence."
        symbol: "TranscriptionalRegulation"
      note: This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
    oc:
