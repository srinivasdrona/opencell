    - "OC does not implement a request-calculator surface for this process; it reads protein.counts / complex.counts directly."
    - "2026-09-03 L2.1 fix: MATLAB binds TFs only on chromosome-accessible sites (isRegionPolymerized) not sterically occluded by another bound protein (isRegionAccessible); OC now gates on both (_is_polymerized / _third_party_site_occluded) using the real site-level tf_bound_promoters/bound_tfs surfaces (34-element site x chromosome-copy, 5-element per-TF), replacing the prior TU-level (130-element) approximation and the fabricated release-on-copy-drop logic. 2026-09-05 UPDATE: closed to GENUINE (full 4000/4000-tick bit identity) via a hash-bound per-tick chromosome-randStream draw ledger (dec-006, filed as dec-005 at the time) restoring Karr's real shared-RNG input state, plus two further occlusion-formula corrections (query-TF-own-footprint interval overlap; dsDNA cross-strand-pair occlusion). 2026-09-08 UPDATE (Opus re-review, integration): re-derived `_shifted_damage_position`'s three damage-adjacency shift kinds directly from `Chromosome.m`'s actual property getters (the prior `base5`/`bond5`/`bond3` set for intrastrandCrossLinks/strandBreaks had misattributed the shift/unshift helper each computed property actually uses -- corrected to `base3`/`unbond5`/`unbond3`; hollidayJunctions' bond5/bond3 mapping was already correct), added the two remaining isRegionAccessible components (damage exclusion via _site_damaged; excludeOverlappingRegions self-overlap exclusion via _sites_overlap), and regenerated the chromosome-RNG ledger + manifest hashes against current main. Neither the shift correction nor the two added components changes the validated 4000/4000-tick result (zero damage entries / no self-overlapping draws in the genuine trace) but the algorithm is now genuinely complete and source-verified against Karr's real Chromosome.m::isRegionAccessible, not merely correct-by-absence-of-counterexample. See STATUS_L21_TXREG_ACTIVE_FIX.md's '2026-09-05 chromosome-RNG-ledger closure' section and docs/phase_f/l2_1/L21_ACTIVE_WINDOWS_MANIFEST.json's genuine_evidence note."
    - "MATLAB participates in allocator sequencing with calcResourceRequirements_Current (zero request vector); OC bypasses allocator mediation for this process."
    - "MATLAB stores tx_rate_fold_change with a strand axis (nTU x 2), while OC emits a single scalar fold-change per TU."
    - "OC initializes tf_binding from the first tick rather than performing Karr's documented t=0 pre-binding sweep."
    - This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
  note: "Regulatory-only process with no substrate stoichiometry or LP bounds; MATLAB participates in allocation via a zero-request hook, OC bypasses allocation, and OC projects MATLAB strand-resolved fold-change state to one scalar per TU."
