schema_version: "2.0"
schema_date: '2026-07-07'
process:
  name: "TranscriptionalRegulation"
  matlab_class: "TranscriptionalRegulation"
  matlab_file: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TranscriptionalRegulation.m"
  oc_class: "KarrTranscriptionalRegulationProcess"
  oc_file: "opencell/vivarium/karr_transcriptional_regulation.py"
  whole_cell_model_id: "Process_TranscriptionalRegulation"
  functional_area: "RNA-synthesis-and-maturation"
  state_shape_role: "stochastic affinity-weighted TF binding plus fold-change; no substrate stoichiometry"
  notes: >-
    This process is stochastic, not deterministic. MATLAB performs
    affinity-weighted random TF-site binding on accessible chromosome sites;
    current OC implements the same stochastic family with explicit chromosome
    RNG handling. Stage A+B (dec-007, 2026-10-14) wires the `chromosome` port
    into production topology and swaps the per-process RNG stand-in for the
    `ChromosomeStore`-owned shared `ChromosomeStateRandStream`; the
    authoritative bound-site writeback (`monomerBoundSites`/
    `complexBoundSites`) and private `tf_bound_promoters` removal remain
    deferred to Stage C.
