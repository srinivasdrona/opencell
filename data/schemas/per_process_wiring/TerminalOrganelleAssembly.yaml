  functional_area: "cell-organization"
  state_shape_role: "wiring row for terminal-organelle assembly state and update semantics"
  notes: "MATLAB builds a 10-reaction localization hierarchy over 8 proteins; the OC port is Karr-light and tracks coarse assembly counters."
integration_touchpoints:
  calcResourceRequirements_Current:
    matlab:
      symbol: "calcResourceRequirements_Current"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TerminalOrganelleAssembly.m"
        lines: "310-313"
        note: "Returns `zeros(size(this.substrates))`."
        symbol: "calcResourceRequirements_Current"
    oc:
      symbol: "KarrTerminalOrganelleAssemblyProcess"
      source:
        path: "opencell/vivarium/karr_terminal_organelle_assembly.py"
        lines: "89-458"
        note: "OC `next_update` reads and updates `states['substrates']` directly; there is no dedicated request calculator. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrTerminalOrganelleAssemblyProcess"
      note: OC does not implement this Karr method.
    status: "not_implemented"
    note: "The MATLAB hook exists but is identically zero, and the current OC runtime bypasses allocator mediation entirely. OC does not implement this Karr method."
  evolveState:
    matlab:
      symbol: "evolveState"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TerminalOrganelleAssembly.m"
        lines: "315-338"
        note: "Iterative localization loop: move every eligible unincorporated protein into the incorporated compartment."
        symbol: "evolveState"
    oc:
      symbol: "KarrTerminalOrganelleAssemblyProcess.next_update"
      source:
        path: "opencell/vivarium/karr_terminal_organelle_assembly.py"
        lines: "403-403"
        note: "Per-tick update path for cell counters and substrate deltas."
        symbol: "KarrTerminalOrganelleAssemblyProcess.next_update"
      supporting:
        - path: "opencell/vivarium/karr_terminal_organelle_assembly.py"
          lines: "357-401"
          note: "Trace-hint override plus compartment-transfer fallback for substrate deltas."
          symbol: KarrTerminalOrganelleAssemblyProcess._substrate_deltas_from_trace_hint
    status: "implemented"
    note: "The OC port preserves the hierarchical assembly intent, but it replaces the MATLAB in-place substrate loop with a Karr-light counter update and a fallback substrate writeback path."
  calcFluxBounds:
    matlab:
      symbol: "TerminalOrganelleAssembly"
      source:
        path: "data/m1_sources/WholeCell/src/+edu/+stanford/+covert/+cell/+sim/+process/TerminalOrganelleAssembly.m"
        lines: "283-353"
        note: "No calcFluxBounds method is present; this class is not an LP/bounds process. Class-level anchor used to record calcFluxBounds absence."
        symbol: "TerminalOrganelleAssembly"
      note: This process does not have Karr's calcFluxBounds method; it does not participate in FBA.
    oc:
      symbol: "KarrTerminalOrganelleAssemblyProcess"
      source:
        path: "opencell/vivarium/karr_terminal_organelle_assembly.py"
        lines: "89-458"
        note: "No bounds helper exists in the OC port. Representative OC anchor for non-implemented correspondence."
        symbol: "KarrTerminalOrganelleAssemblyProcess"
      note: OC does not implement this Karr method.
    status: "not_implemented"
    note: "TerminalOrganelleAssembly is state-local; there is no per-process flux-bound routine in either source. This process does not have Karr's calcFluxBounds method; it does not participate in FBA. OC does not implement this Karr method."
allocator:
  mode:
    karr: "allocation"
    oc_current: "bypass"
    note: "MATLAB exposes the allocator hook even though it returns a zero matrix; the OC port works directly from `states['substrates']`."
  request_formula:
    matlab: "zeros(size(this.substrates))"
    oc: "N/A; no request calculator exists and `next_update` reads `states['substrates']` directly."
    note: "The request hook is degenerate on the MATLAB side and absent on the OC side."
