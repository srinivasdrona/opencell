# Parameter Verification Cards — Micro-Model (Constitutive Gene Expression)
#
# Source: Thattai & van Oudenaarden (2001) PNAS 98(15), 8614–8619
# DOI: 10.1073/pnas.151588598
#
# REBUILT 2026-04-23 from the actual PDF (extracted via pypdf, 6 pages, 32K chars).
#
# VERBATIM SOURCE TEXT (Fig. 1 caption, page 8615, "base case"):
#   "The mRNA half-life is fixed at 2 min. The base case corresponds to a
#    burst size b = 20, a transcript initiation rate k_R = 0.01 s^-1 and a
#    protein half-life ln(2)/g_P = 1 h."
#
# Note on prior fabrications (preserved for institutional memory):
#   Round 1 (synthetic): values 0.2, 0.5, 0.5, 0.005 — invented, no source.
#   Round 2 ("Table 1"): values 0.30, 0.023, 5.0, 0.10 — paper has NO Table 1;
#     web-search "quote" was hallucinated; values 2x–15x off.
#   Round 3 (this file): values from Fig. 1 caption, verified PDF in hand.
#
# All four cards remain DRAFT until human review tool promotes them.

